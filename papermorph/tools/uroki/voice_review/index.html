<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><!-- works only from voice_review.py on this computer, not on the published site -->
<title>Озвучка уроков</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c6a4d'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='42' font-family='sans-serif' fill='%23fff'%3E%D0%B0%CC%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Озвучка уроков <small id="voice">Silero</small></div>
  <form id="find" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Найти слово во всей книге…" aria-label="Поиск по тексту озвучки">
  </form>
  <span id="status" aria-live="polite"></span>
  <div class="tools">
    <label class="opt" title="После выбора ударения сразу озвучить шаг и проиграть его с этого места">
      <input type="checkbox" id="auto"> озвучивать сразу</label>
    <label class="opt">скорость
      <select id="speed">
        <option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option>
        <option value="1.75">1,75×</option><option value="2">2×</option>
      </select></label>
    <button id="run" class="btn" title="Слушать шаги один за другим, дальше — следующая тема">▶ Подряд</button>
    <a id="queueBtn" class="btn" href="#queue" hidden title="Несохранённые правки и предложения: послушать и сохранить или отменить"></a>
    <button id="saveAll" class="btn primary" hidden></button>
    <a class="btn ghost" href="/uroki/" target="_blank" rel="noopener" title="Книга с этого сервера: в уроке есть кнопка «🎙 Озвучка»">Книга ↗</a>
  </div>
</header>
<div class="layout">
  <nav id="side" aria-label="Темы"></nav>
  <main id="main"><p class="loading"><i class="spin"></i> Загружаю книгу…</p></main>
</div>
<div id="pop" class="pop" hidden role="dialog" aria-label="Ударение"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="/app/app.js"></script>
</body>
</html>
