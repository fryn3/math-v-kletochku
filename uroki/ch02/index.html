<script>
'use strict';
// Тема 1.2 «Законы арифметики» (5 класс). Beat ids match papermorph/content/uroki/ch02/narration.ru.json.
const CHAPTER = { number: 2, label: '1.2', title: 'Законы арифметики', minutes: 8, language: 'ru', next: '../ch03/' };

// Colours in this lesson: the first addend / factor part KL.NUM, the second KL.TWO, cuts KL.DEN, laws KL.RULE.
const NUM = KL.NUM, TWO = KL.TWO, DEN = KL.DEN, RULE = KL.RULE;
const THOUSAND = '1 000';

/* ---------- maths on a line ---------- */
// One line of mathematics in colours: pieces are strings or { m, fill }, baseline at y.
function c02R(p, pieces, x, y, t0, { size = 60, anchor = 'middle', fill = COL.chalk } = {}) {
  return klRow(p, pieces.map(s => typeof s === 'string' ? { m: s } : s), x, y, t0, { msize: size, anchor, fill });
}
// Segments of one line that appear one after another: [[pieces, t], …] laid out from x. Returns { gs, x1 }.
function c02Seq(p, segs, x, y, { size = 60, fill } = {}) {
  let cx = x;
  const gs = segs.map(([pc, t]) => { const g = c02R(p, [].concat(pc), cx, y, t, { size, anchor: 'start', fill }); cx += g._w; return g; });
  return { gs, x0: x, x1: cx };
}
// A worked line aligned on its first «=» at xEq: L ends left of it (or null), segs start with the «=» itself.
function c02Eq(p, L, tL, segs, y, xEq, { size = 60, fill } = {}) {
  const l = L ? c02R(p, L, xEq - size * .5, y, tL, { size, anchor: 'end', fill }) : null;
  const s = c02Seq(p, segs, xEq - mathW(['='], size) / 2, y, { size, fill });
  return { l, lx0: xEq - size * .5 - (l ? l._w : 0), ...s };
}

/* ---------- pictures of products ---------- */
// A counter (a disc) as a group at (x, y), so it can be moved with tw/prog.
function c02Disc(p, x, y, r, fill, t0, op = .9) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  mk('circle', { r, fill, 'fill-opacity': op, stroke: COL.board, 'stroke-width': 2 }, g);
  if (t0 !== undefined) show(g, t0, .3);
  return g;
}
// A rectangle of rows × cols cells (cw × rh each) as a group at (x, y): faint cell lines, a tint in fill (shown unless
// tint: false) and a chalk frame (shown unless frame: false). Returns { g, tint, frame, w, h, x, y, cw, rh, cc(i, j) }.
function c02Cells(p, { x, y, rows, cols, cw, rh, fill, t0, tint = true, frame = true, op = .6 }) {
  rh = rh ?? cw;
  const w = cols * cw, h = rows * rh;
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  mk('rect', { width: w, height: h, fill: COL.chalk, 'fill-opacity': .07 }, g);
  const tintEl = put(mk('rect', { width: w, height: h, fill, 'fill-opacity': op }, g), { o: tint ? 1 : 0 });
  let d = '';
  for (let i = 1; i < cols; i++) d += `M${i * cw} 0V${h}`;
  for (let j = 1; j < rows; j++) d += `M0 ${j * rh}H${w}`;
  if (d) path(g, d, { stroke: COL.chalk, 'stroke-width': 1.5, 'stroke-opacity': .4 });
  const fr = put(mk('rect', { width: w, height: h, fill: 'none', stroke: COL.chalk, 'stroke-width': 3.5, rx: 2 }, g), { o: frame ? 1 : 0 });
  if (t0 !== undefined) show(g, t0);
  return { g, tint: tintEl, frame: fr, w, h, x, y, cw, rh, cc: (i, j) => [x + (j + .5) * cw, y + (i + .5) * rh] };
}
// A plain frame w × h at (x, y), hidden unless o is given.
function c02Frame(p, x, y, w, h, { o = 0, stroke = COL.chalk, width = 3.5, dash } = {}) {
  const a = { x, y, width: w, height: h, fill: 'none', stroke, 'stroke-width': width, rx: 2 };
  if (dash) a['stroke-dasharray'] = dash;
  return put(mk('rect', a, p), { o });
}
// A bracket over (up) or under x1 … x2 at height y with its label, as one group that can fade or move (state x).
function c02Brace(p, x1, x2, y, label, t0, { up = true, fill = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 }), k = up ? 12 : -12;
  path(g, `M${x1} ${y + k}V${y}H${x2}V${y + k}`, { stroke: fill, 'stroke-width': 3 });
  T(g, label, { x: (x1 + x2) / 2, y: up ? y - 14 : y + size * .95, size, fill, weight: 600, anchor: 'middle' });
  if (t0 !== undefined) show(g, t0);
  return g;
}
// An oval drawn on round a number: rx × ry about (cx, cy).
function c02Ring(p, cx, cy, rx, ry, col, t0, dur = .45) {
  const e = path(p, `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0`, { stroke: col, 'stroke-width': 4 }, { d: 0 });
  if (t0 !== undefined) draw(e, t0, dur);
  return e;
}
// A block of dots, rows × cols, spacing s, top-left dot at (x, y): one group per row (rows[i]), all in one group.
function c02Dots(p, x, y, rows, cols, { s = 30, r = 10, fill = NUM, op = .9, t0 } = {}) {
  const g = G(p, { o: t0 === undefined ? 1 : 0 });
  const rs = Array.from({ length: rows }, (_, i) => {
    const rg = G(g, { x: 0, y: 0 });
    for (let j = 0; j < cols; j++) mk('circle', { cx: x + j * s, cy: y + i * s, r, fill, 'fill-opacity': op }, rg);
    return rg;
  });
  if (t0 !== undefined) show(g, t0, .4);
  return { g, rows: rs };
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Законы арифметики', (m, D) => klIntro(m, D, {
    unit: 'Глава 1 · Числа и действия · Тема 1.2',
    title: 'Законы арифметики',
    sub: 'Три закона, с которыми считать проще и быстрее',
    art: (g, t0) => {
      c02Cells(g, { x: 410, y: 540, rows: 3, cols: 4, cw: 34, fill: NUM, t0 });
      c02Cells(g, { x: 410 + 4 * 34 + 10, y: 540, rows: 3, cols: 2, cw: 34, fill: TWO, t0: t0 + .15 });
      c02R(g, ['a · (', { m: 'b', fill: NUM }, ' + ', { m: 'c', fill: TWO }, ') = a · ', { m: 'b', fill: NUM }, ' + a · ', { m: 'c', fill: TWO }], 670, 606, t0 + .3, { size: 46, anchor: 'start' });
    },
  })],

  ['swap', 'Переместительный закон', m => {
    const p = panel(0);
    klTitle(p, 'Переместительный закон');
    // Sum: three counters and five counters trade places; the count stays eight.
    const Y = 400, R = 26, SP = 64, AX = 162, BX = 404;
    const A = [0, 1, 2].map(i => c02Disc(p, AX + i * SP, Y, R, NUM, .2 + i * .06));
    const B = [0, 1, 2, 3, 4].map(i => c02Disc(p, BX + i * SP, Y, R, TWO, .35 + i * .06));
    const lab = (s, x, t, fill) => klText(p, s, x, Y + 110, t, { size: 44, fill, weight: 700, anchor: 'middle' });
    const la = lab('3', AX + SP, m('add', .3), NUM), lb = lab('5', BX + 2 * SP, m('add', .6), TWO);
    c02R(p, [{ m: '3', fill: NUM }, ' + ', { m: '5', fill: TWO }, ' = 8'], 410, 660, m('add', 1.4));
    const t = m('swapadd');
    hide(la, t, .25); hide(lb, t, .25);
    B.forEach((d, i) => { const x0 = BX + i * SP, x1 = AX + i * SP; prog(q => put(d, { x: x0 + (x1 - x0) * q, y: Y + Math.sin(Math.PI * q) * 38 }), t + .1 + i * .05, 1, io); });
    A.forEach((d, i) => { const x0 = AX + i * SP, x1 = AX + 5 * SP + 50 + i * SP; prog(q => put(d, { x: x0 + (x1 - x0) * q, y: Y - Math.sin(Math.PI * q) * 120 }), t + .1 + i * .05, 1, io); });
    lab('5', AX + 2 * SP, t + 1.3, TWO); lab('3', AX + 6 * SP + 50, t + 1.3, NUM);
    c02R(p, [{ m: '5', fill: TWO }, ' + ', { m: '3', fill: NUM }, ' = 8'], 410, 740, t + 1.6);
    c02R(p, ['a + b = b + a'], 410, 840, m('lawadd', .3), { fill: RULE });
    // Product: three rows of five dots turned a quarter turn become five rows of three.
    const CX = 1150, CY = 430, DS = 70;
    const arr = G(p, { x: CX, y: CY, o: 0 });
    const rowsA = [0, 1, 2].map(i => put(mk('rect', { x: -2.5 * DS + 4, y: (i - 1) * DS - 31, width: 5 * DS - 8, height: 62, rx: 31, fill: 'none', stroke: RULE, 'stroke-width': 3 }, arr), { o: 0 }));
    for (let i = 0; i < 3; i++) for (let j = 0; j < 5; j++) mk('circle', { cx: (j - 2) * DS, cy: (i - 1) * DS, r: 22, fill: COL.chalk, 'fill-opacity': .85 }, arr);
    show(arr, m('arr'), .5);
    rowsA.forEach((e, i) => show(e, m('arr', 1.4 + i * .25), .3));
    const said1 = klText(p, '3 ряда по 5', CX, 236, m('arr', 1.4), { size: 32, fill: COL.dim, anchor: 'middle' });
    c02R(p, ['3 · 5 = 15'], CX, 660, m('arr', 2.6));
    rowsA.forEach(e => hide(e, m('turn', -.3), .3));
    hide(said1, m('turn', -.3), .3);
    tw(arr, { r: 90 }, m('turn'), 1.4);
    const rowsB = G(p, { x: CX, y: CY });
    [0, 1, 2, 3, 4].forEach(i => { const e = put(mk('rect', { x: -1.5 * DS + 4, y: (i - 2) * DS - 31, width: 3 * DS - 8, height: 62, rx: 31, fill: 'none', stroke: RULE, 'stroke-width': 3 }, rowsB), { o: 0 }); show(e, m('after', .2 + i * .2), .3); });
    klText(p, '5 рядов по 3', CX, 236, m('after', .4), { size: 32, fill: COL.dim, anchor: 'middle' });
    c02R(p, ['5 · 3 = 15'], CX, 740, m('after', 2.6));
    c02R(p, ['a · b = b · a'], CX, 840, m('lawmul', .3), { fill: RULE });
  }],

  ['group', 'Сочетательный закон', m => {
    const p = panel(0);
    klTitle(p, 'Сочетательный закон');
    // Three heaps of dots: 7, 8 and 2. Only the frame (the brackets) moves; the dots stay, so the total stays.
    const heap = (n, x0, t) => {
      const g = G(p, { o: 0 }), top = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) mk('circle', { cx: x0 + (i < top ? i : i - top) * 40, cy: i < top ? 255 : 300, r: 15, fill: COL.chalk, 'fill-opacity': .85 }, g);
      show(g, t, .4);
      return g;
    };
    heap(7, 220, .2); heap(8, 480, .3); heap(2, 760, .4);
    klMath(p, ['+'], 410, 293, .3, { size: 56 }); klMath(p, ['+'], 690, 293, .4, { size: 56 });
    [['7', 280], ['8', 540], ['2', 760]].forEach(([s, x], i) => klText(p, s, x, 380, m('dots', i * .4), { size: 44, weight: 700, anchor: 'middle' }));
    const fr = put(mk('rect', { x: 186, y: 222, width: 448, height: 112, rx: 28, fill: 'none', stroke: RULE, 'stroke-width': 4 }, p), { o: 0 });
    show(fr, m('left'), .4);
    const s15 = klText(p, '15', 410, 206, m('l15'), { size: 38, fill: RULE, weight: 700, anchor: 'middle' });
    hide(s15, m('right', -.2), .3);
    tw(fr, { a_x: 446, a_width: 348 }, m('right'), .9);
    klText(p, '10', 620, 206, m('r10'), { size: 38, fill: RULE, weight: 700, anchor: 'middle' });
    const XE = 520;
    c02Eq(p, ['(7 + 8) + 2'], m('left', .3), [['= 15 + 2', m('l15', .3)], [' = 17', m('l17')]], 490, XE, { size: 54 });
    c02Eq(p, ['7 + (8 + 2)'], m('right', .3), [['= 7 + 10', m('r10', .3)], [' = 17', m('r17')]], 580, XE, { size: 54 });
    c02R(p, ['(a + b) + c = a + (b + c)'], 1190, 545, m('law', .3), { size: 52, fill: RULE });
    c02Eq(p, ['(2 · 5) · 7'], m('m1'), [['= 10 · 7', m('m10')], [' = 70', m('m70')]], 710, XE, { size: 54 });
    c02Eq(p, ['2 · (5 · 7)'], m('m2'), [['= 2 · 35', m('m35')], [' = 70', m('m70b')]], 800, XE, { size: 54 });
    c02R(p, ['(a · b) · c = a · (b · c)'], 1190, 765, m('mul', .3), { size: 52, fill: RULE });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    const row = tokens(p, ['37', ' + ', '25', ' + ', '75'], { x: 700, y: 330, size: 110, anchor: 'middle', o: 0 });
    row.forEach((e, i) => show(e, .2 + i * .08));
    const x0 = row[0]._px, x2 = row[2]._px, x4 = row[4]._px;
    const br = d => { const e = path(p, d, { stroke: COL.chalk, 'stroke-width': 4, 'stroke-opacity': .75 }, { o: 0 }); show(e, .7); return e; };
    S.q1 = {
      b: [br(`M${x0} 372V398H${x2 - 12}V372`), br(`M${x2 + 12} 372V452H${x4}V372`), br(`M${x0} 240V200H${x4}V240`)],
      boxes: [[x0 - 34, 360, x2 - 12 - x0 + 68, 50], [x2 + 12 - 34, 414, x4 - x2 - 12 + 68, 56], [x0 - 34, 180, x4 - x0 + 68, 70]],
      sum: klText(p, '100', (x2 + x4) / 2 + 6, 510, undefined, { size: 44, fill: RULE, weight: 700, anchor: 'middle' }),
      ans: c02R(p, [' = 37 + 100 = 137'], row.x + row.w / 2 + 10, 330, undefined, { size: 64, anchor: 'start' }),
    };
    put(S.q1.sum, { o: 0 }); put(S.q1.ans, { o: 0 });
  }, { ask: done => quiz(BAND, [{
    id: 'c-gruppa', prompt: 'Какие два числа удобно сложить первыми? Нажми на их скобку.',
    build: pickEls(S.q1.b.map((e, i) => ({ el: e, box: S.q1.boxes[i], label: ['37 и 25', '25 и 75', '37 и 75'][i] })), 1,
      '25 + 75 = 100, а 37 + 100 = 137. Сочетательный закон разрешает сложить их первыми.',
      i => i === 0 ? '37 + 25 = 62 — не круглое число. Поищи пару, которая даёт ровно сто.' : '37 + 75 = 112 — считать дальше неудобно. Какие два числа дают ровно сто?',
      () => { fx(S.q1.b[1], { c_stroke: RULE, 'a_stroke-width': 6 }, 0, .3); fx(S.q1.sum, { o: 1 }, .2, .4); fx(S.q1.ans, { o: 1 }, .6, .5); }),
  }], done) }],

  ['convenient', 'Удобный способ', m => {
    const p = panel(0);
    klTitle(p, 'Удобный способ счёта');
    const Y = 330;
    const row = tokens(p, [{ t: '25', fill: NUM }, ' · ', '7', ' · ', { t: '4', fill: NUM }], { x: 420, y: Y, size: 96, anchor: 'middle', o: 0 });
    row.forEach((e, i) => show(e, .2 + i * .1));
    // 7 and 4 trade places: 7 over the top, 4 underneath.
    const x7 = row[2]._px, x4 = row[4]._px, t = m('swap', 1.2);
    prog(q => put(row[2], { x: x7 + (x4 - x7) * q, y: Y - Math.sin(Math.PI * q) * 110 }), t, 1.1, io);
    prog(q => put(row[4], { x: x4 + (x7 - x4) * q, y: Y + Math.sin(Math.PI * q) * 80 }), t, 1.1, io);
    const arcs = [path(p, `M${x7} ${Y - 90}Q${(x7 + x4) / 2} ${Y - 220} ${x4} ${Y - 90}`, { stroke: COL.dim, 'stroke-width': 2.5, 'stroke-dasharray': '7 7' }, { o: 0 }),
      path(p, `M${x4} ${Y + 30}Q${(x7 + x4) / 2} ${Y + 150} ${x7} ${Y + 30}`, { stroke: COL.dim, 'stroke-width': 2.5, 'stroke-dasharray': '7 7' }, { o: 0 })];
    arcs.forEach(e => { show(e, t - .3, .3); hide(e, t + 1.3, .4); });
    row[2]._px = x4; row[4]._px = x7;
    const row2 = Object.assign([row[0], row[1], row[4], row[3], row[2]], { w: row.w, x: row.x, y: row.y, size: row.size, anchor: row.anchor });
    // 25 and 4 side by side: a frame round them, then they collapse into 100.
    const L = row2[0]._px - row2[0]._w / 2 - 12, Rr = row2[2]._px + row2[2]._w / 2 + 12;
    const box = put(mk('rect', { x: L, y: Y - 92, width: Rr - L, height: 124, rx: 14, fill: 'none', stroke: NUM, 'stroke-width': 4 }, p), { o: 0 });
    show(box, m('pair'), .4); hide(box, m('sto', -.1), .2);
    const row3 = collapse(row2, 0, 2, ['100'], m('sto', -.1), { color: RULE, fill: NUM });
    const last = row3[row3.length - 1];
    c02R(p, [' = 700'], last._px + last._w / 2 + 8, Y, m('res', .9), { size: 96, anchor: 'start' });
    c02R(p, ['25 · 7 · 4 = (25 · 4) · 7 = 100 · 7 = 700'], 470, 500, m('res', 2), { size: 42, fill: COL.dim });
    // The hundred square: four blocks of 25 cells.
    const H = klHundred(p, { x: 1040, y: 190, c: 40, t0: m('hund', -.4) });
    path(H.top, `M1240 190V590M1040 390H1440`, { stroke: COL.chalk, 'stroke-width': 4 });
    [[0, 0], [0, 5], [5, 0], [5, 5]].forEach(([i, j], k) => {
      show(H.cell(i, j, 5, 5, NUM), m('hund', .2 + k * .3), .3);
      klText(p, '25', 1040 + j * 40 + 100, 190 + i * 40 + 114, m('hund', .3 + k * .3), { size: 44, fill: COL.board, weight: 700, anchor: 'middle' });
    });
    const sqFrame = c02Frame(p, 1040, 190, 400, 400, { stroke: RULE, width: 7 });
    show(sqFrame, m('sq'), .3);
    c02R(p, ['4 · 25 = 100'], 1240, 668, m('sq', .3), { size: 52 });
    [['2 · 5 = 10', 300, 'p1'], ['4 · 25 = 100', 800, 'p2'], ['8 · 125 = ' + THOUSAND, 1300, 'p3']].forEach(([s, x, k]) => c02R(p, [s], x, 810, m(k), { size: 52, fill: RULE }));
  }],

  ['distrib', 'Распределительный закон', m => {
    const p = panel(0);
    klTitle(p, 'Распределительный закон');
    const X = 150, Y = 300, C = 80, GAP = 70;
    const L = c02Cells(p, { x: X, y: Y, rows: 3, cols: 4, cw: C, fill: NUM, tint: false, frame: false, t0: .2, op: .75 });
    const Rr = c02Cells(p, { x: X + 4 * C, y: Y, rows: 3, cols: 2, cw: C, fill: TWO, tint: false, frame: false, t0: .2, op: .75 });
    // While whole, the seam is an ordinary cell line and one frame goes round all of it.
    const seam = path(p, `M${X + 4 * C} ${Y}V${Y + 3 * C}`, { stroke: COL.chalk, 'stroke-width': 1.5, 'stroke-opacity': .4 }, { o: 0 });
    show(seam, .2);
    const whole = c02Frame(p, X, Y, 6 * C, 3 * C, { o: 0 });
    show(whole, .2);
    klText(p, '3', X - 40, Y + 1.5 * C + 16, m('rect', .5), { size: 44, weight: 700, anchor: 'middle' });
    const b6 = c02Brace(p, X, X + 6 * C, Y - 24, '6', m('rect', 1.2));
    c02Eq(p, ['3 · 6'], m('whole'), [['= 18', m('w18')]], 380, 1100, { size: 56 });
    // Six is four and two: the parts take their colours, a cut runs along the seam and the right part slides away.
    hide(b6, m('split'), .3);
    show(L.tint, m('split', .3), .4); show(Rr.tint, m('split', .9), .4);
    c02Brace(p, X, X + 4 * C, Y - 24, '4', m('split', .3), { fill: NUM });
    const b2 = c02Brace(p, X + 4 * C, X + 6 * C, Y - 24, '2', m('split', .9), { fill: TWO });
    c02Eq(p, ['3 · (', { m: '4', fill: NUM }, ' + ', { m: '2', fill: TWO }, ')'], m('split', 1.2), [], 490, 1100, { size: 56 });
    const cut = path(p, `M${X + 4 * C} ${Y - 14}V${Y + 3 * C + 14}`, { stroke: DEN, 'stroke-width': 5 }, { d: 0 });
    draw(cut, m('apart'), .5);
    hide(cut, m('apart', 1), .3); hide(whole, m('apart', .6), .3); hide(seam, m('apart', .6), .3);
    show(L.frame, m('apart', .6), .3); show(Rr.frame, m('apart', .6), .3);
    tw(Rr.g, { x: X + 4 * C + GAP }, m('apart', .7), .8);
    tw(b2, { x: GAP }, m('apart', .7), .8);
    const cells = (A, rows, cols, dx) => Array.from({ length: rows * cols }, (_, k) => { const [cx, cy] = A.cc(Math.floor(k / cols), k % cols); return [cx + dx, cy + 13]; });
    klCount(p, cells(L, 3, 4, 0), m('left', .3), { step: .08, size: 34, fill: COL.board });

  ['finish', 'Конец темы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
