<script>
'use strict';
// Тема 6.4 «Скобки и подобные слагаемые» (6 класс). Beat ids match papermorph/content/uroki/ch27/narration.ru.json.
const CHAPTER = { number: 27, label: '6.4', title: 'Скобки и подобные слагаемые', minutes: 8, language: 'ru', next: '../ch28/' };

// Colours in this lesson: x and x-tiles KL.DEN (letters, as in 1.6), unit tiles KL.TWO, a second letter b KL.WHOLE,
// negative tiles dashed COL.bad on the board, rules and results KL.RULE.
const XC = KL.DEN, ONE = KL.TWO, LB = KL.WHOLE, RULE = KL.RULE;
const C27U = 46, C27L = 150;           // side of a unit tile, length of an x-tile

/* ---------- algebra tiles that can flip ---------- */
const c27Dim = kind => kind === 'x' ? [C27U, C27L] : kind === 'xh' ? [C27L, C27U] : [C27U, C27U];
// A tile centred on (x, y): 'x' (upright strip), 'xh' (lying strip) or 'one' (unit square); neg draws it dashed with a
// minus. Both faces are kept, so c27Flip can turn it over. Returns the group with neg, kind, w, h.
function c27Tile(p, kind, x, y, { neg = false, o = 1 } = {}) {
  const g = G(p, { x, y, o }), inn = mk('g', {}, g), [w, h] = c27Dim(kind), c = kind === 'one' ? ONE : XC;
  const face = n => {
    const f = mk('g', {}, inn);
    mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 6, fill: n ? mix(COL.board, COL.bad, .2) : mix(COL.board, c, .5),
      stroke: n ? COL.bad : c, 'stroke-width': n ? 3.5 : 2.5, 'stroke-dasharray': n ? '8 5' : 'none' }, f);
    M(f, [(n ? '−' : '') + (kind === 'one' ? '1' : 'x')], { y: 9, size: kind === 'one' ? 24 : 30, fill: n ? COL.bad : COL.chalk });
    f.setAttribute('opacity', n === neg ? 1 : 0);
    return f;
  };
  g.faces = [face(false), face(true)]; g._in = inn; g.neg = neg; g.kind = kind; g.w = w; g.h = h;
  return g;
}
// Turn a tile over (a card flip about its upright axis): x becomes −x, −1 becomes 1. run = prog (lesson) or fxp (answer).
function c27Flip(g, t0, run = prog, dur = .55) {
  const from = g.neg, [P, N] = g.faces;
  g.neg = !from;
  run(q => {
    g._in.setAttribute('transform', `scale(${Math.max(.03, Math.abs(Math.cos(Math.PI * q)))},1)`);
    const neg = q < .5 ? from : !from;
    N.setAttribute('opacity', neg ? 1 : 0); P.setAttribute('opacity', neg ? 0 : 1);
  }, t0, dur, lin);
}
// A row of tiles standing on the line yb: specs are [kind, neg?] or a number (extra gap). anchor 'middle' centres the
// row on x. Returns the tiles (hidden unless o is 1).
function c27Tiles(p, specs, x, yb, { gap = 14, o = 0, anchor = 'start' } = {}) {
  let w = 0;
  for (const s of specs) w += typeof s === 'number' ? s : c27Dim(s[0])[0] + gap;
  let cx = anchor === 'middle' ? x - (w - gap) / 2 : x;
  const out = [];
  for (const s of specs) {
    if (typeof s === 'number') { cx += s; continue; }
    const [tw_, th] = c27Dim(s[0]);
    out.push(c27Tile(p, s[0], cx + tw_ / 2, yb - th / 2, { neg: !!s[1], o }));
    cx += tw_ + gap;
  }
  return out;
}
// Tiles grow in one after another.
function c27Pop(els, t0, step = .08) { els.forEach(e => put(e, { o: 0, s: .6 })); popIn(els, t0, step); }
// n copies of a spec, for c27Tiles.
const c27N = (n, kind, neg = false) => Array.from({ length: n }, () => [kind, neg]);
// One lying row x + k (or x − k): an x-strip and k unit tiles side by side with no gap, left edge x0, centre y.
function c27Bar(p, x0, y, k, neg = false) {
  const ts = [c27Tile(p, 'xh', x0 + C27L / 2, y, { o: 0 })];
  for (let i = 0; i < k; i++) ts.push(c27Tile(p, 'one', x0 + C27L + C27U / 2 + i * C27U, y, { neg, o: 0 }));
  return ts;
}

/* ---------- maths on a line (as 1.2's c02R / c02Seq / c02Eq) ---------- */
function c27R(p, pieces, x, y, t0, { size = 60, anchor = 'middle', fill = COL.chalk } = {}) {
  return klRow(p, pieces.map(s => typeof s === 'string' ? { m: s } : s), x, y, t0, { msize: size, anchor, fill });
}
function c27Seq(p, segs, x, y, { size = 60, fill } = {}) {
  let cx = x;
  const gs = segs.map(([pc, t]) => { const g = c27R(p, [].concat(pc), cx, y, t, { size, anchor: 'start', fill }); cx += g._w; return g; });
  return { gs, x0: x, x1: cx };
}
function c27Eq(p, L, tL, segs, y, xEq, { size = 60, fill } = {}) {
  const l = L ? c27R(p, L, xEq - size * .5, y, tL, { size, anchor: 'end', fill }) : null;
  const s = c27Seq(p, segs, xEq - mathW(['='], size) / 2, y, { size, fill });
  return { l, lx0: xEq - size * .5 - (l ? l._w : 0), ...s };
}
// The centre x of the piece `tok` in a line drawn from x0 whose text before it is `before`.
const c27X = (x0, before, tok, size) => x0 + mathW([before], size) + mathW([tok], size) / 2;
// A bracket over a stretch as one group (so it can slide), label above.
function c27Brace(p, x1, x2, y, label, t0, { fill = COL.chalk, size = 40 } = {}) {
  const g = G(p, { o: 0 });
  path(g, `M${x1} ${y + 12}V${y}H${x2}V${y + 12}`, { stroke: fill, 'stroke-width': 3 });
  M(g, [label], { x: (x1 + x2) / 2, y: y - 14, size, fill });
  if (t0 !== undefined) show(g, t0);
  return g;
}
// An oval drawn round a piece of a line.
function c27Ring(p, cx, cy, rx, ry, col, t0) {
  const e = path(p, `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0`, { stroke: col, 'stroke-width': 4 }, { d: 0 });
  draw(e, t0, .45);
  return e;
}
// A short underline under x1 … x2.
function c27Under(p, x1, x2, y, col, t0) { draw(path(p, `M${x1} ${y}H${x2}`, { stroke: col, 'stroke-width': 5, 'stroke-linecap': 'round' }, { d: 0 }), t0, .4); }

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [

    },
  })],

  ['tiles', 'Плитки', m => {

    const lb = path(p, 'M262 347h10v146h-10', { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 });

    const q = klText(p, '?', 288, 436, m('x', 2.6), { size: 48, fill: COL.dim });

    const ex = c27Tiles(p, [...c27N(3, 'x'), 30, ...c27N(2, 'one')], 1000, 470, { anchor: 'middle' });

    klText(p, 'отрицательные', 520, 300, m('neg'), { size: 28, fill: COL.bad, anchor: 'middle', weight: 600 });
    const nx = c27Tile(p, 'x', 490, 420, { neg: true, o: 0 }), n1 = c27Tile(p, 'one', 490, 640, { neg: true, o: 0 });

    c27Pop([n1], m('neg1')); klMath(p, ['= −1'], 535, 658, m('neg1', .5), { size: 52, anchor: 'start' });
    const a = c27Tile(p, 'x', 900, 735, { o: 0 }), b = c27Tile(p, 'x', 1100, 735, { neg: true, o: 0 });
    c27Pop([a, b], m('zero'), .3);
    tw(a, { x: 977 }, m('gone'), .6); tw(b, { x: 1023 }, m('gone'), .6);

    const ts = c27Tiles(p, [...c27N(3, 'x'), 40, ...c27N(2, 'one'), 40, ...c27N(2, 'x'), 40, ...c27N(5, 'one', true)], 800, 520, { anchor: 'middle' });
    c27Pop(ts, m('tiles'), .08);

    const l5 = G(p, { x: 420, y: 800 });

    const heap = (x, y, w, h, c, t) => show(put(mk('rect', { x, y, width: w, height: h, rx: 14, fill: 'none', stroke: c, 'stroke-width': 3, 'stroke-dasharray': '10 7' }, p), { o: 0 }), t, .4);
    heap(254, 510, 332, 238, XC, m('name', 1.4)); heap(1094, 666, 172, 82, COL.bad, m('name', 2.2));
    pulse(l5, m('name', 4.6), 1.3);
    [0, 1].forEach(i => {
      const r = put(mk('rect', { x: 1000 + i * 60 - 30, y: 596, width: 60, height: 142, rx: 14, fill: 'none', stroke: COL.dim, 'stroke-width': 2.5, 'stroke-dasharray': '8 6' }, p), { o: 0 });
      show(r, m('pairs', i * .3), .3);
      for (const e of [r, pos[i], neg[i]]) hide(e, m('pairs', 1.6 + i * .15), .4);
    });
    klMath(p, ['−3'], 1180, 800, m('left'), { size: 56, fill: COL.bad });
    const rr = c27R(p, ['= 5x − 3'], 980, 250, m('res'), { size: 64, anchor: 'start', fill: RULE });
    const rf = put(mk('rect', { x: 980 + mathW(['= '], 64) - 12, y: 196, width: rr._w - mathW(['= '], 64) + 24, height: 76, rx: 12, fill: 'none', stroke: RULE, 'stroke-width': 3.5 }, p), { o: 0 });
    show(rf, m('never', 3.4), .4);
    klText(p, 'подобные слагаемые — с одинаковой буквенной частью', 800, 420, m('name'), { size: 32, fill: RULE, anchor: 'middle', weight: 600 });
    klMath(p, ['≠'], 800, 690, m('never'), { size: 96, fill: COL.bad });
    klText(p, 'x и число не складываются', 800, 850, m('never', .5), { size: 30, fill: COL.bad, anchor: 'middle', weight: 600 });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    klMath(p, ['4x + 7x − 2x'], 800, 210, .2, { size: 60 });
    S.q1 = c27Tiles(p, [...c27N(4, 'x'), 30, ...c27N(7, 'x'), 30, ...c27N(2, 'x', true)], 800, 470, { gap: 12, anchor: 'middle' });
    c27Pop(S.q1, .3, .05);
    const keep = S.q1.slice(0, 9);
    S.q1n = keep.map((t, i) => T(p, String(i + 1), { x: st(t).x, y: 300, size: 30, fill: XC, font: MATH, anchor: 'middle', weight: 600, o: 0 }));
  }, { ask: done => quiz(BAND, [{
    id: 'c-podobnye', prompt: 'Приведи подобные слагаемые.',
    build: blanks([{ parts: ['4x + 7x − 2x = ', { box: '9' }, 'x'],
      why: '4 + 7 − 2 = 9: две отрицательные плитки гасят две положительные, остаётся девять иксов.',
      hint: 'Сложи коэффициенты: 4 + 7 − 2.',
      fx: () => {
        const ng = S.q1.slice(11), ps = S.q1.slice(9, 11);
        ng.forEach((n, i) => { fx(n, { x: st(ps[i]).x }, i * .3, .5); fx(n, { o: 0 }, .7 + i * .3, .3); fx(ps[i], { o: 0 }, .7 + i * .3, .3); });
        S.q1n.forEach((e, i) => fx(e, { o: 1 }, 1.4 + i * .12, .2));
      } }]),
  }], done) }],

  ['coef', 'Коэффициенты', m => {
    const p = panel(0);
    klTitle(p, 'Складываем коэффициенты');
    const SZ = 60, x0 = 470, wEq = mathW(['= '], SZ);
    const toks = [['5a', XC], [' − 2b', LB], [' + 3a', XC], [' + b', LB]];
    const w = toks.map(([s]) => mathW([s], SZ));
    const at = order => { let cx = x0; const r = []; order.forEach(k => { r[k] = cx; cx += w[k]; }); return r; };
    const X1 = at([0, 1, 2, 3]), X2 = at([0, 2, 1, 3]);
    toks.forEach(([s, c], k) => c27R(p, [{ m: s, fill: c }], X1[k], 300, k ? m('row', 1.8 + k) : .2, { size: SZ, anchor: 'start' }));
    toks.forEach(([s, c], k) => {
      const lead = k === 0 ? 0 : mathW([' '], SZ);
      c27Under(p, X1[k] + lead + (k === 0 ? 0 : mathW(['− '], SZ)), X1[k] + w[k], 316, c, m('mark', (k % 2 ? 3.6 : 1.8) + (k > 1 ? .3 : 0)));
    });

    const cp = toks.map(([s, c], k) => { const g = G(p, { x: X1[k], y: 0, o: 0 }); c27R(g, [{ m: s, fill: c }], 0, 300, undefined, { size: SZ, anchor: 'start' }); return g; });

    c27Seq(p, [[['= (5 + 3)', { m: 'a', fill: XC }], m('ca')], [[' + (−2 + 1)', { m: 'b', fill: LB }], m('cb')]], x0 - wEq, 540, { size: SZ });
    pulse(cp[3], m('one'), 1.3);
    klMath(p, ['b = 1 · b'], 1320, 420, m('one', .3), { size: 46, fill: LB });
    const res = c27R(p, ['= 8', { m: 'a', fill: XC }, ' − ', { m: 'b', fill: LB }], x0 - wEq, 660, m('res'), { size: SZ, anchor: 'start' });
    klMark(p, x0 - wEq + res._w + 60, 640, m('res', .8), true, .9);
    klText(p, 'коэффициент', x0 + mathW(['5'], SZ) / 2, 215, m('rule', 1.6), { size: 28, fill: RULE, anchor: 'middle', weight: 600 });
    draw(path(p, `M${x0 + mathW(['5'], SZ) / 2} 226V250`, { stroke: RULE, 'stroke-width': 3 }, { d: 0 }), m('rule', 1.9), .3);
    klText(p, 'коэффициенты складываем, буква остаётся той же', 800, 800, m('rule', 3.6), { size: 32, fill: RULE, anchor: 'middle', weight: 600 });
  }],

    const eq1 = c27Eq(p, ['3(x + 4)'], m('row'), [['= 3x', m('apart')], [' + 12', m('right')]], 330, XE, { size: SZ });
    const rows = YS.map(y => c27Bar(p, X0, y, 4));
    const labs = YS.map((y, i) => klMath(p, ['x + 4'], 600, y + 13, m('r' + (i + 1), .3), { size: 34, fill: COL.dim }));
    rows.forEach((r, i) => c27Pop(r, m('r' + (i + 1)), .06));

    const frame = put(mk('rect', { x: X0, y: 337, width: C27L + 4 * C27U, height: 138, rx: 4, fill: 'none', stroke: COL.chalk, 'stroke-width': 4 }, p), { o: 0 });

    rows.forEach((r, i) => pulse(r[0], m('cut', 1.4 + i * .15), 1.12));

    const b4 = c27Brace(p, X0 + C27L, X0 + C27L + 4 * C27U, 318, '4', m('rect', .8), { fill: ONE });

    klMath(p, ['3x'], X0 + C27L / 2, 545, m('apart', .6), { size: 48, fill: XC });

    // Arrows: the factor goes to each addend.

    const efr = put(mk('rect', { x: xs1 - 18, y: 274, width: eq1.x1 - xs1 + 36, height: 76, rx: 12, fill: 'none', stroke: RULE, 'stroke-width': 3.5 }, p), { o: 0 });
    show(efr, m('eq'), .4);
    klArrow(p, a3, 268, ax, 268, 205, RULE, m('eq', 2.6));
    klArrow(p, a3, 268, a4, 268, 185, RULE, m('eq', 4));
    klMath(p, ['a(b + c) = ab + ac'], 1080, 500, m('law', 2.4), { size: 40, fill: RULE });
    klText(p, 'множитель — на каждое слагаемое', 1080, 440, m('law'), { size: 30, fill: RULE, anchor: 'middle', weight: 600 });
    const eq2 = c27Eq(p, ['−2(a − 5)'], m('ex2'), [['= −2a', m('a1')], [' + 10', m('a2')]], 640, XE, { size: SZ });
    const xs2 = eq2.lx0, b2 = c27X(xs2, '', '−2', SZ);
    klArrow(p, b2, 590, c27X(xs2, '−2(', 'a', SZ), 590, 525, RULE, m('a1', -.3));
    klArrow(p, b2, 590, c27X(xs2, '−2(a ', '− 5', SZ), 590, 505, RULE, m('a2', -.3));
  }],

  ['q2', 'Проверь себя', () => {
    const p = panel(0);
    const X0 = 680, YS = [190, 236, 282, 328, 374];
    const rows = YS.map(y => c27Bar(p, X0, y, 2));
    rows.forEach((r, i) => c27Pop(r, .2 + i * .1, .04));
    klText(p, '5', X0 - 30, 296, .4, { size: 44, weight: 700, anchor: 'middle' });
    c27Brace(p, X0, X0 + C27L, 150, 'x', .5, { fill: XC });
    S.q2b = c27Brace(p, X0 + C27L, X0 + C27L + 2 * C27U, 150, '2', .6, { fill: ONE });
    S.q2u = rows.flatMap(r => r.slice(1));
    S.q2l = [klMath(p, ['5x'], X0 + C27L / 2, 460, undefined, { size: 48, fill: XC }), klMath(p, ['5 · 2 = 10'], X0 + C27L + C27U + 70, 460, undefined, { size: 44, fill: ONE })];
    S.q2l.forEach(e => put(e, { o: 0 }));
  }, { ask: done => quiz(BAND, [{
    id: 'c-skobki', prompt: 'Раскрой скобки.',

  ['brackets', 'Знак перед скобкой', m => {
