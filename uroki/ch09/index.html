'use strict';
// Тема 2.1 «Делители и кратные» (5 класс). Beat ids match papermorph/content/uroki/ch09/narration.ru.json.
const CHAPTER = { number: 9, label: '2.1', title: 'Делители и кратные', minutes: 7, language: 'ru', next: '../ch10/' };

// Meanings in this lesson: the number and its cells (a multiple) in CELL, a divisor in DIV, the second number of a sum
// in TWO, a cell left over (a remainder) in COL.bad, the rule in RULE.
const CELL = KL.NUM, DIV = KL.DEN, TWO = KL.TWO, RULE = KL.RULE;

// n loose square cells of pitch c (a gap of 6 between them), each a group whose rect is _r and whose hidden number
// (1, 2, 3 … when num is true) is _n. They start in one row from (x, y); show them from t0 (none: shown at once).
function c09Cells(p, n, c, x, y, t0, { fill = CELL, num = false, step = .03 } = {}) {
  return Array.from({ length: n }, (_, i) => {
    const g = G(p, { x: x + i * c, y, o: t0 === undefined ? 1 : 0 });
    g._r = mk('rect', { width: c - 6, height: c - 6, rx: 6, fill, 'fill-opacity': .85 }, g);
    if (num) g._n = T(g, String(i + 1), { x: (c - 6) / 2, y: (c - 6) / 2 + c * .16, size: c * .42, fill: COL.board, font: MATH, anchor: 'middle', weight: 600, o: 0 });
    if (t0 !== undefined) show(g, t0 + i * step, .3);
    return g;
  });
}
// Move cells into rows of `cols` from (x, y) at t, one after another; per (optional) puts a gap after every per cells
// of a row (groups), and order (optional) maps cell i to the slot it goes to.
function c09Rows(cells, cols, x, y, c, t, { step = .035, dur = .7, per = 0, gap = 0, slot = i => i } = {}) {
  cells.forEach((g, i) => {
    const k = slot(i), col = k % cols, row = Math.floor(k / cols);
    tw(g, { x: x + col * c + (per ? Math.floor(col / per) * gap : 0), y: y + row * c }, t + i * step, dur, io);
  });
}
// Recolour cells (their rects) at t.
function c09Fill(cells, fill, t, dur = .35) { cells.forEach(g => tw(g._r, { c_fill: fill }, t, dur)); }
// A plain ray for whole numbers: 0 at x0, u px a unit, a tick every unit (taller every fifth), only 0 labelled.
function c09Ray(p, { x0 = 160, y = 430, u = 40, max = 31, t0 = .2 } = {}) {
  const g = G(p, { o: 0 }), X = v => x0 + u * v, end = X(max) + 50;
  path(g, `M${x0 - 20} ${y}H${end}`, { stroke: COL.chalk, 'stroke-width': 3.5 });
  path(g, `M${end - 16} ${y - 11}L${end + 2} ${y}L${end - 16} ${y + 11}`, { stroke: COL.chalk, 'stroke-width': 3.5, fill: 'none', 'stroke-linejoin': 'round' });
  let d = '';
  for (let k = 0; k <= max; k++) d += `M${X(k)} ${y - (k % 5 ? 9 : 16)}V${y + (k % 5 ? 9 : 16)}`;
  path(g, d, { stroke: COL.chalk, 'stroke-width': 2.5 });
  T(g, '0', { x: X(0), y: y + 54, size: 34, font: MATH, anchor: 'middle' });
  show(g, t0);
  return { g, X, y };
}
// One hop of a dot from a to b over the ray (dir −1) or under it (dir +1), with its dashed arc.
function c09Hop(p, ray, dotG, a, b, t0, { dur = .5, dir = -1, col = CELL } = {}) {
  const xa = ray.X(a), xb = ray.X(b);
  prog(q => put(dotG, { x: xa + (xb - xa) * q, y: ray.y + dir * Math.sin(Math.PI * q) * 44 }), t0, dur, io);
  draw(c09Arc(p, ray, a, b, dir, col), t0, dur);
}
// The dashed arc of a hop from a to b, hidden (d 0) for draw() or fx.
function c09Arc(p, ray, a, b, dir = -1, col = CELL) {
  const xa = ray.X(a), xb = ray.X(b);
  return path(p, `M${xa} ${ray.y + dir * 8}Q${(xa + xb) / 2} ${ray.y + dir * 92} ${xb} ${ray.y + dir * 8}`, { stroke: col, 'stroke-width': 2.5, fill: 'none', 'stroke-dasharray': '7 7' }, { d: 0, o: .8 });
}
// A dot on a ray at v.
function c09Dot(p, ray, v, fill = CELL, o = 1) {
  const g = G(p, { x: ray.X(v), y: ray.y, o });
  mk('circle', { r: 13, fill, stroke: COL.board, 'stroke-width': 3 }, g);
  return g;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Делители и кратные', (m, D) => klIntro(m, D, {
    unit: 'Глава 2 · Делимость · Тема 2.1',

    sub: 'Когда одно число делится на другое и как найти все его делители',
    art: (g, t0) => {
      const cells = c09Cells(g, 12, 44, 0, 0, t0, { step: .04 });
      cells.forEach((e, i) => put(e, { x: 600 + (i % 4) * 44, y: 548 + Math.floor(i / 4) * 44 }));
      klRow(g, [{ m: '12', fill: CELL }, { m: ' = ' }, { m: '3', fill: DIV }, { m: ' · ' }, { m: '4', fill: DIV }], 960, 630, t0 + .5, { msize: 60 });
    },
  })],

  ['split', 'Делится — значит без остатка', m => {
    const p = panel(0);
    klTitle(p, 'Делится — значит без остатка');
    const C = 66, X0 = 180, Y0 = 320;
    const cells = c09Cells(p, 12, C, 800 - 6 * C + 3, 200, .2, { num: true });
    cells.forEach((g, i) => show(g._n, .6 + i * .1, .25));
    // Rows of five: two full rows and two cells left over.
    c09Rows(cells, 5, X0, Y0, C, m('five'));
    c09Fill(cells.slice(10), COL.bad, m('left'));
    cells.slice(10).forEach(g => { tw(g, { s: 1.15 }, m('left', .5), .25, out); tw(g, { s: 1 }, m('left', .75), .35); });
    const w5 = mathW(['12 : 5 = 2 (ост. 2)'], 56);
    klMath(p, ['12 : 5 = 2 (ост. 2)'], 700, 404, m('left', 3.2), { size: 56, anchor: 'start', fill: COL.dim });
    klMark(p, 700 + w5 + 50, 386, m('left', 5.4), false, .8);
    // Rows of six: exactly two rows.
    c09Rows(cells, 6, X0, Y0, C, m('six'));
    c09Fill(cells.slice(10), CELL, m('six', .3));
    klBrace(p, X0, X0 + 6 * C - 6, 300, '6', m('six', 1), { fill: DIV, size: 40 });
    klText(p, '2', X0 - 34, Y0 + C + 14, m('six', 1.3), { size: 40, fill: DIV, weight: 600, anchor: 'middle' });
    const w6 = mathW(['12 : 6 = 2'], 56);
    klRow(p, [{ m: '12', fill: CELL }, { m: ' : ' }, { m: '6', fill: DIV }, { m: ' = 2' }], 700, 524, m('div'), { msize: 56, anchor: 'start' });
    klMark(p, 700 + w6 + 50, 506, m('div', .5), true, .8);
    klText(p, 'без остатка', 700, 580, m('div', .9), { size: 30, fill: COL.dim });
    klRow(p, [{ m: '6', fill: DIV }, ' — делитель ', { m: '12', fill: CELL }], X0, 700, m('names'), { size: 38, msize: 52, anchor: 'start' });
    klRow(p, [{ m: '12', fill: CELL }, ' — кратное ', { m: '6', fill: DIV }], 820, 700, m('mult'), { size: 38, msize: 52, anchor: 'start' });
    klRow(p, [{ m: '12', fill: CELL }, { m: ' = ' }, { m: '6', fill: DIV }, { m: ' · 2' }], 800, 830, m('rule'), { msize: 72 });
  }],

  ['pairs', 'Делители идут парами', m => {
    const p = panel(0);
    klTitle(p, 'Делители идут парами');
    const C = 54, X0 = 150, Y0 = 210, LX = 1000;
    const cells = c09Cells(p, 12, C, X0, Y0, .2);
    const eq = (a, b, y, t, fill = COL.chalk) => klRow(p, [{ m: '12 = ', fill }, { m: a, fill: fill === COL.chalk ? DIV : fill }, { m: ' · ', fill }, { m: b, fill: fill === COL.chalk ? DIV : fill }], LX, y, t, { msize: 60, anchor: 'start' });

    eq('2', '6', 350, m('two', .5));
    c09Rows(cells, 4, X0, Y0, C, m('three'));
    const e34 = eq('3', '4', 440, m('three', .5));
    for (let r = 0; r < 3; r++) cells.slice(4 * r, 4 * r + 4).forEach(g => { const t = m('three', 3.4 + r * .3); tw(g, { s: 1.12 }, t, .2, out); tw(g, { s: 1 }, t + .2, .3); });
    cells.slice(0, 4).forEach((g, i) => { const t = m('three', 5.4 + i * .2); tw(g, { y: Y0 - 8 }, t, .15, out); tw(g, { y: Y0 }, t + .15, .25); });

    c09Rows(cells, 3, X0, Y0, C, m('turn'), { slot: i => (i % 4) * 3 + Math.floor(i / 4) });

    klText(p, 'та же пара', LX + 372, 478, m('turn', 3.7), { size: 30, fill: RULE, weight: 600 });

    const DX = [300, 500, 700, 900, 1100, 1300], DV = ['1', '2', '3', '4', '6', '12'];
    cells.forEach(g => tw(g, { o: .4 }, m('list'), .6));
    DV.forEach((v, i) => klMath(p, [v], DX[i], 790, m('list', 1.7 + i * .85), { size: 72, fill: DIV }));
    [[0, 5, 540, '1 · 12'], [1, 4, 610, '2 · 6'], [2, 3, 680, '3 · 4']].forEach(([a, b, peak, lab], k) => {
      const t = m('arcs', k * .5), cy = 725 - 2 * (725 - peak);
      draw(path(p, `M${DX[a]} 725Q800 ${cy} ${DX[b]} 725`, { stroke: RULE, 'stroke-width': 3.5, fill: 'none' }, { d: 0 }), t, .6);
      klMath(p, [lab, ' = 12'], 800, peak - 14, t + .4, { size: 30, fill: RULE });
    });
    klText(p, 'нашёл один делитель — нашёл и второй', 800, 868, m('tip'), { size: 30, fill: RULE, weight: 600, anchor: 'middle' });
    const ring = (x, t) => draw(path(p, `M${x - 48} 766a48 48 0 1 0 96 0a48 48 0 1 0 -96 0`, { stroke: RULE, 'stroke-width': 4, fill: 'none' }, { d: 0 }), t, .5);
    ring(DX[1], m('tip', 2.2)); ring(DX[4], m('tip', 3.2));
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    const C = 64, X0 = 800 - 2.5 * C + 3, Y0 = 160;
    S.q1 = c09Cells(p, 20, C, X0, Y0, .2, { step: .02 });
    S.q1.forEach((g, i) => put(g, { x: X0 + (i % 5) * C, y: Y0 + Math.floor(i / 5) * C }));
    klBrace(p, X0, X0 + 5 * C - 6, Y0 - 16, '5', .5, { fill: DIV, size: 40 });
    klText(p, '4', X0 - 40, Y0 + 2 * C + 10, .6, { size: 40, fill: DIV, weight: 600, anchor: 'middle' });
  }, { ask: done => quiz(BAND, [{
    id: 'c-pary', prompt: 'Допиши пары делителей числа 20.',
    build: blanks([1, 2, 4].map(k => ({ parts: ['20 = ' + k + ' · ', { box: String(20 / k) }],
      why: `20 : ${k} = ${20 / k}` + (k === 4 ? '. Делители 20: 1, 2, 4, 5, 10, 20 — три пары.' : '.'),
      hint: `Раздели 20 на ${k}.`,
      fx: () => S.q1.forEach((g, i) => { fx(g, { s: 1.12 }, i * .04, .2, out); fx(g, { s: 1 }, .2 + i * .04, .3); }) }))),
  }], done) }],

  ['prime', 'Только одна полоска', m => {
    const p = panel(0);
    klTitle(p, 'Семь клеток');
    const C = 66, X0 = 300, Y0 = 230, TX = 850;
    const cells = c09Cells(p, 7, C, X0, Y0, .2, { num: true });
    cells.forEach((g, i) => show(g._n, .5 + i * .1, .25));
    c09Rows(cells, 2, X0, Y0, C, m('two'));
    c09Fill([cells[6]], COL.bad, m('two', .8));
    klMath(p, ['7 : 2 = 3 (ост. 1)'], TX, 320, m('two', 1), { size: 52, anchor: 'start', fill: COL.dim });
    klMark(p, TX + mathW(['7 : 2 = 3 (ост. 1)'], 52) + 46, 302, m('two', 1.4), false, .7);
    c09Rows(cells, 3, X0, Y0, C, m('three'));
    klMath(p, ['7 : 3 = 2 (ост. 1)'], TX, 420, m('three', .8), { size: 52, anchor: 'start', fill: COL.dim });
    klMark(p, TX + mathW(['7 : 3 = 2 (ост. 1)'], 52) + 46, 402, m('three', 1.2), false, .7);
    c09Rows(cells, 7, X0, Y0, C, m('back'));
    c09Fill([cells[6]], CELL, m('back', .3));
    klRow(p, [{ m: '7', fill: CELL }, { m: ' = ' }, { m: '1', fill: DIV }, { m: ' · ' }, { m: '7', fill: DIV }], TX, 540, m('back', 1), { msize: 60, anchor: 'start' });
    cells.forEach((g, i) => { const t = m('only', 1 + i * .12); tw(g, { s: 1.12 }, t, .2, out); tw(g, { s: 1 }, t + .2, .3); });
    klRow(p, ['делители:  ', { m: '1', fill: DIV }, '  и  ', { m: '7', fill: DIV }], TX, 640, m('only'), { size: 38, msize: 56, anchor: 'start' });
    klText(p, 'простые числа:', 560, 800, m('name'), { size: 36, fill: RULE, weight: 600, anchor: 'end' });
    ['2', '3', '5', '7', '11', '13', '…'].forEach((v, i) => klMath(p, [v + (i < 6 ? ',' : '')], 610 + i * 100, 800, m('name', 1 + i * .45), { size: 52, fill: RULE, anchor: 'start' }));
  }],

  ['mult', 'Кратные — прыжки по лучу', m => {
    const p = panel(0);
    klTitle(p, 'Кратные пяти');
    const ray = c09Ray(p, { t0: .2 });
    const dot = c09Dot(p, ray, 0, CELL, 0);
    show(dot, .5, .3);
    for (let k = 1; k <= 6; k++) {
      c09Hop(p, ray, dot, 5 * (k - 1), 5 * k, m('h' + k, -.15), { dur: .45 });
      const lab = klMath(p, [String(5 * k)], ray.X(5 * k), 330, m('h' + k, .25), { size: 46, fill: CELL });
      pulse(lab, m('more', 2 + k * .25), 1.25);
      klMath(p, ['5 · ' + k], ray.X(5 * k), 510, m('form', .3 + (k - 1) * .3), { size: 32, fill: COL.dim });
    }
    klMath(p, ['…'], ray.X(33) - 10, 330, m('more'), { size: 46, fill: CELL });
    c09Hop(p, ray, dot, 30, 33, m('more'), { dur: .6 });
    hide(dot, m('more', .6), .4);
    klText(p, 'кратных бесконечно много', 800, 640, m('more', .4), { size: 36, fill: RULE, weight: 600, anchor: 'middle' });
    draw(path(p, `M${ray.X(5) - 40} 316a40 34 0 1 0 80 0a40 34 0 1 0 -80 0`, { stroke: RULE, 'stroke-width': 4, fill: 'none' }, { d: 0 }), m('least'), .5);
    klText(p, 'самое маленькое кратное — само число', ray.X(5) - 40, 250, m('least', .4), { size: 30, fill: RULE });
  }],

      const g = G(p, { o: 0 });
      g.append(c09Dot(p, ray, v, COL.chalk));

    S.q2arcs = [0, 1, 2, 3, 4].map(k => c09Arc(p, ray, 4 * k, 4 * k + 4, 1, DIV));
    S.q2labs = [4, 8, 12, 16].map(v => { const e = klMath(p, [String(v)], ray.X(v), ray.y + 76, undefined, { size: 32, fill: DIV }); put(e, { o: 0 }); return e; });
  }, { ask: done => quiz(BAND, [{
    id: 'c-krat4', prompt: 'Какое из отмеченных чисел кратно 4? Выбери его на луче.',
    build: pickEls(S.q2.map((g, i) => ({ el: g, box: S.q2box[i], label: ['14', '18', '20', '26'][i] })), 2,
      '20 = 4 · 5: пять прыжков по четыре.',
      i => [['14 = 4 · 3 + 2: остаток 2.'], ['18 = 4 · 4 + 2: остаток 2.'], null, ['26 = 4 · 6 + 2: остаток 2.']][i],
      () => { S.q2arcs.forEach((a, k) => fx(a, { d: 1 }, k * .2, .3)); S.q2labs.forEach((e, k) => fx(e, { o: 1 }, .15 + k * .2, .3)); }),
  }], done) }],

  ['trap', 'Кто чей делитель', m => {
    const p = panel(0);
    klTitle(p, 'Кто чей делитель');
    const C = 80, X0 = 320, Y0 = 230;
    const cells = c09Cells(p, 12, C, X0, Y0, .2, { step: .02 });
    const fr = G(p, { x: X0 - 5, y: Y0 - 5, o: 0 });
    mk('rect', { width: 3 * C + 4, height: C + 4, rx: 8, fill: 'none', stroke: DIV, 'stroke-width': 6 }, fr);
    show(fr, m('fit'), .3);
    tw(fr.firstChild, { 'a_stroke-width': 10 }, m('names', .3), .25); tw(fr.firstChild, { 'a_stroke-width': 6 }, m('names', .7), .3);
    cells.forEach((g, i) => { const t = m('names', 2.6 + i * .05); tw(g, { s: 1.1 }, t, .2, out); tw(g, { s: 1 }, t + .2, .3); });
    for (let k = 0; k < 4; k++) {
      if (k) tw(fr, { x: X0 - 5 + 3 * C * k }, m('fit', k * .7), .45, io);
      klText(p, String(k + 1), X0 + 3 * C * k + 1.5 * C - 3, Y0 + C + 52, m('fit', k * .7 + .35), { size: 38, fill: DIV, weight: 700, anchor: 'middle' });
    }
    klRow(p, [{ m: '12', fill: CELL }, { m: ' : ' }, { m: '3', fill: DIV }, { m: ' = 4' }], 800, 470, m('eq'), { msize: 72 });
    klRow(p, [{ m: '3', fill: DIV }, ' — делитель ', { m: '12', fill: CELL }], 470, 580, m('names'), { size: 38, msize: 52 });
    klRow(p, [{ m: '12', fill: CELL }, ' — кратное ', { m: '3', fill: DIV }], 1130, 580, m('names', 2.4), { size: 38, msize: 52 });
    const bad = klRow(p, [{ m: '12' }, ' — делитель ', { m: '3' }], 640, 720, m('trap', .3), { size: 38, msize: 52, fill: COL.dim });
    klStrike(p, 640 - bad._w / 2 - 16, 735, 640 + bad._w / 2 + 16, 690, m('trap', 2.2));
    klText(p, 'ошибка!', 640 + bad._w / 2 + 50, 722, m('trap', 2.4), { size: 32, fill: COL.bad, weight: 700 });
    klText(p, 'делитель укладывается в число целиком', 800, 830, m('why', 2.4), { size: 32, fill: RULE, weight: 600, anchor: 'middle' });
    tw(fr, { x: X0 - 5 }, m('why', .2), .7, io);
    tw(fr.firstChild, { 'a_stroke-width': 10 }, m('why', 3), .25); tw(fr.firstChild, { 'a_stroke-width': 6 }, m('why', 3.4), .3);
    cells.forEach((g, i) => { const t = m('why', 5 + Math.floor(i / 3) * .3); tw(g, { s: 1.1 }, t, .2, out); tw(g, { s: 1 }, t + .2, .3); });
  }],

  ['sum', 'Главное свойство', m => {
    const p = panel(0);
    klTitle(p, 'Главное свойство');
    const C = 46, X0 = 220, YA = 230, YB = 360, GAP = 22, STEP = 3 * C + GAP;
    const A = c09Cells(p, 12, C, X0, YA, .2, { step: .02 });
    const B = c09Cells(p, 9, C, X0, YB, .5, { fill: TWO, step: .02 });
    const la = klMath(p, ['12'], X0 - 30, YA + 32, .3, { size: 46, fill: CELL, anchor: 'end' });
    const lb = klMath(p, ['9'], X0 - 30, YB + 32, .6, { size: 46, fill: TWO, anchor: 'end' });
    c09Rows(A, 12, X0, YA, C, m('a'), { per: 3, gap: GAP, step: 0, dur: .5 });
    c09Rows(B, 9, X0, YB, C, m('b'), { per: 3, gap: GAP, step: 0, dur: .5 });
    // The nine slides up after the twelve: seven threes in one row.
    B.forEach((g, i) => tw(g, { x: X0 + 4 * STEP + Math.floor(i / 3) * STEP + (i % 3) * C, y: YA }, m('join', Math.floor(i / 3) * .15), .8, io));
    hide(la, m('join'), .3); hide(lb, m('join'), .3);
    const l21 = klMath(p, ['21'], X0 - 30, YA + 32, m('join', .6), { size: 46, anchor: 'end' });
    const cnt = klCount(p, Array.from({ length: 7 }, (_, k) => [X0 + k * STEP + 1.5 * C - 3, YA - 16]), m('join', 1.1), { step: .15, size: 30, fill: RULE });
    klRow(p, [{ m: '12', fill: CELL }, { m: ' + ' }, { m: '9', fill: TWO }, { m: ' = 21 = 7 · 3' }], 800, 480, m('eq'), { msize: 60 });
    // The difference: each three of the nine is laid under a three of the twelve; matched threes go, one three stays.
    cnt.forEach(e => hide(e, m('minus'), .3));
    hide(l21, m('minus'), .3);
    B.forEach((g, i) => tw(g, { x: X0 + Math.floor(i / 3) * STEP + (i % 3) * C, y: YA + C + 12 }, m('minus', .2 + Math.floor(i / 3) * .12), .8, io));
    [...A.slice(0, 9), ...B].forEach(g => tw(g, { o: .12 }, m('minus', 2), .5));
    klRow(p, [{ m: '12', fill: CELL }, { m: ' − ' }, { m: '9', fill: TWO }, { m: ' = 3 = 1 · 3' }], 800, 580, m('minus', 2.3), { msize: 60 });
    klRow(p, ['если ', { m: 'a' }, ' и ', { m: 'b' }, ' делятся на одно число ', { m: 'k' }, ','], 800, 700, m('rule'), { size: 34, msize: 44, fill: RULE, weight: 600 });
    klRow(p, ['то ', { m: 'a + b' }, ' и ', { m: 'a − b' }, ' тоже делятся на ', { m: 'k' }], 800, 770, m('rule', 3), { size: 34, msize: 44, fill: RULE, weight: 600 });
  }],

  ['notsum', 'Одно делится, другое нет', m => {
    const p = panel(0);
    klTitle(p, 'Одно слагаемое делится, другое нет');
    const C = 32, X0 = 190, YA = 250, YB = 360, GAP = 16, STEP = 5 * C + GAP;
    const A = c09Cells(p, 30, C, X0, YA, .2, { step: .015 });
    const B = c09Cells(p, 7, C, X0, YB, .6, { fill: TWO, step: .03 });
    const l30 = klMath(p, ['30'], X0 - 24, YA + 25, .3, { size: 42, fill: CELL, anchor: 'end' });
    const l7 = klMath(p, ['7'], X0 - 24, YB + 25, .7, { size: 42, fill: TWO, anchor: 'end' });
    hide(l30, m('join'), .3); hide(l7, m('join'), .3);
    klMath(p, ['37'], X0 - 24, YA + 25, m('join', .6), { size: 42, anchor: 'end' });
    c09Rows(A, 30, X0, YA, C, m('a'), { per: 5, gap: GAP, step: 0, dur: .5 });
    klCount(p, Array.from({ length: 6 }, (_, k) => [X0 + k * STEP + 2.5 * C - 3, YA - 14]), m('a', .6), { step: .15, size: 28, fill: RULE });
    c09Rows(B, 7, X0, YB, C, m('b'), { per: 5, gap: GAP, step: 0, dur: .5 });
    c09Fill(B.slice(5), COL.bad, m('b', 1.2));
    // The five of the seven joins the row of fives; the two odd cells follow it and stay over.
    B.forEach((g, i) => tw(g, { x: X0 + 6 * STEP + (i < 5 ? i * C : STEP + (i - 5) * C), y: YA }, m('join', i < 5 ? 0 : .4), .8, io));
    klCount(p, [[X0 + 6 * STEP + 2.5 * C - 3, YA - 14]], m('join', .9), { size: 28, fill: RULE, from: 7 });
    klRow(p, [{ m: '30', fill: CELL }, { m: ' + ' }, { m: '7', fill: TWO }, { m: ' = 37 = 7 · 5 + 2' }], 800, 520, m('join', 1.6), { msize: 60 });
    B.slice(5).forEach(g => { tw(g, { s: 1.25 }, m('rule', .2), .25, out); tw(g, { s: 1 }, m('rule', .45), .35); });
    klText(p, 'остаток 2: на 5 не делится', 800, 620, m('rule', .6), { size: 34, fill: COL.bad, weight: 600, anchor: 'middle' });
    klText(p, 'одно слагаемое делится, другое нет — сумма не делится', 800, 740, m('rule', 2), { size: 34, fill: RULE, weight: 600, anchor: 'middle' });
  }],

  ['q3', 'Проверь себя', () => {
    const p = panel(0);
    klTitle(p, 'Делится ли на 5?', 'Подсказки из урока:');
    S.q3 = [
      klRow(p, ['оба делятся на ', { m: 'k' }, '  →  ', { m: 'a + b' }, ',  ', { m: 'a − b' }, '  делятся'], 420, 330, .3, { size: 30, msize: 40, fill: COL.dim }),
      klRow(p, ['одно делится, другое нет  →  не делится'], 420, 430, .5, { size: 30, fill: COL.dim }),
    ];
  }, { ask: done => quiz({ x: 820, y: 220, w: 700, cls: 'side' }, [{
    id: 'c-summa5', prompt: 'Делится ли на 5? Не вычисляй ответ до конца.',
    build: grid([
      { parts: ['40 + 15'], ans: ['y'], why: 'Оба числа делятся на 5, значит, и сумма: 55 = 5 · 11.' },
      { parts: ['40 + 12'], ans: ['n'], why: '40 делится на 5, а 12 — нет: 52 = 5 · 10 + 2.' },
      { parts: ['25 − 10'], ans: ['y'], why: 'Оба числа делятся на 5, значит, и разность: 15 = 5 · 3.' },
    ], [['y', 'делится', null, '1'], ['n', 'не делится', null, '2']], { multi: false }),
  }], done) }],

  ['wrap', 'Главное', m => klWrap(m, [
    ['Делится — значит без остатка:  ', { m: '12 = 6 · 2' }],
    ['Делители идут парами:  ', { m: '12 = 1 · 12 = 2 · 6 = 3 · 4' }],
    ['Кратных бесконечно много:  ', { m: '5,  10,  15,  …' }],
    ['Делятся ', { m: 'a' }, ' и ', { m: 'b' }, ' на ', { m: 'k' }, ' — делятся ', { m: 'a + b' }, ' и ', { m: 'a − b' }],
  ])],

  ['final1', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-verno', prompt: 'Верно или неверно?',
    build: grid([
      { parts: ['6 — делитель 42'], ans: ['y'], why: '42 = 6 · 7.' },
      { parts: ['8 — делитель 28'], ans: ['n'], why: '28 = 8 · 3 + 4: остаток 4.' },
      { parts: ['45 — кратное 9'], ans: ['y'], why: '45 = 9 · 5.' },
      { parts: ['3 — кратное 12'], ans: ['n'], why: 'Наоборот: 12 — кратное 3, а 3 — делитель 12.' },
    ], [['y', 'верно', null, '1'], ['n', 'неверно', null, '2']], { multi: false, text: true }),
  }], done, 'Практика по теме · часть 1 из 3') }],

  ['final2', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-del18', prompt: 'Сколько делителей у числа 18?',
    build: blanks([{ parts: [{ box: '6' }], why: '18 = 1 · 18 = 2 · 9 = 3 · 6: делители 1, 2, 3, 6, 9, 18.', hint: 'Ищи делители парами: 1 · 18, 2 · 9, …' }]),
  }, {
    id: 'p-krat7', prompt: 'Найди наименьшее число, кратное 7 и большее 50.',
    build: blanks([{ parts: [{ box: '56' }], why: '7 · 7 = 49 — меньше 50, а 7 · 8 = 56.', hint: 'Прыгай по семь: 7, 14, 21, … Какое первое число больше 50?' }]),
  }], done, 'Практика по теме · часть 2 из 3') }],

  ['final3', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-4del30', prompt: 'Является ли 4 делителем числа 30?',
    build: choice(['да', 'нет'], 1, '30 = 4 · 7 + 2: остаток 2, значит, 4 — не делитель 30.',
      ['Проверь: 4 · 7 = 28, 4 · 8 = 32. Ровно 30 не получается.', null]),
  }, {
    id: 'p-summa6', prompt: 'Делится ли сумма 36 + 25 на 6?',
    build: choice(['да', 'нет'], 1, '36 делится на 6, а 25 — нет. Значит, и сумма не делится: 61 = 6 · 10 + 1.',
      ['36 делится на 6, а 25 — нет (25 = 6 · 4 + 1). Одно слагаемое делится, другое нет — сумма не делится.', null]),
  }], done, 'Практика по теме · часть 3 из 3') }],

  ['finish', 'Конец темы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
