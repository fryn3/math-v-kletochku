<script>
'use strict';
// Тема 4.2 «Умножение и деление десятичных дробей». Beat ids match papermorph/content/uroki/ch18/narration.ru.json.
const CHAPTER = { number: 18, label: '4.2', title: 'Умножение и деление десятичных дробей', minutes: 8, language: 'ru', next: '../ch19/' };

const NUM = KL.NUM, DEN = KL.DEN, TWO = KL.TWO, RULE = KL.RULE;

// A number written digit by digit in even slots, with a decimal comma (KL.RULE) that can hop between them.
// places = digits after the comma (0: the comma sits at the far right, hidden). px(k) is the gap with k digits after it.
// hop(from, to, t, run) moves the comma gap by gap along arcs over the digits (run = tw in a beat, fx in an answer).
function c18Digits(p, digits, x, y, places, { size = 84, fill = COL.chalk, t0 } = {}) {
  const g = G(p, { o: t0 === undefined ? 1 : 0 }), w = size * .68, n = digits.length, x0 = x - n * w / 2;
  const ds = [...digits].map((c, i) => T(g, c, { x: x0 + (i + .5) * w, y, size, fill, font: MATH, anchor: 'middle' }));
  const px = k => x0 + (n - k) * w;
  const cm = T(g, ',', { x: px(places), y, size, fill: RULE, font: MATH, anchor: 'middle', weight: 700, o: places ? 1 : 0 });
  const trail = path(g, '', { stroke: RULE, 'stroke-width': 2.5, 'stroke-dasharray': '5 6' }, { o: 0 });
  if (t0 !== undefined) show(g, t0);
  return { g, ds, cm, px, w, x0, x1: x0 + n * w,
    hop(from, to, t, run = tw, dur = .5) {
      const steps = Math.abs(to - from), sg = Math.sign(to - from), at = k => px(from + sg * k);
      run(cm, { o: 1 }, t, .2);
      let d = '';
      for (let k = 0; k < steps; k++) d += `M${at(k)} ${y - size * .2}Q${(at(k) + at(k + 1)) / 2} ${y - size * 1.5} ${at(k + 1)} ${y - size * .2}`;
      trail.setAttribute('d', d);
      run(trail, { o: .8 }, t + steps * dur, .3);
      run(trail, { o: 0 }, t + steps * dur + 1.8, .6);
      (run === tw ? prog : fxp)(q => {
        const s = q * steps, k = Math.min(steps - 1, Math.floor(s)), f = s - k;
        put(cm, { x: at(k) + (at(k + 1) - at(k)) * f, y: y - Math.sin(Math.PI * f) * size * .9 });
      }, t, steps * dur, lin);
    } };
}

// Long division «уголком»: the dividend (with its comma) at (x, y) in even slots, the divisor beyond the corner, the
// quotient under it. Parts are made hidden for the beat to bring in: t = a time shows them then, null keeps them hidden
// (for an answer's fx), undefined shows them at once. num(str, right, row) writes a number ending in slot `right`
// on row `row` (minus: a subtraction row); line(a, b, row) underlines slots a..b; q(str, i) / qc(i) put a digit / the
// comma into the quotient; move(str, i, row, t) brings dividend digit i down to a row.
function c18Corner(p, { x, y, dividend, divisor, size = 72, lh = size * 1.05, qn = 3, t0 }) {
  const g = G(p, { o: t0 === undefined ? 1 : 0 }), w = size * .62, base = { size, font: MATH, anchor: 'middle' };
  const digs = [], cmAt = [];
  for (const ch of dividend) ch === ',' ? cmAt.push(digs.length) : digs.push(ch);
  const dx = i => x + w * (i + .5), ry = r => y + r * lh;
  const xv = x + w * digs.length + size * .25, xq = xv + size * .3, qy = y + lh;
  const dg = digs.map((c, i) => T(g, c, { ...base, x: dx(i), y }));
  const cm = cmAt.map(k => T(g, ',', { ...base, x: x + w * k, y, fill: RULE, weight: 700 }));
  path(g, `M${xv} ${y - size * .8}V${qy + size * .3}M${xv} ${y + size * .28}H${xq + Math.max(w * qn, textW(divisor, size)) + size * .2}`, { stroke: COL.chalk, 'stroke-width': 3 });
  T(g, divisor, { ...base, anchor: 'start', x: xq, y, fill: DEN });
  const vis = (e, t, key = 'o') => { if (t !== undefined) { put(e, { [key]: 0 }); if (t !== null) tw(e, { [key]: 1 }, t, key === 'd' ? .4 : .35); } return e; };
  if (t0 !== undefined) show(g, t0);
  return { g, dg, cm, dx, ry, qy, xq, w,
    qx: i => xq + w * (i + .5),
    num(str, right, r, t, { minus = false, fill = COL.chalk } = {}) {
      const e = G(g);
      [...str].forEach((c, i) => T(e, c, { ...base, x: dx(right - str.length + 1 + i), y: ry(r), fill }));
      if (minus) T(e, '−', { ...base, size: size * .8, x: dx(right - str.length + 1) - w * .9, y: ry(r) - size * .42, fill: COL.dim });
      return vis(e, t);
    },
    line(a, b, r, t) { return vis(path(g, `M${dx(a) - w * .5 - 6} ${ry(r) + size * .2}H${dx(b) + w * .5 + 6}`, { stroke: COL.chalk, 'stroke-width': 2.5 }, { d: 1 }), t, 'd'); },
    q(str, i, t) { return vis(T(g, str, { ...base, x: xq + w * (i + .5), y: qy }), t); },
    qc(i, t) { return vis(T(g, ',', { ...base, x: xq + w * i, y: qy, fill: RULE, weight: 700 }), t); },
    move(i, r, t) {
      const e = T(g, digs[i], { ...base, x: dx(i), y, fill: RULE, o: 0 });
      show(e, t, .15); tw(e, { y: ry(r) }, t + .15, .7, io); tw(e, { c_fill: COL.chalk }, t + .9, .4);
      return e;
    } };
}

  ['area', 'Часть от части', m => {

    const unitT = klText(p, 'единица: 100 клеток', 440, 800, m('sq', .8), { size: 28, fill: COL.dim, anchor: 'middle' });
    hide(unitT, m('six', -.2), .2); show(unitT, m('six', 3.9), .4);

    draw(path(p, `M162 ${A.y}V${A.y + 3 * A.rh}`, { stroke: NUM, 'stroke-width': 4 }, { d: 0 }), m('rows', .2), .4);
    klMath(p, ['0,3'], 104, A.y + 1.5 * A.rh + 15, m('rows', .2), { size: 42, fill: NUM });

    draw(path(p, `M${A.x} 222H${A.x + 2 * A.cw}`, { stroke: TWO, 'stroke-width': 4 }, { d: 0 }), m('cols', .2), .4);
    klMath(p, ['0,2'], A.x + A.cw, 204, m('cols', .2), { size: 42, fill: TWO });
    show(A.over, m('both'), .4);

    const cells = [];

    tw(A.over, { 'a_stroke-width': 12 }, m('both', 2.6), .25); tw(A.over, { 'a_stroke-width': 7 }, m('both', 2.9), .4);
    klCount(p, cells, m('count'), { step: .2, size: 30, fill: COL.chalk });
    // The question is on the board from the start; its answer and the fraction line follow on the words.
    const subj = klRow(p, [{ m: '0,3', fill: NUM }, { m: ' · ' }, { m: '0,2', fill: TWO }], 790, 330, .3, { msize: 72, anchor: 'start' });
    const res = klMath(p, [' = 0,06'], 790 + subj._w, 330, m('res'), { size: 72, anchor: 'start', fill: RULE });
    tw(res, { o: .4 }, m('res', 2.4), .25); tw(res, { o: 1 }, m('res', 2.7), .3);
    klRow(p, ['закрашено дважды: 6 клеток по ', { m: F('1', '100') }], 790, 440, m('count', 1.3), { size: 30, msize: 44, anchor: 'start', fill: COL.dim });
    const fr1 = [F('3', '10'), ' · ', F('2', '10')], wf = mathW(fr1, 56);
    klMath(p, fr1, 790, 575, m('frac', 2.4), { size: 56, anchor: 'start' });
    klMath(p, [' = ', F('6', '100'), ' = 0,06'], 790 + wf, 575, m('frac', 4.6), { size: 56, anchor: 'start' });
    // The trap: 0,6 would be six whole columns, not six cells.
    const wT = mathW(['0,3 · 0,2 = 0,6'], 56);
    klMath(p, ['0,3 · 0,2 = 0,6'], 790, 720, m('trap'), { size: 56, anchor: 'start', fill: COL.dim });
    klStrike(p, 780, 735, 800 + wT, 690, m('trap', 1.6));

    const six = put(mk('rect', { x: A.x - 4, y: A.y - 4, width: 6 * A.cw + 8, height: A.h + 8, rx: 6, fill: COL.bad, 'fill-opacity': .12, stroke: COL.bad, 'stroke-width': 4, 'stroke-dasharray': '12 9' }, p), { o: 0 });
    show(six, m('six'), .4);
    const sixT = klText(p, '0,6 — шесть столбиков', A.x + 3 * A.cw, 800, m('six', .2), { size: 28, fill: COL.bad, weight: 700, anchor: 'middle' });
    hide(six, m('six', 3.4), .5); hide(sixT, m('six', 3.4), .5);
    tw(A.over, { 'a_stroke-width': 12 }, m('six', 3.3), .25); tw(A.over, { 'a_stroke-width': 7 }, m('six', 3.6), .4);
  }],

  ['rule', 'Умножаем, как целые', m => {
    const p = panel(0);
    klTitle(p, 'Умножаем, как целые числа, потом ставим запятую');
    const size = 84, W = size * .68;
    // One line that changes: the factors lose their commas, the product appears, the commas come back.
    const line = (y, a, pa, b, pb, c, t0, tw0) => {
      let x = 330;
      const A = c18Digits(p, a, x + a.length * W / 2, y, pa, { size, fill: NUM, t0 });
      x += a.length * W + 42;
      klMath(p, ['·'], x, y, t0 + 2.2, { size });
      x += 42;
      const B = c18Digits(p, b, x + b.length * W / 2, y, pb, { size, fill: TWO, t0: t0 + 2.2 });
      x += b.length * W + 48;
      klMath(p, ['='], x, y, tw0, { size });
      x += 48;
      const P = c18Digits(p, c, x + c.length * W / 2, y, 0, { size, t0: tw0 });
      return { A, B, P };
    };
    const brace = (R, k, y, label, t) => klBrace(p, R.px(k) + 4, R.px(0) + 4, y, label, t, { up: false, fill: DEN, size: 28 });
    // 2,3 · 0,04: 23 · 4 = 92, then 1 + 2 = 3 digits after the comma: 0,092.
    const r1 = line(320, '23', 1, '004', 2, '0092', m('ex'), m('whole', 4));
    const z1 = [r1.P.ds[0], r1.P.ds[1]];
    z1.forEach(e => put(e, { o: 0 }));
    hide(r1.A.cm, m('whole', .3), .3); hide(r1.B.cm, m('whole', .3), .3);
    hide(r1.B.ds[0], m('whole', .6), .3); hide(r1.B.ds[1], m('whole', .6), .3);
    show(r1.A.cm, m('c1')); brace(r1.A, 1, 350, '1 знак', m('c1', .2));
    show(r1.B.cm, m('c2')); show(r1.B.ds[0], m('c2')); show(r1.B.ds[1], m('c2')); brace(r1.B, 2, 350, '2 знака', m('c2', .2));
    klText(p, '1 + 2 = 3', 1250, 330, m('sum'), { size: 40, fill: DEN, weight: 700 });
    r1.P.hop(0, 3, m('hop', .4), tw, .6);
    show(z1[1], m('hop', 4.0), .4); show(z1[0], m('hop', 4.6), .4);
    tw(z1[1], { c_fill: RULE }, m('hop', 4.0), .2); tw(z1[1], { c_fill: COL.chalk }, m('hop', 5.4), .6);
    tw(z1[0], { c_fill: RULE }, m('hop', 4.6), .2); tw(z1[0], { c_fill: COL.chalk }, m('hop', 5.8), .6);
    brace(r1.P, 3, 350, '3 знака', m('hop', 2.4));
    klText(p, 'ноль целых девяносто две тысячных', 800, 470, m('ans'), { size: 30, fill: COL.dim, anchor: 'middle' });
    // 1,5 · 0,4: 15 · 4 = 60, two digits after the comma: 0,60, and only then the end zero goes.
    const r2 = line(640, '15', 1, '04', 1, '060', m('ex2'), m('whole2', 1.8));
    put(r2.P.ds[0], { o: 0 });
    hide(r2.A.cm, m('whole2'), .3); hide(r2.B.cm, m('whole2'), .3); hide(r2.B.ds[0], m('whole2', .3), .3);
    show(r2.A.cm, m('hop2')); show(r2.B.cm, m('hop2')); show(r2.B.ds[0], m('hop2'));
    r2.P.hop(0, 2, m('hop2', .4), tw, .55);
    show(r2.P.ds[0], m('hop2', 1.5), .4);
    brace(r2.P, 2, 670, '1 + 1 = 2', m('hop2', 1.2));
    const end = r2.P.ds[2];
    klStrike(p, r2.P.px(0) - W * .85, 655, r2.P.px(0) - W * .15, 585, m('zero', .4));
    tw(end, { o: .3 }, m('zero', .8), .5);
    klText(p, '0,60 = 0,6', 1250, 640, m('zero', 1.2), { size: 40, fill: COL.chalk, weight: 600 });
    klText(p, 'сначала ставим запятую, потом отбрасываем нули', 800, 820, m('after'), { size: 32, fill: RULE, weight: 600, anchor: 'middle' });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    klMath(p, ['3,6 · 0,3'], 800, 200, .2, { size: 64, anchor: 'end' });

    put(S.q1eq, { o: 0 });
    klRow(p, ['как целые:  ', { m: '36 · 3 = 108' }], 800, 290, .3, { size: 30, msize: 48, fill: COL.dim });
    S.q1row = c18Digits(p, '108', 800, 490, 2, { size: 130, t0: .4 });

        : k === 2 ? 'Так после запятой один знак. Посчитай знаки у обоих множителей.'
          : 'Без запятой получится 108 — в сто раз больше. Отдели знаки справа.',
      () => { fx(S.q1row.cm, { o: 1 }, 0, .3); fx(S.q1eq, { o: 1 }, .3, .4); }),

  ['divint', 'Деление на целое число', m => {

    const C = c18Corner(p, { x: 230, y: 330, dividend: '7,2', divisor: '3', size: 76, lh: 80, qn: 2, t0: m('ex') });
    pulse(C.dg[0], m('q1'), 1.3);
    C.q('2', 0, m('q1', .6));

    C.line(0, 1, 3, m('r2', .4));

  ['q2', 'Проверь себя', () => {

    S.q2steps = [C.q('1', 0, null), C.num('7', 0, 1, null, { minus: true }), C.line(0, 0, 1, null), C.num('2', 0, 2, null),
      C.qc(1, null), C.num('1', 1, 2, null, { fill: RULE }), C.q('3', 1, null), C.num('21', 1, 3, null, { minus: true }), C.line(0, 1, 3, null), C.num('0', 1, 4, null)];

      fx: () => S.q2steps.forEach((e, i) => fx(e, e.tagName === 'path' ? { d: 1 } : { o: 1 }, i * .18, .3)) }]),

  ['divdec', 'Деление на десятичную дробь', m => {
    const p = panel(0);
    klTitle(p, 'Делим на десятичную дробь');
    const size = 72;
    const ex = (y, a, b, ra, rb, pl, tSubj, tFrac) => {
      const sj = klRow(p, [{ m: a, fill: NUM }, { m: ' : ' }, { m: b, fill: DEN }], 610, y + 22, tSubj, { msize: size, anchor: 'end' });
      tw(sj, { o: .45 }, tSubj + 2.6, .25); tw(sj, { o: 1 }, tSubj + 2.9, .3);
      klMath(p, ['='], 645, y + 22, tFrac, { size });
      draw(path(p, `M${740 - ra.length * size * .34 - 12} ${y}H${740 + ra.length * size * .34 + 12}`, { stroke: COL.chalk, 'stroke-width': 3.5 }, { d: 0 }), tFrac, .4);
      return [c18Digits(p, ra, 740, y - 25, pl, { size, fill: NUM, t0: tFrac }), c18Digits(p, rb, 740, y + 75, pl, { size, fill: DEN, t0: tFrac })];
    };
