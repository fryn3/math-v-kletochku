<script>
'use strict';
// Тема 8.1 «Движение, работа, покупки» (5–6 класс). Beat ids match papermorph/content/uroki/ch35/narration.ru.json.
const CHAPTER = { number: 35, label: '8.1', title: 'Движение, работа, покупки', minutes: 7, language: 'ru', next: '../ch36/' };

// Meanings in this lesson: the result (path, work, cost, a distance) in RES, the rate (speed, output per hour, price) of
// the first mover or pipe in RATE, of the second in RATE2, time and quantity in TIME, a sum of rates and the rule in RULE.
const RES = KL.NUM, RATE = KL.DEN, RATE2 = KL.WHOLE, TIME = KL.TWO, RULE = KL.RULE;

// Words in several colours on one line: pieces [[text, fill], …]; returns the group.
function c35Words(p, pieces, x, y, t0, { size = 34, anchor = 'start', weight = 600 } = {}) {
  const w = pieces.reduce((s, [str]) => s + klW(str, size, weight), 0);
  const g = G(p, { o: t0 === undefined ? 1 : 0 });
  let cx = x - (anchor === 'middle' ? w / 2 : anchor === 'end' ? w : 0);
  pieces.forEach(([str, fill]) => { T(g, str, { x: cx, y, size, fill, weight }); cx += klW(str, size, weight); });
  if (t0 !== undefined) show(g, t0);
  return g;
}
// A road at height y: 0 km at x0, `km` pixels per kilometre up to max; ticks every `tick`, labels every `step`.
// Returns { g, X }: X(v) is the x of kilometre v.
function c35Road(p, { x0, km, max, y, step, tick = step, t0, size = 32 }) {
  const X = v => x0 + v * km, g = G(p, { o: 0 });
  path(g, `M${X(0) - 30} ${y}H${X(max) + 30}`, { stroke: COL.chalk, 'stroke-width': 4 });
  for (let k = 0; k <= max + 1e-9; k += tick) {
    const lab = Math.abs(k / step - Math.round(k / step)) < 1e-9;
    path(g, `M${X(k)} ${y - (lab ? 12 : 8)}V${y + (lab ? 12 : 8)}`, { stroke: COL.chalk, 'stroke-width': lab ? 3.5 : 2.5 });
    if (lab) T(g, String(k), { x: X(k), y: y + 50, size, fill: COL.chalk, font: MATH, anchor: 'middle' });
  }
  T(g, 'км', { x: X(max) + 44, y: y + 50, size: size - 4, fill: COL.dim });
  show(g, t0);
  return { g, X };
}
// A chalk car whose front bumper is at (x, y), wheels on y, facing right (dir 1) or left (dir −1), tinted col; label
// (its speed) rides above it.
function c35Car(p, x, y, dir = 1, col = COL.chalk, label, o = 1) {
  const g = G(p, { x, y, o }), k = -dir, X = v => (v * k).toFixed(0);
  path(g, `M${X(150)} -16V-44Q${X(150)} -50 ${X(142)} -50H${X(112)}L${X(88)} -78H${X(36)}L${X(14)} -50H${X(6)}Q0 -50 0 -42V-16Z`, { fill: col, 'fill-opacity': .22, stroke: COL.chalk, 'stroke-width': 3.5 });
  path(g, `M${X(104)} -50L${X(84)} -72H${X(66)}V-50ZM${X(58)} -50V-72H${X(40)}L${X(22)} -50Z`, { fill: col, 'fill-opacity': .45 });
  [118, 34].forEach(cx => mk('circle', { cx: X(cx), cy: -15, r: 14, fill: COL.board, stroke: COL.chalk, 'stroke-width': 4 }, g));
  if (label) T(g, label, { x: X(75), y: -100, size: 30, fill: col, weight: 700, anchor: 'middle' });
  return g;
}
// A walker standing at (x, y) (feet on y), and a cyclist whose front wheel touches x; label above each.
function c35Walker(p, x, y, col, label, o = 1) {
  const g = G(p, { x, y, o }), st = { stroke: col, 'stroke-width': 5 };
  mk('circle', { cx: 0, cy: -86, r: 13, fill: 'none', stroke: col, 'stroke-width': 4.5 }, g);
  path(g, 'M0 -72V-34M0 -34L-15 0M0 -34L15 0M-17 -48L0 -62L17 -48', st);
  if (label) T(g, label, { x: 0, y: -116, size: 30, fill: col, weight: 700, anchor: 'middle' });
  return g;
}
function c35Bike(p, x, y, col, label, o = 1) {
  const g = G(p, { x, y, o }), st = { stroke: col, 'stroke-width': 4.5 };
  [-22, -98].forEach(cx => mk('circle', { cx, cy: -22, r: 21, fill: 'none', stroke: COL.chalk, 'stroke-width': 3.5 }, g));
  path(g, 'M-98 -22L-70 -56H-34L-22 -22M-70 -56L-60 -22H-22M-34 -56L-30 -68', { stroke: COL.chalk, 'stroke-width': 3 });
  mk('circle', { cx: -56, cy: -112, r: 12, fill: 'none', stroke: col, 'stroke-width': 4.5 }, g);
  path(g, 'M-58 -99L-66 -62L-50 -40M-60 -90L-34 -70', st);
  if (label) T(g, label, { x: -60, y: -140, size: 30, fill: col, weight: 700, anchor: 'middle' });
  return g;
}
// A boat on the water line y, centred on x, bow to the right (dir 1) or to the left (dir −1).
function c35Boat(p, x, y, dir = 1, o = 1) {
  const g = G(p, { x, y, o }), k = dir;
  path(g, `M${-70 * k} -14H${80 * k}L${52 * k} 14H${-56 * k}Z`, { fill: RATE, 'fill-opacity': .3, stroke: COL.chalk, 'stroke-width': 3.5 });
  path(g, `M${-30 * k} -14V-40H${20 * k}V-14`, { stroke: COL.chalk, 'stroke-width': 3, fill: COL.chalk, 'fill-opacity': .12 });
  return g;
}
// One hop from km a to km b (an hour or a step of the story): a dashed arc above the road at height y with its label.
function c35Hop(g, X, a, b, y, t, per, col, label) {
  const xa = X(a), xb = X(b), up = 50;
  draw(path(g, `M${xa} ${y}Q${(xa + xb) / 2} ${y - up} ${xb} ${y}`, { stroke: col, 'stroke-width': 3, fill: 'none', 'stroke-dasharray': '8 7' }, { d: 0 }), t, per);
  if (label) klText(g, label, (xa + xb) / 2, y - up / 2 - 12, t + per * .7, { size: 26, fill: col, weight: 700, anchor: 'middle' });
}
// Move a group's x from xa to xb (prog, or fxp in an answer effect when fxMode).
const c35Go = (e, xa, xb, t, dur, fxMode) => (fxMode ? fxp : prog)(q => put(e, { x: xa + (xb - xa) * q }), t, dur, lin);
// A bracket under a stretch of road with its label, in its own group (so it can leave when the gap changes).
function c35Gap(p, x1, x2, y, label, t0, col = RES) {
  const g = G(p);
  klBrace(g, x1, x2, y, label, t0, { up: false, fill: col, size: 30 });
  return g;
}
// A pool w × h at (x, y) split into n equal layers by faint lines. fill(k, cnt, col, t, dur, fxMode) pours layers
// k … k + cnt − 1 (water rising from the bottom of layer k), under the lines and the walls.
function c35Tank(p, { x, y, w, h, n, t0 }) {
  const g = G(p, { o: 0 }), water = G(g), lh = h / n;
  for (let k = 1; k < n; k++) path(g, `M${x + 4} ${y + h - k * lh}H${x + w - 4}`, { stroke: COL.chalk, 'stroke-width': 1.5, 'stroke-opacity': .35, 'stroke-dasharray': '6 6' });
  path(g, `M${x} ${y - 10}V${y + h}H${x + w}V${y - 10}`, { stroke: COL.chalk, 'stroke-width': 4.5 });
  show(g, t0);
  const fill = (k, cnt, col, t, dur = .8, fxMode) => {
    const bot = y + h - k * lh, top = bot - cnt * lh;
    const r = mk('rect', { x: x + 3, y: bot, width: w - 6, height: 0, fill: col, 'fill-opacity': .6 }, water);
    (fxMode ? fxp : prog)(q => { r.setAttribute('y', bot - (bot - top) * q); r.setAttribute('height', (bot - top) * q); }, t, dur, lin);
    return r;
  };
  return { g, fill, lh, x, y, w, h };
}
// A pipe over the pool's corner (side −1 left, +1 right) and its stream, shown from t for dur seconds (fx when fxMode).
function c35Pipe(p, tank, side, col) {
  const xm = side < 0 ? tank.x + 40 : tank.x + tank.w - 40, xe = side < 0 ? tank.x - 90 : tank.x + tank.w + 90;
  path(p, `M${xe} ${tank.y - 50}H${xm}V${tank.y - 22}`, { stroke: col, 'stroke-width': 14, 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter' });
  const s = path(p, `M${xm} ${tank.y - 18}V${tank.y + tank.h - 8}`, { stroke: col, 'stroke-width': 6, 'stroke-opacity': .7, 'stroke-dasharray': '10 8' });
  put(s, { o: 0 });
  return (t, dur, fxMode) => { if (fxMode) { fx(s, { o: 1 }, t, .15); fx(s, { o: 0 }, t + dur, .2); } else { show(s, t, .15); hide(s, t + dur, .2); } };
}
// A horizontal arrow from x1 to x2 at height y (head at x2) with its label above the middle, drawn on at t0.
function c35Arrow(p, x1, x2, y, col, label, t0) {
  const g = G(p), k = x2 > x1 ? -1 : 1;
  draw(path(g, `M${x1} ${y}H${x2}`, { stroke: col, 'stroke-width': 6 }, { d: 0 }), t0, .45);
  const head = path(g, `M${x2 + k * 18} ${y - 13}L${x2} ${y}L${x2 + k * 18} ${y + 13}`, { stroke: col, 'stroke-width': 6, fill: 'none' }, { o: 0 });
  show(head, t0 + .4, .15);
  if (label) klText(g, label, (x1 + x2) / 2, y - 22, t0 + .3, { size: 28, fill: col, weight: 700, anchor: 'middle' });
  return g;
}
// A time bar from x0 to x0 + w at height y (50 high), growing from t0 (no t0: hidden, for an answer effect).
function c35Bar(p, x0, w, y, col, t0, op = .55) {
  const r = mk('rect', { x: x0, y: y - 25, width: t0 === undefined ? w : 0, height: 50, rx: 6, fill: col, 'fill-opacity': op, stroke: col, 'stroke-width': 2.5 }, p);
  if (t0 === undefined) put(r, { o: 0 });
  else prog(q => r.setAttribute('width', w * q), t0, .8);
  return r;
}
// An hour scale at height y: 0 at x0, u pixels per hour, labels every `step` hours up to max, «ч» at the end.
function c35Hours(p, x0, u, max, y, step, t0) {
  const g = G(p, { o: 0 });
  path(g, `M${x0} ${y}H${x0 + max * u + 20}`, { stroke: COL.chalk, 'stroke-width': 3 });
  for (let h = 0; h <= max; h += step) {
    path(g, `M${x0 + h * u} ${y - 10}V${y + 10}`, { stroke: COL.chalk, 'stroke-width': 3 });
    T(g, String(h), { x: x0 + h * u, y: y + 44, size: 28, fill: COL.chalk, font: MATH, anchor: 'middle' });
  }
  T(g, 'ч', { x: x0 + max * u + 40, y: y + 44, size: 28, fill: COL.dim });
  show(g, t0);
  return g;
}
// A small notebook with its price tag, centred on x with its top at y.
function c35Book(p, x, y, o = 1) {
  const g = G(p, { x, y, o });
  mk('rect', { x: -30, y: 0, width: 60, height: 78, rx: 5, fill: RATE, 'fill-opacity': .18, stroke: COL.chalk, 'stroke-width': 3 }, g);
  path(g, 'M-20 0V78', { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .6 });
  T(g, '15 ₽', { x: 0, y: -12, size: 24, fill: RATE, weight: 700, anchor: 'middle' });
  return g;
}
// One line said in two parts: left ends at xm (from t1), right starts at xm (from t2); klRow options.
function c35Two(p, left, right, xm, y, t1, t2, o = {}) {
  klRow(p, left, xm, y, t1, { ...o, anchor: 'end' });
  klRow(p, right, xm, y, t2, { ...o, anchor: 'start' });
}
// A ring of radius r that flashes round (x, y) at t0 to point at something.
function c35Ping(p, x, y, t0, col, r = 70) {
  const e = mk('circle', { cx: x, cy: y, r, fill: 'none', stroke: col, 'stroke-width': 4 }, p);
  put(e, { o: 0 }); show(e, t0, .3); hide(e, t0 + 1.6, .5);
  return e;
}
// A block «12» (one hour of the master's work), x its left edge, y its top.
function c35Block(p, x, y, o = 1) {
  const g = G(p, { x, y, o });
  mk('rect', { x: 0, y: 0, width: 96, height: 50, rx: 6, fill: RES, 'fill-opacity': .28, stroke: RES, 'stroke-width': 2.5 }, g);
  T(g, '12', { x: 48, y: 35, size: 28, fill: COL.chalk, font: MATH, anchor: 'middle' });
  return g;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Движение, работа, покупки', (m, D) => klIntro(m, D, {
    unit: 'Глава 8 · Текстовые задачи · Тема 8.1',
    title: 'Движение, работа, покупки',
    sub: 'Одна формула — и три вида задач',
    art: (g, t0) => {
      const car = c35Car(g, 560, 700, 1, RATE);
      c35Go(car, 560, 760, t0 + .4, 2.2);
      klRow(g, [{ m: 's', fill: RES }, { m: ' = ' }, { m: 'v', fill: RATE }, { m: ' · ' }, { m: 't', fill: TIME }], 1030, 690, t0 + 1.4, { msize: 60 });
    },
  })],

  ['drive', 'Путь, скорость, время', m => {
    const p = panel(0);
    klTitle(p, 'Путь, скорость и время', 'машина едет со скоростью 60 км/ч');
    const RY = 460, { X } = c35Road(p, { x0: 200, km: 5, max: 240, y: RY, step: 60, tick: 30, t0: .2 });
    const car = c35Car(p, X(0), RY - 3, 1, RATE, '60 км/ч');
    put(car.lastChild, { o: 0 }); show(car.lastChild, 2);
    const arcs = G(p);
    [0, 1, 2].forEach(i => {
      c35Go(car, X(60 * i), X(60 * (i + 1)), m('h', i * .9), .9);
      c35Hop(arcs, X, 60 * i, 60 * (i + 1), RY - 130, m('h', i * .9), .9, TIME, (i + 1) + ' ч');
    });
    c35Gap(p, X(0), X(180), RY + 78, '180 км', m('h3'));
    // s = v · t and the two formulas it gives, each with this drive's numbers under it.
    const F2 = (parts, x, y, t, ms = 64) => klRow(p, parts, x, y, t, { msize: ms });
    F2([{ m: 's', fill: RES }, { m: ' = ' }, { m: 'v', fill: RATE }, { m: ' · ' }, { m: 't', fill: TIME }], 360, 700, m('f'));
    F2([{ m: '180', fill: RES }, { m: ' = ' }, { m: '60', fill: RATE }, { m: ' · ' }, { m: '3', fill: TIME }], 360, 790, m('f', 1.4), 46);
    klText(p, 'путь = скорость · время', 360, 850, m('f', .6), { size: 26, fill: COL.dim, anchor: 'middle' });
    F2([{ m: 'v', fill: RATE }, { m: ' = ' }, { m: 's', fill: RES }, { m: ' : ' }, { m: 't', fill: TIME }], 840, 700, m('back', 1.6));
    F2([{ m: '60', fill: RATE }, { m: ' = ' }, { m: '180', fill: RES }, { m: ' : ' }, { m: '3', fill: TIME }], 840, 790, m('back', 2.6), 46);
    F2([{ m: 't', fill: TIME }, { m: ' = ' }, { m: 's', fill: RES }, { m: ' : ' }, { m: 'v', fill: RATE }], 1290, 700, m('back2', .8));
    F2([{ m: '3', fill: TIME }, { m: ' = ' }, { m: '180', fill: RES }, { m: ' : ' }, { m: '60', fill: RATE }], 1290, 790, m('back2', 1.8), 46);
    show(path(p, 'M600 650V830M1060 650V830', { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '6 8' }, { o: 0 }), m('back'));
  }],

  ['same', 'Одна формула', m => {
    const p = panel(0);
    klTitle(p, 'Одна формула — три задачи');
    const FX0 = 760, Y = [300, 520, 740];
    const row = (y, words, nums, t1, t2) => {
      c35Words(p, words, FX0, y - 20, t1);
      klRow(p, nums, FX0, y + 50, t2, { msize: 48, anchor: 'start' });
    };
    // Motion: carried over from the road.
    const car = c35Car(p, 460, Y[0] + 30, 1, RATE, '60 км/ч');
    put(car, { o: 0 }); show(car, .2);
    row(Y[0], [['путь', RES], [' = ', COL.chalk], ['скорость', RATE], [' · ', COL.chalk], ['время', TIME]],
      [{ m: '180', fill: RES }, { m: ' = ' }, { m: '60', fill: RATE }, { m: ' · ' }, { m: '3', fill: TIME }], .3, .5);
    // Work: one block of 12 details for each hour.
    const BX = 130, BY = Y[1] - 30;
    const blocks = [0, 1, 2, 3, 4].map(i => c35Block(p, BX + i * 104, BY, 0));
    show(blocks[0], m('work'));
    klText(p, '12 деталей в час', BX, BY - 26, m('work', .3), { size: 28, fill: RATE, weight: 600 });
    blocks.slice(1).forEach((b, i) => { put(b, { x: BX + 30 }); tw(b, { o: 1, x: BX + (i + 1) * 104 }, m('work5', i * .3), .45); });
    c35Gap(p, BX, BX + 5 * 104 - 8, BY + 72, '5 ч', m('work5', 1.3), TIME);
    row(Y[1], [['работа', RES], [' = ', COL.chalk], ['производительность', RATE], [' · ', COL.chalk], ['время', TIME]],
      [{ m: '60', fill: RES }, { m: ' = ' }, { m: '12', fill: RATE }, { m: ' · ' }, { m: '5', fill: TIME }], m('work5', 2), m('work5', 2.6));
    // Purchases: four notebooks at 15 ₽.
    const books = [0, 1, 2, 3].map(i => c35Book(p, 180 + i * 110, Y[2] - 30, 0));
    show(books[0], m('buy'));
    books.slice(1).forEach((b, i) => show(b, m('buy4', i * .3)));
    c35Gap(p, 140, 550, Y[2] + 66, '4 шт.', m('buy4', 1.1), TIME);
    row(Y[2], [['стоимость', RES], [' = ', COL.chalk], ['цена', RATE], [' · ', COL.chalk], ['количество', TIME]],
      [{ m: '60', fill: RES }, { m: ' = ' }, { m: '15', fill: RATE }, { m: ' · ' }, { m: '4', fill: TIME }], m('buy4', 1.6), m('buy4', 2.2));
    // The rule: the middle word of every line is «how much for one unit».
    // «Везде одно и то же»: the three lines' «=» light up together; then the middle words, then the last words.
    const W = s => klW(s, 34, 600);
    const lines = [['путь', 'скорость', 'время'], ['работа', 'производительность', 'время'], ['стоимость', 'цена', 'количество']];
    lines.forEach(([a], i) => { const e = T(p, '=', { x: FX0 + W(a) + W(' = ') / 2, y: Y[i] - 20, size: 34, fill: RULE, weight: 600, anchor: 'middle' }); put(e, { o: 0 }); show(e, m('rule', .5 + i * .2), .3); });
    const under = (i, x1, x2, col, t) => draw(path(p, `M${x1} ${Y[i] - 6}H${x2}`, { stroke: col, 'stroke-width': 4 }, { d: 0 }), t, .4);
    lines.forEach(([a, b, c], i) => {
      const x1 = FX0 + W(a) + W(' = '), x2 = x1 + W(b), x3 = x2 + W(' · ');
      under(i, x1, x2, RATE, m('one', i * .3));
      under(i, x3, x3 + W(c), TIME, m('units', i * .3));
    });
    c35Words(p, [['сколько на одну единицу', RATE]], 1130, 860, m('one', 1), { size: 30, anchor: 'end' });
    c35Words(p, [['  ·  ', COL.chalk], ['число единиц', TIME]], 1130, 860, m('units', 1), { size: 30, anchor: 'start' });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    klText(p, 'Машина проехала 240 км за 3 ч.', 800, 190, .2, { size: 36, weight: 600, anchor: 'middle' });
    const RY = 450, { X } = c35Road(p, { x0: 200, km: 5, max: 240, y: RY, step: 60, tick: 30, t0: .2 });
    const car = c35Car(p, X(0), RY - 3, 1, RATE);
    const arcs = G(p);
    S.q1lab = [0, 1, 2].map(i => {
      c35Go(car, X(80 * i), X(80 * (i + 1)), .5 + i * .5, .5);
      c35Hop(arcs, X, 80 * i, 80 * (i + 1), RY - 110, .5 + i * .5, .5, TIME, (i + 1) + ' ч');
      return klText(p, '? км', X(80 * i + 40), RY - 20, .6 + i * .5, { size: 26, fill: COL.dim, anchor: 'middle' });
    });
    S.q1km = [0, 1, 2].map(i => { const e = klText(p, '80 км', X(80 * i + 40), RY - 20, undefined, { size: 26, fill: RATE, weight: 700, anchor: 'middle' }); put(e, { o: 0 }); return e; });
    c35Gap(p, X(0), X(240), RY + 78, '240 км', .8);
  }, { ask: done => quiz(BAND, [{
    id: 'c-skorost', prompt: 'С какой скоростью ехала машина?',

  }], done, 'Практика по теме · часть 2 из 3') }],

  ['final3', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-poezda', prompt: 'Расстояние между городами 360 км. Из них одновременно навстречу друг другу вышли два поезда: 70 км/ч и 50 км/ч. Через сколько часов они встретятся?',
    build: blanks([{ parts: [{ box: '3' }, ' ч'], why: 'Скорость сближения 70 + 50 = 120 км/ч; 360 : 120 = 3 ч.', hint: 'Навстречу скорости складываются.' }]),
  }, {
    id: 'p-brigady', prompt: 'Первая бригада может выполнить заказ за 10 дней, вторая — за 15 дней. За сколько дней они выполнят заказ, работая вместе?',
    build: blanks([{ parts: [{ box: '6' }, ' дней'], why: 'За день вместе: 1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6 заказа; весь — за 6 дней.', hint: 'Весь заказ — 1. Сложи, какую часть каждая бригада делает за день.' }]),
  }], done, 'Практика по теме · часть 3 из 3') }],

  ['finish', 'Конец темы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
