<script>
'use strict';
// Тема 7.1 «Углы и прямые» (5–6 класс). Beat ids match papermorph/content/uroki/ch29/narration.ru.json.
const CHAPTER = { number: 29, label: '7.1', title: 'Углы и прямые', minutes: 8, language: 'ru', next: '../ch30/' };

// Colours: an angle (its sector, arc and degrees) — KL.NUM, the part of a full turn taken; the second angle of a pair
// (adjacent, the other vertical pair) — KL.TWO; the protractor's inner scale and the clock's cuts — KL.DEN; a line that
// turns against a fixed one — KL.WHOLE; rules — KL.RULE; a wrong reading — COL.bad.
const NUM = KL.NUM, DEN = KL.DEN, TWO = KL.TWO, WHOLE = KL.WHOLE, RULE = KL.RULE;

/* ---------- geometry helpers (c29) ---------- */
// The point at distance r from (cx, cy) in direction a (degrees, counter-clockwise from the right, as in maths).
const c29Pt = (cx, cy, r, a) => [cx + r * Math.cos(a * Math.PI / 180), cy - r * Math.sin(a * Math.PI / 180)];
const c29f = v => v.toFixed(1);
// An arc of radius r from direction a0 to a1 (counter-clockwise), with or without the centre (a sector).
function c29ArcD(cx, cy, r, a0, a1, sector = false) {
  const s = Math.min(a1 - a0, 359.9);
  if (s < .3) return 'M0 0';
  const [x0, y0] = c29Pt(cx, cy, r, a0), [x1, y1] = c29Pt(cx, cy, r, a0 + s);
  const arc = `A${r} ${r} 0 ${s > 180 ? 1 : 0} 0 ${c29f(x1)} ${c29f(y1)}`;
  return sector ? `M${cx} ${cy}L${c29f(x0)} ${c29f(y0)}${arc}Z` : `M${c29f(x0)} ${c29f(y0)}${arc}`;
}
// An angle at (cx, cy) from direction a0 to a1: a pale sector, its arc (a small square when it is 90°) and its size in
// degrees beside the arc (lab: a string shows that instead, false shows nothing). set(a0, a1) redraws it, also live.
function c29Ang(p, cx, cy, { r = 80, col = NUM, a0 = 0, a1 = 50, lab = true, lr, size = 40, o = 0, op = .28, sq = true } = {}) {
  const g = G(p, { o });
  const sec = path(g, 'M0 0', { fill: col, 'fill-opacity': op });
  const arc = path(g, 'M0 0', { stroke: col, 'stroke-width': 4 });
  const t = T(g, '', { size, fill: col, font: MATH, anchor: 'middle', weight: 600 });
  const A = {
    g, t, sec, cx, cy, r, lab,
    set(b0, b1) {
      const s = b1 - b0, right = sq && Math.abs(s - 90) < .5;
      sec.setAttribute('d', c29ArcD(cx, cy, right ? r * .5 : r, b0, b1, true));
      if (right) {
        const q = r * .5, [x1, y1] = c29Pt(cx, cy, q, b0), [x3, y3] = c29Pt(cx, cy, q, b1);
        arc.setAttribute('d', `M${c29f(x1)} ${c29f(y1)}L${c29f(x1 + x3 - cx)} ${c29f(y1 + y3 - cy)}L${c29f(x3)} ${c29f(y3)}`);
      } else arc.setAttribute('d', c29ArcD(cx, cy, r, b0, b1));
      const [x, y] = c29Pt(cx, cy, lr || r + size * .95, (b0 + b1) / 2);
      put(t, { x, y: y + size * .35 });
      t.textContent = s < 1 ? '' : A.lab === true ? `${Math.round(s)}°` : A.lab || '';
    },
  };
  A.set(a0, a1);
  return A;
}
// A ray from (cx, cy) in direction a, len long: a group at the vertex turned by r = −a, its line ready to be drawn on.
function c29Ray(p, cx, cy, len, a, { col = COL.chalk, w = 4.5, back = 0 } = {}) {
  const g = G(p, { x: cx, y: cy, r: -a });
  g.line = path(g, `M${-back} 0H${len}`, { stroke: col, 'stroke-width': w }, { d: 0 });
  return g;
}
// The vertex: a chalk dot in its own group at (x, y), so pulse() grows it in place.
function c29Dot(p, x, y, t0, { col = COL.chalk, r = 8 } = {}) {
  const g = G(p, { x, y, s: 0, o: 0 });
  mk('circle', { r, fill: col }, g);
  pop(g, t0);
  return g;
}
// A protractor around its centre (0, 0), radius R, placed at (x, y): a pale half-disc, a tick every degree and two
// scales every 10°: inner (0 on the right) in KL.DEN, outer (0 on the left) in chalk. inner[k], outer[k] are the
// numbers at direction 10k (inner reads 10k, outer 180 − 10k); each sits in its own group, so pulse() works in place.
function c29Protractor(p, R, { x, y, r = 0, o = 1 } = {}) {
  const g = G(p, { x, y, r, o });
  path(g, `M${-R} 0A${R} ${R} 0 0 1 ${R} 0Z`, { fill: COL.chalk, 'fill-opacity': .08, stroke: COL.chalk, 'stroke-width': 3 });
  let thin = '', thick = '';
  for (let a = 0; a <= 180; a++) {
    const len = a % 10 === 0 ? 24 : a % 5 === 0 ? 15 : 8;
    const [x0, y0] = c29Pt(0, 0, R, a), [x1, y1] = c29Pt(0, 0, R - len, a);
    const d = `M${c29f(x0)} ${c29f(y0)}L${c29f(x1)} ${c29f(y1)}`;
    if (a % 10 === 0) thick += d; else thin += d;
  }
  path(g, thin, { stroke: COL.chalk, 'stroke-width': 1.4, 'stroke-opacity': .7 });
  path(g, thick, { stroke: COL.chalk, 'stroke-width': 2.6 });
  const fs = Math.round(R * .066), num = (val, a, rr, fill) => {
    const [nx, ny] = c29Pt(0, 0, rr, a), lift = a < 6 || a > 174 ? fs * .6 : 0;
    const ng = G(g, { x: nx, y: ny - lift });
    ng.t = T(ng, String(val), { y: fs * .35, size: fs, fill, font: MATH, anchor: 'middle', weight: 600 });
    return ng;
  };
  const outer = [], inner = [];
  for (let k = 0; k <= 18; k++) {
    outer.push(num(180 - k * 10, k * 10, R - 24 - fs * .95, COL.chalk));
    inner.push(num(k * 10, k * 10, R - 24 - fs * 2.25, DEN));
  }
  mk('circle', { r: 5, fill: COL.chalk }, g);
  path(g, 'M0 -16V0', { stroke: COL.chalk, 'stroke-width': 2.5 });
  return { g, inner, outer, R };
}
// A clock face at (cx, cy), radius r: rim, 60 ticks, numbers 1–12, the minute hand on 12 and the hour hand (a group
// turned by r = 30° an hour) on hour h. Returns { g, hour, spokes(t0) } — spokes draws 12 cuts in KL.DEN one by one.
function c29Clock(p, cx, cy, r, h, { o = 1 } = {}) {
  const g = G(p, { o });
  mk('circle', { cx, cy, r, fill: COL.chalk, 'fill-opacity': .05, stroke: COL.chalk, 'stroke-width': 4 }, g);
  const spokeG = G(g);
  let small = '', big = '';
  for (let k = 0; k < 60; k++) {
    const len = k % 5 === 0 ? 22 : 10, [x0, y0] = c29Pt(cx, cy, r - 4, 90 - k * 6), [x1, y1] = c29Pt(cx, cy, r - 4 - len, 90 - k * 6);
    const d = `M${c29f(x0)} ${c29f(y0)}L${c29f(x1)} ${c29f(y1)}`;
    if (k % 5 === 0) big += d; else small += d;
  }
  path(g, small, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .5 });
  path(g, big, { stroke: COL.chalk, 'stroke-width': 4 });
  const fs = Math.round(r * .14);
  for (let n = 1; n <= 12; n++) {
    const [x, y] = c29Pt(cx, cy, r - 30 - fs * .8, 90 - n * 30);
    T(g, String(n), { x, y: y + fs * .36, size: fs, font: MATH, anchor: 'middle', weight: 600 });
  }
  const minute = G(g, { x: cx, y: cy });
  path(minute, `M0 12V${-(r - 40)}`, { stroke: COL.chalk, 'stroke-width': 5 });
  const hour = G(g, { x: cx, y: cy, r: h * 30 });
  path(hour, `M0 12V${-r * .55}`, { stroke: COL.chalk, 'stroke-width': 10 });
  mk('circle', { cx, cy, r: 10, fill: COL.chalk }, g);
  return {
    g, hour,
    spokes(t0, step = .12) {
      for (let n = 0; n < 12; n++) {
        const [x, y] = c29Pt(cx, cy, r - 4, 90 - n * 30);
        draw(path(spokeG, `M${cx} ${cy}L${c29f(x)} ${c29f(y)}`, { stroke: DEN, 'stroke-width': 2.5, 'stroke-opacity': .8 }, { d: 0 }), t0 + n * step, .3);
      }
    },
  };
}
// Flash an angle's sector (a brighter fill for a moment) at t0.
function c29Flash(A, t0, k = .7) { tw(A.sec, { 'a_fill-opacity': k }, t0, .25); tw(A.sec, { 'a_fill-opacity': .28 }, t0 + .6, .5); }

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Углы и прямые', (m, D) => klIntro(m, D, {
    unit: 'Глава 7 · Геометрия · Тема 7.1',
    title: 'Углы и прямые',
    sub: 'Как измеряют углы и что бывает, когда прямые пересекаются',
    art: (g, t0) => {
      const A = c29Ang(g, 700, 700, { r: 70, a1: 50, size: 34 });
      show(A.g, t0 + .6);
      draw(c29Ray(g, 700, 700, 200, 0).line, t0, .5);
      draw(c29Ray(g, 700, 700, 200, 50, { col: NUM }).line, t0 + .3, .5);
    },
  })],

  ['angle', 'Что такое угол', m => {
    const p = panel(0);
    klTitle(p, 'Что такое угол');
    const V = [560, 520];
    const dot = c29Dot(p, ...V, .2);
    const r1 = c29Ray(p, ...V, 470, 0), r2 = c29Ray(p, ...V, 470, 40, { col: NUM });
    draw(r1.line, m('ray1'), .6);
    draw(r2.line, m('ray2'), .6);
    const A = c29Ang(p, ...V, { r: 90, a1: 40, lab: false });
    show(A.g, m('ray2', .4));
    const lv = klText(p, 'вершина', 536, 572, m('vertex'), { size: 32, anchor: 'end', fill: COL.chalk, weight: 600 });
    pulse(dot, m('vertex'), 2);
    const ls1 = klText(p, 'сторона', 900, 568, m('sides'), { size: 32, weight: 600 });
    const ls2 = klText(p, 'сторона', 790, 286, m('sides', .25), { size: 32, weight: 600, anchor: 'end', fill: NUM });
    tw(r1.line, { 'a_stroke-width': 9 }, m('sides'), .25); tw(r1.line, { 'a_stroke-width': 4.5 }, m('sides', .7), .4);
    tw(r2.line, { 'a_stroke-width': 9 }, m('sides', .25), .25); tw(r2.line, { 'a_stroke-width': 4.5 }, m('sides', .95), .4);
    [lv, ls1, ls2].forEach(e => hide(e, m('turn'), .4));
    const turn = (a, b, t, dur) => prog(q => { const v = a + (b - a) * q; put(r2, { r: -v }); A.set(0, v); }, t, dur);
    turn(40, 150, m('turn', .2), 3);
    turn(150, 360, m('full', -.6), 2.6);
    // a full turn cut into 360 degrees: a tick every degree, longer every 10°
    let d = '';
    for (let a = 0; a < 360; a++) {
      const len = a % 10 === 0 ? 22 : 9, [x0, y0] = c29Pt(...V, 232, a), [x1, y1] = c29Pt(...V, 232 - len, a);
      d += `M${c29f(x0)} ${c29f(y0)}L${c29f(x1)} ${c29f(y1)}`;
    }
    draw(path(p, d, { stroke: DEN, 'stroke-width': 1.6 }, { d: 0 }), m('deg', -.3), 1.6, lin);
    klText(p, 'полный оборот', 1110, 400, m('full', 1.6), { size: 38, weight: 600 });
    klText(p, '360°', 1110, 515, m('deg', .2), { size: 104, fill: NUM, weight: 700 });
    klText(p, '1° — одна из 360 равных долей', 1110, 580, m('deg', 1.6), { size: 28, fill: COL.dim });
  }],

  ['kinds', 'Виды углов', m => {
    const p = panel(0);
    klTitle(p, 'Острый, прямой, тупой, развёрнутый');
    const V = [800, 540];
    c29Dot(p, ...V, .2);
    draw(c29Ray(p, ...V, 400, 0).line, .2, .5);
    const ray = c29Ray(p, ...V, 400, 0, { col: NUM });
    draw(ray.line, .3, .5);
    const A = c29Ang(p, ...V, { r: 100, a1: 0, size: 44, o: 1 });
    const turn = (a, b, t, dur) => prog(q => { const v = a + (b - a) * q; put(ray, { r: -v }); A.set(0, v); }, t, dur);
    const stops = [['acute', 50, 'острый', 'меньше 90°'], ['right', 90, 'прямой', 'ровно 90°'],
      ['obtuse', 130, 'тупой', 'больше 90°, меньше 180°'], ['straight', 180, 'развёрнутый', 'ровно 180°']];
    turn(0, 50, .9, m('acute') - .9);
    // dashed yardsticks: a quarter turn (90°) and a half turn (180°)
    const dash = a => { const g = G(p, { x: V[0], y: V[1], r: -a, o: 0 }); path(g, 'M0 0H330', { stroke: RULE, 'stroke-width': 3, 'stroke-dasharray': '10 9' }); return g; };
    const g90 = dash(90), g180 = dash(180);
    show(g90, m('acute', 1), .4); hide(g90, m('right', .2), .3);
    pulse(A.t, m('a50'), 1.5);
    pulse(A.t, m('right', 2.2), 1.5);
    c29Flash(A, m('sq'), .8);
    show(g90, m('more'), .4); show(g180, m('less'), .4);
    pulse(A.t, m('a130'), 1.5);
    hide(g90, m('straight'), .3); hide(g180, m('straight'), .3);
    pulse(A.t, m('straight', 2), 1.5);
    tw(ray.line, { 'a_stroke-width': 9 }, m('one'), .3); tw(ray.line, { 'a_stroke-width': 4.5 }, m('one', 1), .4);
    const MX = [250, 610, 970, 1330];
    stops.forEach(([mark, deg, name, cond], i) => {
      const t = m(mark);
      if (i) turn(stops[i - 1][1], deg, t, 1.1);
      const lab = G(p, { o: 0 });
      T(lab, name, { x: 1250, y: 330, size: 48, fill: NUM, weight: 700 });
      T(lab, cond, { x: 1250, y: 378, size: 28, fill: COL.dim });
      const tl = i === 1 ? m('right', 3.4) : t + (i ? .6 : 0);
      show(lab, tl);
      if (i < 3) hide(lab, m(stops[i + 1][0]), .3);
      // the same angle, small, joins the row below
      const vx = MX[i] + (deg > 100 ? 40 : -30), mini = G(p, { o: 0, y: 20 });
      const mA = c29Ang(mini, vx, 780, { r: 34, a1: deg, size: 26, lr: 62, o: 1 });
      draw(c29Ray(mini, vx, 780, 110, 0).line, 0, 0);
      draw(c29Ray(mini, vx, 780, 110, deg, { col: NUM }).line, 0, 0);
      if (deg === 180) put(mA.t, { y: 720 });
      T(mini, name, { x: MX[i] + (deg === 180 ? 30 : 20), y: 850, size: 28, anchor: 'middle', weight: 600 });
      tw(mini, { o: 1, y: 0 }, i === 2 ? m('a130', .4) : tl + 1.1, .5);
      S['k' + i] = mA;
      c29Flash(mA, m('row', i * .55));
    });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    const CX = [230, 590, 950, 1310], DEG = [80, 35, 115, 90];
    S.q1 = DEG.map((deg, i) => {
      const vx = CX[i] + (deg > 90 ? 40 : -60), g = G(p, { o: 0 });
      draw(c29Ray(g, vx, 500, 190, 0).line, 0, 0);
      draw(c29Ray(g, vx, 500, 190, deg, { col: NUM }).line, 0, 0);
      const A = c29Ang(g, vx, 500, { r: 56, a1: deg, size: 34, lr: 96, o: 1, lab: false });
      mk('circle', { cx: vx, cy: 500, r: 6, fill: COL.chalk }, g);
      const lab = T(p, `${deg}°`, { x: CX[i], y: 600, size: 36, fill: NUM, font: MATH, anchor: 'middle', weight: 600, o: 0 });
      show(g, .3 + i * .15);
      return { g, A, lab, box: [CX[i] - 165, 260, 330, 300] };
    });
  }, { ask: done => quiz(BAND, [{
    id: 'c-tupoy', prompt: 'Какой из углов тупой? Нажми на него.',
    build: pickEls(S.q1.map((q, k) => ({ el: q.g, box: q.box, label: `угол ${k + 1}` })), 2,
      'Этот угол больше прямого, но меньше развёрнутого: 115°. Он тупой.',
      k => k === 3 ? 'Это прямой угол, он отмечен квадратиком: ровно 90°. Тупой — больше прямого.' : 'Этот угол меньше прямого — он острый. Тупой шире прямого угла.',
      () => S.q1.forEach((q, i) => fx(q.lab, { o: 1 }, i * .12, .3))),
  }], done) }],

  ['protractor', 'Транспортир', m => {
    const p = panel(0);
    klTitle(p, 'Как измерить угол транспортиром');
    const C = [800, 600], R = 340;
    const A = c29Ang(p, ...C, { r: 110, a1: 50, lab: false, o: 1, op: .18 });
    const base = c29Ray(p, ...C, 480, 0), side = c29Ray(p, ...C, 480, 50, { col: NUM });
    draw(base.line, .2, .5); draw(side.line, .4, .5);
    c29Dot(p, ...C, .2);
    const pr = c29Protractor(p, R, { x: 330, y: 470, r: -28, o: 0 });
    show(pr.g, m('tool'), .5);
    tw(pr.g, { x: C[0], y: C[1], r: 0 }, m('centre'), 1.3);
    const ring = mk('circle', { cx: C[0], cy: C[1], r: 20, fill: 'none', stroke: RULE, 'stroke-width': 4 }, p);
    put(ring, { o: 0 }); show(ring, m('centre', 1.2), .3);
    const cl = klText(p, 'центр — на вершину', C[0] - 40, C[1] + 60, m('centre', 1.3), { size: 30, fill: RULE, anchor: 'end', weight: 600 });
    const zl = klText(p, 'ноль — на сторону', C[0] + 300, C[1] + 60, m('zero', .2), { size: 30, fill: RULE, anchor: 'middle', weight: 600 });
    pulse(pr.inner[0], m('zero'), 2.2);
    tw(base.line, { 'a_stroke-width': 9, c_stroke: RULE }, m('zero'), .3);
    tw(base.line, { 'a_stroke-width': 4.5, c_stroke: COL.chalk }, m('zero', 1.6), .5);
    // count along the scale that starts at this zero: 10, 20, 30, 40, 50
    const t0 = m('read'), t5 = m('fifty'), sw = path(p, 'M0 0', { stroke: NUM, 'stroke-width': 8, 'stroke-opacity': .9 });
    prog(q => sw.setAttribute('d', c29ArcD(...C, R - 128, 0, 50 * q)), t0 - .2, t5 - t0 + .2, lin);
    for (let k = 1; k <= 5; k++) {
      const t = k < 5 ? t0 + (t5 - t0) * (k - 1) / 4 : t5;
      tw(pr.inner[k].t, { c_fill: NUM }, t, .2); pulse(pr.inner[k], t, 1.6);
    }
    const l50 = klText(p, '50°', 1200, 420, m('fifty', .3), { size: 72, fill: NUM, weight: 700 });
    tw(side.line, { 'a_stroke-width': 10 }, m('shows'), .3); tw(side.line, { 'a_stroke-width': 4.5 }, m('shows', 1.1), .4);
    c29Flash(A, m('shows', .3), .6);
    tw(l50, { s: 1.2 }, m('shows', .5), .3); tw(l50, { s: 1 }, m('shows', 1), .4);
    hide(cl, m('read'), .4); hide(zl, m('read'), .4);
  }],

  ['trap', 'Две шкалы', m => {
    const p = panel(0);
    klTitle(p, 'Ловушка: две шкалы');
    const C = [800, 600], R = 340;
    const TA = c29Ang(p, ...C, { r: 110, a1: 50, lab: false, o: 1, op: .18 });
    c29Flash(TA, m('less'), .7);
    draw(c29Ray(p, ...C, 480, 0).line, 0, 0); draw(c29Ray(p, ...C, 480, 50, { col: NUM }).line, 0, 0);
    const pr = c29Protractor(p, R, { x: C[0], y: C[1] });
    pr.inner.forEach((e, k) => pulse(e, m('two', k * .04), 1.4));
    pr.outer.forEach((e, k) => pulse(e, m('two', 1.1 + k * .04), 1.4));
    // the wrong reading: 130 on the outer scale, counted from the zero on the left, which is not on a side
    tw(pr.outer[5].t, { c_fill: COL.bad }, m('wrong'), .2); pulse(pr.outer[5], m('wrong'), 1.9);
    const wa = path(p, c29ArcD(...C, R - 58, 50, 180), { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 });
    tw(wa, { d: 1 }, m('wrong', .5), 1.1);
    const zr = mk('circle', { cx: C[0] - R + 34, cy: C[1] - 24, r: 26, fill: 'none', stroke: COL.bad, 'stroke-width': 4 }, p);
    put(zr, { o: 0 }); show(zr, m('wrong', 1.4), .3);
    klText(p, 'этот ноль — не на стороне угла', C[0] - R - 10, C[1] + 60, m('wrong', 1.6), { size: 28, fill: COL.bad, anchor: 'start' });
    klText(p, '130°', 1190, 300, m('wrong', .4), { size: 68, fill: COL.bad, weight: 700 });
    klStrike(p, 1180, 300, 1350, 240, m('check', -.4));
    // the right angle as a yardstick: our angle lies inside it, so it is less than 90°

  }], done, 'Практика по теме · часть 3 из 3') }],

  ['finish', 'Конец темы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
