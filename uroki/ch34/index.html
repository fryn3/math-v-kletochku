<script>
'use strict';
// Тема 7.6 «Координаты и симметрия» (6 класс). Beat ids match papermorph/content/uroki/ch34/narration.ru.json.
const CHAPTER = { number: 34, label: '7.6', title: 'Координаты и симметрия', minutes: 8, language: 'ru', next: '../ch35/' };

// Colours of this chapter: positive coordinates blue, negative coral (math.js POS / NEG, as in 6.1), mirrors, images
// and axes of symmetry green, the rule amber; points themselves chalk.
const RULE = KL.RULE, MIR = COL.irr;
const c34Col = v => v > 0 ? POS : v < 0 ? NEG : COL.chalk;

// A coordinate plane: origin at (cx, cy), u px a unit, x0…x1 by y0…y1. Parts are separate groups so a beat can build
// it: grid (light lines), ax and ay (each axis with its arrow, ticks, labels and name), O (the origin's letter).
// col: labels in the sign colours. No t0: shown at once. Returns { PX, PY, u, cx, cy, x0, x1, y0, y1, grid, ax, ay,
// O, lx: { v: text }, ly, nx, ny } (nx, ny: the axis names, each in a group at its place, for pulse).
const PL = { cx: 560, cy: 480, u: 50, x0: -7, x1: 7, y0: -5, y1: 5 };
const AL = { cx: 520, cy: 480, u: 50, x0: -6, x1: 6, y0: -5, y1: 5 };
const QL = { cx: 420, cy: 470, u: 48, x0: -6, x1: 6, y0: -5, y1: 5 };
function c34Plane(p, { cx, cy, u, x0, x1, y0, y1, t0, labels = true, col = true, size = 20 } = PL) {
  const PX = x => cx + x * u, PY = y => cy - y * u, o = t0 === undefined ? 1 : 0;
  const grid = G(p, { o }), ax = G(p, { o }), ay = G(p, { o }), lx = {}, ly = {};
  let d = '';
  for (let x = x0; x <= x1; x++) if (x) d += `M${PX(x)} ${PY(y0 - .3)}V${PY(y1 + .3)}`;
  for (let y = y0; y <= y1; y++) if (y) d += `M${PX(x0 - .3)} ${PY(y)}H${PX(x1 + .3)}`;
  path(grid, d, { stroke: COL.chalk, 'stroke-opacity': .14, 'stroke-width': 1.5 });
  const A = { stroke: COL.chalk, 'stroke-width': 3 }, xe = PX(x1 + .6), ye = PY(y1 + .6);
  path(ax, `M${PX(x0 - .5)} ${cy}H${xe}M${xe - 15} ${cy - 9}L${xe} ${cy}L${xe - 15} ${cy + 9}`, A);
  path(ay, `M${cx} ${PY(y0 - .5)}V${ye}M${cx - 9} ${ye + 15}L${cx} ${ye}L${cx + 9} ${ye + 15}`, A);
  const nx = G(ax, { x: xe + 4, y: cy + 34 }), ny = G(ay, { x: cx - 24, y: ye + 8 });
  T(nx, 'x', { size: 30, fill: COL.chalk, font: MATH, anchor: 'middle' }).setAttribute('font-style', 'italic');
  T(ny, 'y', { size: 30, fill: COL.chalk, font: MATH, anchor: 'middle' }).setAttribute('font-style', 'italic');
  for (let x = x0; x <= x1; x++) if (x) {
    path(ax, `M${PX(x)} ${cy - 6}V${cy + 6}`, { stroke: COL.dim, 'stroke-width': 2 });
    if (labels) lx[x] = T(ax, num(x), { x: PX(x), y: cy + 28, size, fill: col ? c34Col(x) : COL.dim, font: MATH, anchor: 'middle' });
  }
  for (let y = y0; y <= y1; y++) if (y) {
    path(ay, `M${cx - 6} ${PY(y)}H${cx + 6}`, { stroke: COL.dim, 'stroke-width': 2 });
    if (labels) ly[y] = T(ay, num(y), { x: cx - 13, y: PY(y) + 7, size, fill: col ? c34Col(y) : COL.dim, font: MATH, anchor: 'end' });
  }
  const O = labels ? T(p, 'O', { x: cx - 9, y: cy + 29, size: size + 4, fill: COL.chalk, font: MATH, anchor: 'end', o }) : null;
  if (t0 !== undefined) { show(grid, t0); show(ax, t0); show(ay, t0); if (O) show(O, t0); }
  return { PX, PY, u, cx, cy, x0, x1, y0, y1, grid, ax, ay, O, lx, ly, nx, ny };
}
// A point at (x, y) that pops in at t (no t: shown). Returns its group (at the point, so pulse scales it in place).
function c34Dot(p, P, x, y, t, { fill = COL.chalk, r = 11 } = {}) {
  const g = G(p, { x: P.PX(x), y: P.PY(y), o: t === undefined ? 1 : 0, s: t === undefined ? 1 : .3 });
  mk('circle', { r, fill, stroke: COL.board, 'stroke-width': 3 }, g);
  if (t !== undefined) tw(g, { o: 1, s: 1 }, t, .4, back);
  return g;
}
// klRow pieces for «A(3; −2)»: the name (in its colour), then each coordinate in its sign colour.
const c34Co = (name, x, y, fill = COL.chalk) => [{ m: name, fill }, { m: '(' }, { m: num(x), fill: c34Col(x) }, { m: '; ' }, { m: num(y), fill: c34Col(y) }, { m: ')' }];
// The coordinates written beside a point: a klRow of c34Co at (x, y) on the stage, in a group there (for pulse).
function c34Lab(p, name, X, Y, sx, sy, t, { size = 30, anchor = 'start', fill } = {}) {
  const g = G(p, { x: sx, y: sy });
  klRow(g, c34Co(name, X, Y, fill), 0, 0, t, { msize: size, anchor });
  return g;
}
// One straight leg of a walk on the grid, from a to b (both [x, y], same x or same y), drawn on at t, in the sign
// colour of its direction, with the steps counted 1, 2, 3 … beside it. Returns the time it ends.
function c34Leg(p, P, a, b, t, { step = .4, count = true, w = 6 } = {}) {
  const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.abs(dx + dy), col = c34Col(dx + dy);
  draw(path(p, `M${P.PX(a[0])} ${P.PY(a[1])}L${P.PX(b[0])} ${P.PY(b[1])}`, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { d: 0 }), t, n * step, lin);
  if (count) {
    const pts = [];
    for (let k = 1; k <= n; k++) {
      const fx0 = a[0] + Math.sign(dx) * (k - .5), fy0 = a[1] + Math.sign(dy) * (k - .5);
      pts.push(dx ? [P.PX(fx0), P.PY(a[1]) + (b[1] < 0 || a[1] < 0 ? 32 : -14)] : [P.PX(a[0]) + (a[0] < 0 ? -20 : 20), P.PY(fy0) + 9]);
    }
    klCount(p, pts, t + step * .6, { step, size: 24, fill: col });
  }
  return t + n * step;
}
// Dashed guides from the point (x, y) to both axes, faded in at t (to the x-axis) and t2 (to the y-axis).
function c34Drop(p, P, x, y, t, t2 = t + .4, col = COL.dim) {
  const s = { stroke: col, 'stroke-width': 2.5, 'stroke-dasharray': '8 7' };
  show(path(p, `M${P.PX(x)} ${P.PY(y)}V${P.cy}`, s, { o: 0 }), t, .4);
  show(path(p, `M${P.PX(x)} ${P.PY(y)}H${P.cx}`, s, { o: 0 }), t2, .4);
}
// A ring round (cx, cy), radius rx × ry, drawn on at t.
function c34Ring(p, cx, cy, rx, ry, t, col = RULE) {
  const e = path(p, `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0`, { stroke: col, 'stroke-width': 4 }, { d: 0 });
  draw(e, t, .5);
  return e;
}
// A mirror along an axis ('x' or 'y'): a broad green band drawn on at t. Returns it.
function c34Mirror(p, P, axis, t, o = .45) {
  const d = axis === 'x' ? `M${P.PX(P.x0 - .4)} ${P.cy}H${P.PX(P.x1 + .4)}` : `M${P.cx} ${P.PY(P.y0 - .4)}V${P.PY(P.y1 + .4)}`;
  const e = path(p, d, { stroke: MIR, 'stroke-width': 12, 'stroke-linecap': 'round' }, { d: 0, o });
  draw(e, t, .7);
  return e;
}
// Move a dot from grid point a to grid point b in a straight line.
function c34Fly(dot, P, a, b, t, dur = .9) {
  prog(q => put(dot, { x: P.PX(a[0] + (b[0] - a[0]) * q), y: P.PY(a[1] + (b[1] - a[1]) * q) }), t, dur, io);
}
// A closed polygon through stage points; c34Morph moves its corners from ptsA to ptsB (each corner on a straight line:
// a fold seen from above, so at the end the shape is the mirror image).
const c34D = pts => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L') + 'Z';
function c34Poly(p, pts, { fill = COL.chalk, op = .14, stroke = COL.chalk, w = 3, o = 1 } = {}) {
  return path(p, c34D(pts), { fill, 'fill-opacity': op, stroke, 'stroke-width': w, 'stroke-linejoin': 'round' }, { o });
}
function c34Morph(e, A, B, t, dur = 1.2, run = prog) {
  run(q => e.setAttribute('d', c34D(A.map(([x, y], i) => [x + (B[i][0] - x) * q, y + (B[i][1] - y) * q]))), t, dur, io);
}
// Reflect stage point v in the line through a and b.
function c34Refl([x, y], [ax, ay], [bx, by]) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy, k = ((x - ax) * dx + (y - ay) * dy) / L;
  const fx0 = ax + k * dx, fy0 = ay + k * dy;
  return [2 * fx0 - x, 2 * fy0 - y];
}
// Question: pick a grid point on a c34Plane, as math.js pickPoint but with the book's «(x; y)» cursor tag.
// ans = [x, y]; no(x, y) explains a wrong pick; onRight runs on the right pick (and on Show answer).
const c34Pick = (P, ans, yes, no, onRight) => (body, api) => {
  const L = qlayer();
  let cur = [0, 0], locked = false, tag = null;
  const cursor = G(L, { x: P.PX(0), y: P.PY(0) });
  mk('circle', { r: 16, fill: 'none', stroke: COL.task, 'stroke-width': 3 }, cursor);
  const moveTo = (x, y) => {
    cur = [Math.max(P.x0, Math.min(P.x1, x)), Math.max(P.y0, Math.min(P.y1, y))];
    put(cursor, { x: P.PX(cur[0]), y: P.PY(cur[1]) });
    tag?.remove();
    tag = M(L, [`(${num(cur[0])}; ${num(cur[1])})`], { x: P.PX(cur[0]) + 22, y: P.PY(cur[1]) - 18, size: 24, fill: COL.task, anchor: 'start' });
  };
  const mark = (x, y, col, r = 11) => { const d = G(L, { x: P.PX(x), y: P.PY(y), s: 0, o: 0 }); mk('circle', { r, fill: col, stroke: COL.board, 'stroke-width': 2 }, d); fx(d, { s: 1, o: 1 }, 0, .4, back); return d; };
  moveTo(0, 0);
  const pick = () => {
    if (locked) return;
    const [x, y] = cur;
    if (x === ans[0] && y === ans[1]) { mark(x, y, COL.good); onRight?.(); api.grade(true, yes); }
    else { const d = mark(x, y, COL.bad, 9); fx(d, { o: 0 }, 1.2, .4); shakeFx(cursor); api.grade(false, no(x, y)); }
  };
  const hit = mk('rect', { x: P.PX(P.x0 - .5), y: P.PY(P.y1 + .5), width: (P.x1 - P.x0 + 1) * P.u, height: (P.y1 - P.y0 + 1) * P.u, fill: 'transparent' }, L);
  L.insertBefore(hit, L.firstChild);
  hit.style.cursor = 'crosshair';
  hit.addEventListener('click', e => {
    if (locked) return;
    const s = $('stage'), pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(s.getScreenCTM().inverse());
    moveTo(Math.round((q.x - P.cx) / P.u), Math.round((P.cy - q.y) / P.u));
    pick();
  });
  return {
    reveal() { moveTo(...ans); mark(ans[0], ans[1], COL.good); onRight?.(); return yes; },
    lock() { locked = true; },
    hint: [kbd('←'), kbd('↑'), kbd('↓'), kbd('→'), translate('hintMove'), kbd('Enter'), translate('hintChooseOrClickGrid')],
    key(e) {
      if (locked) return false;
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
      if (d) { moveTo(cur[0] + d[0], cur[1] + d[1]); return true; }
      if (e.key === 'Enter') { pick(); return true; }
      return false;
    },
  };
};
// A walk drawn in an answer effect (on the answer clock): along x, then along y, in the sign colours.
function c34WalkFx(q, P, x, y, d0 = 0) {
  const a = path(q, `M${P.cx} ${P.cy}H${P.PX(x)}`, { stroke: c34Col(x), 'stroke-width': 5 }, { d: 0 });
  const b = path(q, `M${P.PX(x)} ${P.cy}V${P.PY(y)}`, { stroke: c34Col(y), 'stroke-width': 5 }, { d: 0 });
  fx(a, { d: 1 }, d0, .5, lin); fx(b, { d: 1 }, d0 + .6, .5, lin);
}
// The house of q4: a square with a roof, centred on x = c. Corners from the roof's top, clockwise.
const c34House = c => [[c, 220], [c + 100, 330], [c + 100, 530], [c - 100, 530], [c - 100, 330]];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Координаты и симметрия', (m, D) => klIntro(m, D, {
    unit: 'Глава 7 · Геометрия · Тема 7.6',
    title: 'Координаты и симметрия',
    sub: 'Как задать точку двумя числами и как отразить точку или фигуру',
    art: (g, t0) => {
      const P = c34Plane(g, { cx: 800, cy: 690, u: 26, x0: -5, x1: 5, y0: -3, y1: 3, labels: false, t0 });
      c34Leg(g, P, [0, 0], [3, 0], t0 + .4, { step: .15, count: false, w: 4 });
      c34Leg(g, P, [3, 0], [3, 2], t0 + .9, { step: .15, count: false, w: 4 });
      c34Dot(g, P, 3, 2, t0 + 1.2, { r: 8 });
      c34Mirror(g, P, 'y', t0 + 1.4, .35);
      c34Dot(g, P, -3, 2, t0 + 1.9, { r: 8, fill: MIR });
    },
  })],

  ['plane', 'Координатная плоскость', m => {
    const p = panel(0);
    klTitle(p, 'Координатная плоскость');
    const P = c34Plane(p, PL), RX = 1040;
    put(P.grid, { o: 0 }); put(P.ay, { o: 0 }); put(P.O, { o: 0 });
    for (const y in P.ly) P.ly[y].setAttribute('fill', COL.chalk);
    const glow = G(p);
    draw(path(glow, `M${P.PX(.2)} ${P.cy}H${P.PX(7.4)}`, { stroke: POS, 'stroke-width': 12 }, { d: 0, o: .45 }), m('line'), .7, lin);
    draw(path(glow, `M${P.PX(-.2)} ${P.cy}H${P.PX(-7.4)}`, { stroke: NEG, 'stroke-width': 12 }, { d: 0, o: .45 }), m('line', 1.6), .7, lin);
    // The second line grows from zero up and down, then takes its labels.
    draw(path(p, `M${P.cx} ${P.cy}V${P.PY(5.6)}`, { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), m('up', .3), .8);
    draw(path(p, `M${P.cx} ${P.cy}V${P.PY(-5.5)}`, { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), m('up', .3), .8);
    show(P.ay, m('up', 1.2), .6);
    draw(path(glow, `M${P.cx} ${P.PY(.2)}V${P.PY(5.4)}`, { stroke: POS, 'stroke-width': 12 }, { d: 0, o: .45 }), m('pos'), .7, lin);
    for (let y = 1; y <= 5; y++) tw(P.ly[y], { c_fill: POS }, m('pos', .3 + y * .2), .3);
    draw(path(glow, `M${P.cx} ${P.PY(-.2)}V${P.PY(-5.4)}`, { stroke: NEG, 'stroke-width': 12 }, { d: 0, o: .45 }), m('neg'), .7, lin);
    for (let y = -1; y >= -5; y--) tw(P.ly[y], { c_fill: NEG }, m('neg', .3 - y * .2), .3);
    hide(glow, m('grid'), .6);
    show(P.grid, m('grid', .2), 1);
    pulse(P.nx, m('x', .2), 1.8);
    const hx = path(p, `M${P.PX(-7.4)} ${P.cy}H${P.PX(7.4)}`, { stroke: RULE, 'stroke-width': 6 }, { d: 0, o: .7 });
    draw(hx, m('x'), .8, lin); hide(hx, m('y'), .5);
    klRow(p, ['ось ', { m: 'x' }, ' — горизонтальная'], RX, 330, m('x', .3), { size: 34, anchor: 'start' });
    pulse(P.ny, m('y', .2), 1.8);
    const hy = path(p, `M${P.cx} ${P.PY(-5.4)}V${P.PY(5.4)}`, { stroke: RULE, 'stroke-width': 6 }, { d: 0, o: .7 });
    draw(hy, m('y'), .8, lin); hide(hy, m('origin'), .5);
    klRow(p, ['ось ', { m: 'y' }, ' — вертикальная'], RX, 405, m('y', .3), { size: 34, anchor: 'start' });
    c34Ring(p, P.cx, P.cy, 26, 26, m('origin'));
    show(P.O, m('origin', 5.4), .4);
    klRow(p, [{ m: 'O' }, ' — начало координат'], RX, 480, m('origin', 2.6), { size: 34, anchor: 'start' });
    klText(p, 'здесь x = 0 и y = 0', RX, 535, m('origin', 3.6), { size: 28, fill: COL.dim });
  }],

  ['point', 'Координаты точки', m => {
    const p = panel(0);
    klTitle(p, 'Координаты точки');
    const P = c34Plane(p, { ...PL, t0: .1 }), RX = 1040;
    c34Leg(p, P, [0, 0], [3, 0], m('x', 2.2), { step: .7 });
    c34Leg(p, P, [3, 0], [3, -2], m('y', 1.4), { step: .7 });
    const A = c34Dot(p, P, 3, -2, m('dot'));
    klMath(p, ['A'], P.PX(3) + 18, P.PY(-2) + 34, m('dot', .2), { size: 34, anchor: 'start' });
    pulse(A, m('dot', .4), 1.8);
    // A(3; −2) written large, each part placed by its width so it can be ringed.
    const S0 = 80, y0 = 330, w = s => mathW([s], S0), xa = RX + w('A('), xs = xa + w('3'), xb = xs + w('; ');
    klMath(p, ['A('], RX, y0, m('write'), { size: S0, anchor: 'start' });
    klMath(p, ['3'], xa, y0, m('write', 1.1), { size: S0, anchor: 'start', fill: POS });
    klMath(p, ['; '], xs, y0, m('write', 1.6), { size: S0, anchor: 'start' });
    klMath(p, ['−2'], xb, y0, m('write', 2.1), { size: S0, anchor: 'start', fill: NEG });
    klMath(p, [')'], xb + w('−2'), y0, m('write', 2.1), { size: S0, anchor: 'start' });
    c34Ring(p, xa + w('3') / 2, y0 - 26, 30, 50, m('first'), POS);
    klRow(p, [{ m: 'x = 3', fill: POS }, '  — по горизонтали'], RX, 425, m('first', .3), { size: 30, msize: 40, anchor: 'start' });
    c34Ring(p, xb + w('−2') / 2, y0 - 26, 52, 50, m('second'), NEG);
    klRow(p, [{ m: 'y = −2', fill: NEG }, '  — по вертикали'], RX, 485, m('second', .3), { size: 30, msize: 40, anchor: 'start' });
    c34Ring(p, xs + 12, y0 - 18, 18, 34, m('semi'));
    klText(p, 'между ними — точка с запятой', RX, 545, m('semi', .3), { size: 30, fill: RULE });
    // Reading the other way: from B to the axes.
    const B = c34Dot(p, P, -4, 1, m('read', 1));
    klMath(p, ['B'], P.PX(-4) - 16, P.PY(1) - 16, m('read', 1.2), { size: 34, anchor: 'end' });
    pulse(B, m('read', 1.4), 1.8);
    c34Drop(p, P, -4, 1, m('drop'), m('drop', .6));
    c34Ring(p, P.PX(-4), P.cy + 21, 26, 20, m('bx'), NEG);
    c34Ring(p, P.cx - 22, P.PY(1), 20, 20, m('by'), POS);
    klRow(p, c34Co('B', -4, 1), RX, 660, m('by', 2.4), { msize: 64, anchor: 'start' });
    pulse(B, m('by', 4.2), 1.8);
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    klTitle(p, 'Отметь точку');
    S.q1P = c34Plane(p, { ...QL, t0: .2 });
  }, { ask: done => quiz({ x: 820, y: 220, w: 700, cls: 'side' }, [{
    id: 'c-tochka', prompt: ['Отметь точку ', $m('C(−2; 3)'), '. Щёлкни по сетке или веди кружок стрелками и нажми Enter.'],
    build: c34Pick(S.q1P, [-2, 3], ['Два шага влево по оси x, потом три вверх: ', $m('C(−2; 3)'), ' во второй четверти.'],
      (x, y) => x === 3 && y === -2 ? 'Координаты поменялись местами. Первое число, −2, — сдвиг по горизонтали.'
        : x === 2 && y === 3 ? 'x = −2 — отрицательный: от O шагай влево, а не вправо.'

    show(path(p, `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`, { stroke: COL.bad, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, { o: 0 }), m('miss', 2.8), .4);
    // A square has four axes, a circle infinitely many.
    const sq = [[880, 320], [1120, 320], [1120, 560], [880, 560]];
    c34Poly(p, sq, { o: 0 }); show(p.lastChild, m('sq', -.4), .4);
    [[1000, 280, 1000, 600], [840, 440, 1160, 440], [850, 290, 1150, 590], [850, 590, 1150, 290]].forEach(([x1, y1, x2, y2], i) =>
      show(path(p, `M${x1} ${y1}L${x2} ${y2}`, ax, { o: 0 }), m('sq', .3 + i * .35), .3));
    klText(p, '4 оси', 1000, 250, m('sq', 1.2), { size: 32, fill: MIR, weight: 700, anchor: 'middle' });
    const C = G(p, { o: 0 });
    mk('circle', { cx: 1360, cy, r: 120, fill: COL.chalk, 'fill-opacity': .14, stroke: COL.chalk, 'stroke-width': 3 }, C);
    show(C, m('circ', -.4), .4);
    for (let k = 0; k < 8; k++) {
      const an = k * Math.PI / 8, dx = 150 * Math.cos(an), dy = 150 * Math.sin(an);
      show(path(p, `M${1360 - dx} ${cy - dy}L${1360 + dx} ${cy + dy}`, { ...ax, 'stroke-width': 2.5 }, { o: 0 }), m('circ', .3 + k * .25), .25);
    }
    klText(p, 'бесконечно много', 1360, 250, m('circ', 1.2), { size: 30, fill: MIR, weight: 700, anchor: 'middle' });
  }],

  ['q4', 'Проверь себя', () => {
    const p = panel(0);
    klTitle(p, 'Где ось симметрии?');
    const ax = { stroke: MIR, 'stroke-width': 3.5, 'stroke-dasharray': '10 8' };
    S.q4h = [400, 800, 1200].map((c, i) => {
      const g = G(p, { o: 0 });
      c34Poly(g, c34House(c));
      path(g, [`M${c - 150} 430H${c + 150}`, `M${c - 130} 560L${c + 130} 300`, `M${c} 185V575`][i], ax);
      klText(g, String(i + 1), c, 630, undefined, { size: 34, fill: COL.dim, weight: 700, anchor: 'middle' });
      show(g, .3 + i * .15);
      return g;
    });
    S.q4p = p;
  }, { ask: done => quiz(BAND, [{
    id: 'c-os', prompt: 'На каком рисунке пунктир — ось симметрии домика? Нажми на этот рисунок.',
    build: pickEls(S.q4h.map((g, i) => ({ el: g, box: [400 * (i + 1) - 160, 175, 320, 480], label: 'рисунок ' + (i + 1) })), 2,
      'Перегни домик по вертикальной прямой через крышу — половинки совпадут.',
      i => i === 0 ? 'Перегни по этой прямой: крыша ляжет на низ домика, они не совпадут.' : 'По диагонали половинки не совпадают: углы торчат.',
      () => {
        const q = qlayer(), c = 1200, Rh = [[c, 220], [c + 100, 330], [c + 100, 530], [c, 530]], Rm = Rh.map(([x, y]) => [2 * c - x, y]);
        const half = c34Poly(q, Rh, { fill: MIR, op: .35, stroke: MIR });
        c34Morph(half, Rh, Rm, 0, 1, fxp);
      }),
  }], done) }],

  ['wrap', 'Главное', m => klWrap(m, [
    ['Сначала x, потом y:  ', ...c34Co('A', 3, -2)],
    ['Знаки координат — это четверть:  ', { m: '(−; +)' }, ' — II'],
    'Ось x — другой знак y, ось y — знак x, O — оба',
    'Ось симметрии: при сгибе половины совпадают',
  ])],

  ['final1', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-chetvert', prompt: 'В какой четверти лежит точка?',
    build: grid([
      { parts: [$m('(−2; −7)')], ans: ['3'], why: 'Обе координаты отрицательные — третья четверть.' },
      { parts: [$m('(5; 1)')], ans: ['1'], why: 'Обе координаты положительные — первая четверть.' },
      { parts: [$m('(−3; 4)')], ans: ['2'], why: 'x отрицательный, y положительный — вторая четверть.' },
      { parts: [$m('(6; −8)')], ans: ['4'], why: 'x положительный, y отрицательный — четвёртая четверть.' },
    ], [['1', 'I', null, '1'], ['2', 'II', null, '2'], ['3', 'III', null, '3'], ['4', 'IV', null, '4']], { multi: false, text: true }),
  }], done, 'Практика по теме · часть 1 из 3') }],

  ['final2', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-os-y', prompt: ['Точку ', $m('(−4; 5)'), ' отразили относительно оси y. Найди координаты отражения.'],
    build: blanks([{ parts: ['(', { box: '4' }, '; ', { box: '5' }, ')'], why: 'Относительно оси y меняется знак x: (−4; 5) → (4; 5).', hint: 'Зеркало — ось y: y остаётся прежним, у x другой знак.' }]),
  }, {
    id: 'p-centr', prompt: ['Точка ', $m('(3; −5)'), ' симметрична точке A относительно начала координат. Найди координаты A.'],
    build: blanks([{ parts: ['A(', { box: '-3' }, '; ', { box: '5' }, ')'], why: 'Относительно точки O меняются оба знака: A(−3; 5).', hint: 'При симметрии относительно начала координат меняются знаки обеих координат.' }]),
  }], done, 'Практика по теме · часть 2 из 3') }],

  ['final3', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pryam', prompt: 'Сколько осей симметрии у прямоугольника, который не квадрат?',
    build: choice(['1', '2', '4', 'бесконечно много'], 1, 'Две оси: через середины противоположных сторон. Диагонали — не оси.',
      ['Есть ещё одна: и вертикальная, и горизонтальная прямая через середины сторон.', null, 'Четыре оси у квадрата. У прямоугольника диагонали — не оси симметрии.', 'Бесконечно много осей у круга.']),
  }, {
    id: 'p-zapis', prompt: 'Как записать точку, у которой x = −1, а y = 4?',
    build: choice([$m('(−1; 4)'), $m('(4; −1)'), $m('(−4; 1)')], 0, 'Сначала пишут x, потом y: (−1; 4).',
      [null, 'Здесь координаты поменялись местами: первым пишут x.', 'Числа не те: x = −1, y = 4.']),
  }], done, 'Практика по теме · часть 3 из 3') }],

  ['finish', 'Конец темы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
