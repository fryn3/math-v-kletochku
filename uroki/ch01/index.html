<script>
'use strict';
// Тема 1.1 «Позиционная запись» (5 класс). Beat ids match papermorph/content/uroki/ch01/narration.ru.json.
const CHAPTER = { number: 1, label: '1.1', title: 'Позиционная запись', minutes: 8, language: 'ru', next: '../ch02/' };

// Colours in this lesson: the digit we follow — KL.NUM; the classes — единицы KL.DEN, тысячи KL.TWO,
// миллионы KL.WHOLE; place values, rules and estimates — KL.RULE.
const DIG = KL.NUM, RULE = KL.RULE, C_UN = KL.DEN, C_TH = KL.TWO, C_MI = KL.WHOLE;
const NBSP = ' ';
// A number written with its classes apart: 3405 → «3 405» (no-break space).
const c01Fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);

// Centres of the digits of a written number: `pitch` apart, plus `gap` between classes (threes from the right).
// anchor: 'middle' centres the number on x, 'end' puts the last digit's centre on x, 'start' the first digit's.
function c01Pos(s, x, pitch, gap = 0, anchor = 'middle') {
  s = String(s);
  const L = s.length, cls = i => Math.floor((L - 1 - i) / 3);
  const off = Array.from({ length: L }, (_, i) => i * pitch + (cls(0) - cls(i)) * gap), w = off[L - 1];
  const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
  return off.map(o => x0 + o);
}
// One digit as a group whose origin is the digit's visual centre (x, y): it slides, scales and pulses in place.
// g._t is the text, for colour tweens (c_fill).
function c01Dig(p, ch, x, y, { size = 120, fill = COL.chalk, t0 } = {}) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  g._t = T(g, String(ch), { x: 0, y: size * .35, size, fill, font: MATH, anchor: 'middle' });
  if (t0 !== undefined) show(g, t0);
  return g;
}
// A written number as separate digit groups (c01Pos places them); fills(i, ch) may colour each digit.
function c01Num(p, s, x, y, { size = 120, pitch = size * .6, gap = size * .25, anchor = 'middle', fill = COL.chalk, fills, t0, step = 0 } = {}) {
  s = String(s);
  const xs = c01Pos(s, x, pitch, gap, anchor);
  const digs = s.split('').map((ch, i) => c01Dig(p, ch, xs[i], y, { size, fill: fills ? fills(i, ch) : fill, t0: t0 === undefined ? undefined : t0 + i * step }));
  digs.xs = xs;
  return digs;
}
// Numbers and signs in the maths face (digits, ·, +, =, ≈), fading in at t0.
function c01M(p, str, x, y, t0, { size = 64, fill = COL.chalk, anchor = 'middle', weight = 400 } = {}) {
  const e = T(p, str, { x, y, size, fill, font: MATH, anchor, weight, o: t0 === undefined ? 1 : 0 });
  if (t0 !== undefined) show(e, t0);
  return e;
}
// A place-value table: heads[k] names column k counted from the right (k = 0: единицы), each cw wide, the right edge
// at xr, cells from y to y + h. Returns { g, X(k) (column centre), cy (cells' middle) }.
function c01Table(p, { xr, y, cw = 200, h = 160, heads, t0, size = 30 }) {
  const n = heads.length, g = G(p, { o: 0 }), X = k => xr - (k + .5) * cw;
  mk('rect', { x: xr - n * cw, y, width: n * cw, height: h, fill: COL.chalk, 'fill-opacity': .05 }, g);
  for (let k = 1; k < n; k++) path(g, `M${xr - k * cw} ${y}V${y + h}`, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .45 });
  mk('rect', { x: xr - n * cw, y, width: n * cw, height: h, fill: 'none', stroke: COL.chalk, 'stroke-width': 3.5, rx: 2 }, g);
  const hs = heads.map((s, k) => T(g, s, { x: X(k), y: y - 20, size, fill: COL.dim, anchor: 'middle', weight: 600 }));
  show(g, t0);
  return { g, X, cy: y + h / 2, heads: hs };
}
// Class boxes for writing a number by classes: sizes = slots per class from the left (e.g. [1, 3, 3]), slot w wide,
// `sep` between boxes, centred on x; cells from y to y + h; names and colours under each box.
// Returns { g, slots: [x centres, left to right], cy, frames }.
function c01Classes(p, { x = 800, y, h = 120, w = 90, sep = 50, sizes, names, cols, t0 }) {
  const total = sizes.reduce((a, b) => a + b, 0) * w + (sizes.length - 1) * sep, g = G(p, { o: 0 }), slots = [];
  let cx = x - total / 2;
  sizes.forEach((n, k) => {
    mk('rect', { x: cx, y, width: n * w, height: h, fill: COL.chalk, 'fill-opacity': .05 }, g);
    for (let i = 1; i < n; i++) path(g, `M${cx + i * w} ${y + 14}V${y + h - 14}`, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .35, 'stroke-dasharray': '6 6' });
    mk('rect', { x: cx, y, width: n * w, height: h, fill: 'none', stroke: cols[k], 'stroke-width': 3.5, rx: 4 }, g);
    T(g, names[k], { x: cx + n * w / 2, y: y + h + 46, size: 30, fill: cols[k], anchor: 'middle', weight: 600 });
    for (let i = 0; i < n; i++) slots.push(cx + (i + .5) * w);
    cx += n * w + sep;
  });
  if (t0 !== undefined) show(g, t0);
  return { g, slots, cy: y + h / 2 };
}
// A digit dropping into its place from above: a hidden digit at (x, y − 70) falls to (x, y) at t.
function c01Drop(p, ch, x, y, t, { size = 80, fill = COL.chalk } = {}) {
  const d = c01Dig(p, ch, x, y - 70, { size, fill });
  put(d, { o: 0 });
  tw(d, { o: 1, y }, t, .45, out);
  return d;
}
// A hop of a group from x a to x b (arc of height hgt above its y).
function c01Hop(e, a, b, y, t, dur = .7, hgt = 34) {
  prog(q => put(e, { x: a + (b - a) * q, y: y - Math.sin(Math.PI * q) * hgt }), t, dur, io);
}
// A number line from value a at x0 to value b at x1 at height y: small ticks every `step`, tall ones at `big` values,
// labels under `labels`. Returns { g, X(v), y }.
function c01Line(p, { x0, x1, y, a, b, step, big = [], labels = [], t0, size = 32 }) {
  const g = G(p, { o: 0 }), X = v => x0 + (v - a) * (x1 - x0) / (b - a);
  path(g, `M${x0 - 30} ${y}H${x1 + 50}`, { stroke: COL.chalk, 'stroke-width': 3.5 });
  path(g, `M${x1 + 36} ${y - 11}L${x1 + 52} ${y}L${x1 + 36} ${y + 11}`, { stroke: COL.chalk, 'stroke-width': 3.5, fill: 'none', 'stroke-linejoin': 'round' });
  for (let v = a; v <= b + 1e-9; v += step) {
    const tall = big.includes(v) || v === a || v === b;
    path(g, `M${X(v)} ${y - (tall ? 18 : 9)}V${y + (tall ? 18 : 9)}`, { stroke: tall ? COL.chalk : KL.DEN, 'stroke-width': tall ? 3.5 : 2.5 });
  }
  const labs = labels.map(v => T(g, c01Fmt(v), { x: X(v), y: y + 54, size, fill: COL.chalk, font: MATH, anchor: 'middle' }));
  if (t0 !== undefined) show(g, t0);
  return { g, X, y, labs };
}
// A dot on a line at value v (hidden until t), with its label above.
function c01Dot(p, L, v, t, { fill = DIG, label, r = 13 } = {}) {
  const g = G(p, { x: L.X(v), y: L.y, o: 0 });
  mk('circle', { r, fill, stroke: COL.board, 'stroke-width': 3 }, g);
  if (label) T(g, label, { x: 0, y: -32, size: 32, fill, font: MATH, anchor: 'middle' });
  tw(g, { o: 1 }, t, .3);
  return g;
}
// A rounded ring drawn round a box (x, y, w, h).
function c01Ring(p, x, y, w, h, t, col = RULE) {
  const e = path(p, `M${x + 14} ${y}H${x + w - 14}Q${x + w} ${y} ${x + w} ${y + 14}V${y + h - 14}Q${x + w} ${y + h} ${x + w - 14} ${y + h}H${x + 14}Q${x} ${y + h} ${x} ${y + h - 14}V${y + 14}Q${x} ${y} ${x + 14} ${y}Z`,
    { stroke: col, 'stroke-width': 4, fill: 'none' }, { d: 0 });
  draw(e, t, .45);
  return e;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Позиционная запись', (m, D) => klIntro(m, D, {
    unit: 'Глава 1 · Числа и действия · Тема 1.1',
    title: 'Позиционная запись',
    sub: 'Почему одна и та же цифра значит то три, то три тысячи',
    art: (g, t0) => {
      const heads = ['тыс.', 'сот.', 'дес.', 'ед.'];
      '3405'.split('').forEach((ch, i) => {
        const x = 620 + i * 90, c = G(g, { o: 0 });
        mk('rect', { x, y: 572, width: 90, height: 90, fill: COL.chalk, 'fill-opacity': .05, stroke: COL.chalk, 'stroke-width': 2.5 }, c);
        T(c, heads[i], { x: x + 45, y: 558, size: 20, fill: COL.dim, anchor: 'middle', weight: 600 });
        T(c, ch, { x: x + 45, y: 639, size: 60, font: MATH, fill: ch === '0' ? COL.dim : i === 0 ? DIG : COL.chalk, anchor: 'middle' });
        show(c, t0 + i * .12);
      });
    },
  })],

  ['place', 'Цифра и её место', m => {
    const p = panel(0);
    klTitle(p, 'Значение цифры зависит от её места');
    const tb = c01Table(p, { xr: 1200, y: 250, cw: 200, h: 170, heads: ['единицы', 'десятки', 'сотни', 'тысячи'], t0: .2 });
    const three = c01Dig(p, '3', tb.X(0), tb.cy, { size: 130, fill: DIG, t0: .3 });
    // What the digit is worth now: the readout under the table changes with every move.
    const lab = klText(p, 'цифра значит', 760, 712, m('units'), { size: 34, fill: COL.dim, anchor: 'end' });
    const vals = ['3', '30', '300', '3' + NBSP + '000'].map(v => c01M(p, v, 800, 720, undefined, { size: 100, fill: DIG, anchor: 'start' }));
    vals.forEach(v => put(v, { o: 0 }));
    const at = [m('units'), m('s1', 1.6), m('s2', .6), m('s3', .7)];
    vals.forEach((v, k) => { show(v, at[k], .3); if (k < 3) hide(v, at[k + 1] - .25, .25); });
    tw(vals[1], { s: 1.12 }, m('s1', 3.6), .25, out); tw(vals[1], { s: 1 }, m('s1', 3.85), .35);   // «в десять раз больше»
    tw(three, { s: 1.12 }, m('units'), .2, out); tw(three, { s: 1 }, m('units', .2), .3);
    // Each move is one place to the left: an arrow under the table and «· 10» under it.
    const arcs = G(p);
    [m('s1'), m('s2'), m('s3')].forEach((t, k) => {
      c01Hop(three, tb.X(k), tb.X(k + 1), tb.cy, t, .75, 40);
      klArrow(arcs, tb.X(k) - 10, 450, tb.X(k + 1) + 10, 450, 505, RULE, t + .1, .6);
      c01M(arcs, '· 10', (tb.X(k) + tb.X(k + 1)) / 2, 552, t + .5, { size: 36, fill: RULE });
    });
    klText(p, 'каждый разряд в 10 раз больше соседнего справа', 800, 840, m('rule'), { size: 34, fill: RULE, weight: 600, anchor: 'middle' });
    // «значение цифры зависит от её места»: the place names light up from the right, then the digit.
    tb.heads.forEach((e, k) => { tw(e, { c_fill: RULE }, m('rule', 4.6 + k * .3), .3); tw(e, { c_fill: COL.dim }, m('rule', 7.2), .5); });
    tw(three, { s: 1.15 }, m('rule', 6.4), .25, out); tw(three, { s: 1 }, m('rule', 6.65), .35);
    // Without the table the empty places are held by zeros, and the digits close up into «3 000».
    [tb.g, arcs, lab, vals[3]].forEach(e => hide(e, m('zero', .2), .6));
    const zeros = [0, 1, 2].map(k => c01Drop(p, '0', tb.X(k), tb.cy, m('zero', 1.4 + (2 - k) * .25), { size: 130 }));
    const xs = c01Pos('3000', 800, 80, 34);
    [three, zeros[2], zeros[1], zeros[0]].forEach((d, i) => tw(d, { x: xs[i], y: 470 }, m('zero', 3.4), .8, io));
  }],

  ['expand', 'Разложение по разрядам', m => {
    const p = panel(0);
    klTitle(p, 'Число — сумма разрядов');
    const top = c01Num(p, '3405', 800, 290, { size: 150, pitch: 90, gap: 40, t0: .2 });
    // The line below: digit · place value, terms joined by «+»; each digit flies down from the number.
    const SZ = 64, Y = 600, terms = [['3', ' · 1000', 'тысячи'], ['4', ' · 100', 'сотни'], ['0', ' · 10', 'десятков нет'], ['5', '', 'единицы']];
    const wP = textW('  +  ', SZ), wd = terms.map(t => textW(t[0], SZ)), wr = terms.map(t => textW(t[1], SZ));
    let x = 800 - (wd.reduce((a, b) => a + b) + wr.reduce((a, b) => a + b) + 3 * wP) / 2;
    ['t', 'h', 'z', 'u'].forEach((mark, k) => {
      const t = m(mark), dim = k === 2, col = dim ? COL.dim : DIG;
      if (k) { c01M(p, '+', x + wP / 2, Y, t, { size: SZ }); x += wP; }
      tw(top[k]._t, { c_fill: col }, t, .3);
      const fly = c01Dig(p, terms[k][0], top.xs[k], 290, { size: 150, fill: col });
      put(fly, { o: 0 });
      tw(fly, { o: 1 }, t, .15);
      tw(fly, { x: x + wd[k] / 2, y: Y - SZ * .35, s: SZ / 150 }, t, .8, io);
      if (k !== 2) { const tp = m('sum', [2.6, 0, 0, 5.2][k] || 3.9); tw(fly, { s: SZ / 150 * 1.35 }, tp, .22, out); tw(fly, { s: SZ / 150 }, tp + .22, .35); }
      if (terms[k][1]) c01M(p, terms[k][1], x + wd[k], Y, t + .6, { size: SZ, fill: dim ? COL.dim : COL.chalk, anchor: 'start' });
      klText(p, terms[k][2], x + (wd[k] + wr[k]) / 2, Y + 66, t + .6, { size: 28, fill: dim ? COL.dim : RULE, anchor: 'middle', weight: 600 });
      x += wd[k] + wr[k];
    });
    c01M(p, '3' + NBSP + '405 = 3' + NBSP + '000 + 400 + 5', 800, 800, m('sum'), { size: 64 });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    const digs = c01Num(p, '52384', 800, 330, { size: 160, pitch: 96, gap: 44, t0: .2 });
    const lab = G(p, { o: 0 });
    T(lab, 'сотни', { x: digs.xs[2], y: 200, size: 32, fill: RULE, anchor: 'middle', weight: 600 });
    T(lab, '3 сотни = 300', { x: digs.xs[2], y: 520, size: 40, fill: RULE, anchor: 'middle', weight: 600 });
    S.q1 = { digs, lab };
  }, { ask: done => {
    const { digs, lab } = S.q1, names = ['десятков тысяч', 'тысяч', 'сотен', 'десятков', 'единиц'];
    quiz(BAND, [{
      id: 'c-sotni', prompt: 'В числе 52' + NBSP + '384 нажми на цифру, которая стоит в разряде сотен.',
      build: pickEls(digs.map((e, i) => ({ el: e, box: [digs.xs[i] - 50, 240, 100, 180], label: '52384'[i] })), 2,
        'Справа налево: единицы (4), десятки (8), сотни (3). Тройка здесь значит три сотни — 300.',
        i => `Эта цифра стоит в разряде ${names[i]}. Считай разряды справа налево: единицы, десятки, сотни.`,
        () => { fx(digs[2]._t, { c_fill: DIG }, 0, .3); fx(digs[2], { s: 1.15 }, 0, .2, out); fx(digs[2], { s: 1 }, .2, .3); fx(lab, { o: 1 }, .2, .4); }),
    }], done);
  } }],

  ['times', 'Умножение на 10, 100, 1000', m => {
    const p = panel(0);
    klTitle(p, 'Умножить на 100 — сдвинуть на два разряда');
    c01M(p, '37', 790 - textW(' · 100', 72), 250, .2, { size: 72, anchor: 'end' });
    c01M(p, ' · 100', 790, 250, m('n', 1.3), { size: 72, anchor: 'end' });
    const tb = c01Table(p, { xr: 1100, y: 330, cw: 150, h: 150, heads: ['ед.', 'дес.', 'сот.', 'тыс.'], t0: .2, size: 28 });
    const d3 = c01Dig(p, '3', tb.X(1), tb.cy, { size: 110, fill: DIG, t0: .3 }), d7 = c01Dig(p, '7', tb.X(0), tb.cy, { size: 110, fill: DIG, t0: .3 });
    // 100 = 10 · 10: two moves of one place each, on «два раза по десять».
    const h1 = m('mul', 1.3), h2 = m('mul', 2.4);
    [[d3, 1], [d7, 0]].forEach(([d, k]) => { c01Hop(d, tb.X(k), tb.X(k + 1), tb.cy, h1, .7, 36); c01Hop(d, tb.X(k + 1), tb.X(k + 2), tb.cy, h2, .7, 36); });
    c01M(p, '· 10', 690, 570, h1 + .3, { size: 40, fill: RULE, anchor: 'end' });
    c01M(p, '· 10', 710, 570, h2 + .3, { size: 40, fill: RULE, anchor: 'start' });
    c01M(p, '= · 100', 830, 570, h2 + 1, { size: 40, fill: RULE, anchor: 'start' });
    [0, 1].forEach(k => c01Drop(p, '0', tb.X(k), tb.cy, m('zeros', .2 + k * .3), { size: 110 }));
    c01M(p, '= 3' + NBSP + '700', 810, 250, m('res'), { size: 72, anchor: 'start' });
    klText(p, 'умножить на 100 — дописать справа два нуля', 800, 700, m('res', 1.6), { size: 34, fill: RULE, weight: 600, anchor: 'middle' });
  }],

  ['classes', 'Классы', m => {
    const p = panel(0);
    klTitle(p, 'Длинное число читают по классам');
    // 7305020 without spaces: three class groups (each with its digits, brace and name) that slide apart later.
    const xs = c01Pos('7305020', 800, 78, 0), Y = 330;
    const parts = [[0, 1, C_MI, 'миллионы', 'mil'], [1, 4, C_TH, 'тысячи', 'th'], [4, 7, C_UN, 'единицы', 'u']];
    const groups = parts.map(([a, b, col, name, mark]) => {
      const g = G(p, { x: 0 });
      const digs = '7305020'.slice(a, b).split('').map((ch, i) => c01Dig(g, ch, xs[a + i], Y, { size: 120, t0: .2 }));
      digs.forEach(d => tw(d._t, { c_fill: col }, m(mark), .4));
      // The one-digit class of millions is narrower than its name: the name ends at the brace's right end.
      const one = b - a === 1;
      klBrace(g, xs[a] - 34, xs[b - 1] + 34, 420, one ? '' : name, m(mark), { up: false, fill: col, size: 34 });
      if (one) klText(g, name, xs[a] + 34, 452, m(mark, .3), { size: 34, fill: col, weight: 600, anchor: 'end' });
      const heads = ['сот.', 'дес.', 'ед.'].slice(3 - (b - a));
      heads.forEach((s, i) => klText(g, s, xs[a + i], 238, m('three', .3 + i * .15), { size: 22, fill: COL.dim, anchor: 'middle', weight: 600 }));
      return g;
    });
    const qm = klText(p, '?', 1110, 360, 2.4, { size: 80, fill: COL.dim, weight: 600 });
    hide(qm, m('group'), .3);
    [[3, 4], [0, 1]].forEach(([i, j], k) => {
      const cut = path(p, `M${(xs[i] + xs[j]) / 2} 255V405`, { stroke: RULE, 'stroke-width': 3, 'stroke-dasharray': '8 7' }, { d: 0 });
      draw(cut, m('group', 1.8 + k * .7), .4);
      hide(cut, m('apart'), .3);
    });
    // «пробел»: the gaps once they open.
    [(xs[0] - 60 + xs[1]) / 2, (xs[3] + xs[4] + 60) / 2].forEach(gx => klText(p, 'пробел', gx, 520, m('apart', 1.3), { size: 22, fill: RULE, weight: 600, anchor: 'middle' }));
    tw(groups[0], { x: -60 }, m('apart'), .7, io);
    tw(groups[2], { x: 60 }, m('apart'), .7, io);
    // Read class by class: «7 миллионов 305 тысяч 20».
    const rows = [[[{ m: '7', fill: C_MI }, ' миллионов'], 'r1'], [[{ m: '305', fill: C_TH }, ' тысяч'], 'r2'], [[{ m: '20', fill: C_UN }], 'r3']]
      .map(([pc, mark]) => klRow(p, pc, 0, 640, m(mark), { size: 44, msize: 60, anchor: 'start' }));
    const W = rows.reduce((s, r) => s + r._w, 0) + 2 * 40;
    let rx = 800 - W / 2;
    rows.forEach(r => { put(r, { x: rx }); rx += r._w + 40; });
    // Next comes the class of billions, still empty.
    const bil = G(p, { o: 0 });
    mk('rect', { x: 110, y: 262, width: 150, height: 136, rx: 8, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '10 9' }, bil);
    T(bil, 'миллиарды', { x: 185, y: 452, size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
    show(bil, m('bil', .3));
  }],

  ['trap', 'Пустой разряд — ноль', m => {
