<script>
'use strict';
// Тема 8.3 «Логические задачи» (5–6 класс). Beat ids match papermorph/content/uroki/ch37/narration.ru.json.
const CHAPTER = { number: 37, label: '8.3', title: 'Логические задачи', minutes: 7, language: 'ru', next: '../ch38/' };

// Meanings in this lesson: the first group KL.DEN, the second KL.TWO, what both share and the rule KL.RULE,
// «да» in the table a green tick, «нет» a dim cross (not red: red is a mistake in this book).
const ONE = KL.DEN, TWO = KL.TWO, RULE = KL.RULE, NO = COL.dim, YES = COL.good, LIAR = KL.NUM;

/* ---------- the logic table ---------- */
// Rows: the children; columns: the ice creams. Cells CW × RH from (TXC, TYR); the names column starts at TX0.
const KIDS = ['Аня', 'Боря', 'Вика'];
const ICES = [['шоколадное', '#8b5a3c'], ['ванильное', '#f1e3b0'], ['клубничное', '#ef8fae']];
const TX0 = 130, TXC = 310, CW = 160, TY0 = 190, TYR = 310, RH = 110;
const cellX = j => TXC + CW * (j + .5), cellY = i => TYR + RH * (i + .5);

// An ice-cream cone centred on (x, y): a waffle cone and a scoop of colour col.
function c37Cone(p, x, y, col) {
  const g = G(p, { x, y });
  path(g, 'M-17 -2L0 34L17 -2Z', { fill: '#c9975b', stroke: '#8a6236', 'stroke-width': 2 });
  path(g, 'M-9 4L5 4M-6 12L6 12', { stroke: '#8a6236', 'stroke-width': 1.5 });
  mk('circle', { cx: 0, cy: -12, r: 21, fill: col, stroke: COL.board, 'stroke-width': 2 }, g);
  return g;
}
// The table: names (shown at t0), the cones and their names (one after another from tCols), the grid lines (drawn on
// at tGrid). Leave a time undefined to show that part at once. Returns the cones (groups centred on each cone).
function c37Table(p, { t0, tCols, tGrid } = {}) {
  KIDS.forEach((k, i) => klText(p, k, TX0 + (TXC - TX0) / 2, cellY(i) + 12, t0 === undefined ? undefined : t0 + i * .1, { size: 34, anchor: 'middle', weight: 600 }));
  const cones = ICES.map(([name, col], j) => {
    const g = G(p, { o: tCols === undefined ? 1 : 0 });
    const cone = c37Cone(g, cellX(j), 228, col);
    T(g, name, { x: cellX(j), y: 292, size: 23, fill: COL.dim, anchor: 'middle' });
    if (tCols !== undefined) show(g, tCols + j * 1.1, .4);
    return cone;
  });
  let d = `M${TXC} ${TY0}H${TXC + 3 * CW}`;
  for (let i = 0; i <= 3; i++) d += `M${TX0} ${TYR + i * RH}H${TXC + 3 * CW}`;
  d += `M${TX0} ${TYR}V${TYR + 3 * RH}`;
  for (let j = 0; j <= 3; j++) d += `M${TXC + j * CW} ${TY0}V${TYR + 3 * RH}`;
  const grid = path(p, d, { stroke: COL.chalk, 'stroke-width': 2.5, 'stroke-opacity': .8 }, tGrid === undefined ? {} : { d: 0 });
  if (tGrid !== undefined) draw(grid, tGrid, 1.1);
  return cones;
}
// «Да»: a green tick in cell (i, j), drawn on at t0 (undefined: at once; hidden: o 0, for an answer effect).
function c37Yes(p, i, j, t0, hidden) {
  const g = G(p, { x: cellX(j), y: cellY(i), o: hidden ? 0 : 1 });
  const e = path(g, 'M-26 2L-8 20L28 -22', { stroke: YES, 'stroke-width': 9 }, t0 === undefined ? {} : { d: 0 });
  if (t0 !== undefined) draw(e, t0, .4);
  return g;
}
// «Нет»: a dim cross in cell (i, j), the same way.
function c37No(p, i, j, t0, hidden) {
  const g = G(p, { x: cellX(j), y: cellY(i), o: hidden ? 0 : 1 });
  const e = path(g, 'M-17 -17L17 17M17 -17L-17 17', { stroke: NO, 'stroke-width': 6 }, t0 === undefined ? {} : { d: 0 });
  if (t0 !== undefined) draw(e, t0, .35);
  return g;
}
// An outline round row i (names included) or column j (cone included), shown at t0 and hidden at t1.
function c37Band(p, kind, k, t0, t1) {
  const r = kind === 'row' ? { x: TX0 + 5, y: TYR + k * RH + 5, width: TXC + 3 * CW - TX0 - 10, height: RH - 10 }
    : { x: TXC + k * CW + 5, y: TY0 + 5, width: CW - 10, height: TYR + 3 * RH - TY0 - 10 };
  const e = mk('rect', { ...r, rx: 12, fill: RULE, 'fill-opacity': .08, stroke: RULE, 'stroke-width': 4 }, p);
  put(e, { o: 0 }); show(e, t0, .35);
  if (t1 !== undefined) hide(e, t1, .4);
  return e;
}
// A line of words in their own colours: pieces [[str, fill?, weight?]], each in a group of its own (to move it).
// Returns { g, parts: [{ e, x, w }], w }.
function c37Words(p, pieces, x, y, t0, size = 36) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  let cx = 0;
  const parts = pieces.map(([s, fill = COL.chalk, weight = 600]) => {
    const e = G(g, { x: cx });
    T(e, s, { size, fill, weight });
    const w = klW(s, size, weight), part = { e, x: cx, w };
    cx += w;
    return part;
  });
  if (t0 !== undefined) show(g, t0);
  return { g, parts, w: cx };
}

/* ---------- Euler circles: a class of 20, sport 14, music 11 ---------- */
const ES = [560, 560, 220], EM = [860, 560, 200];
// The two circles cross at x = 724, y = 560 ∓ 146.6; the lens between them is where the children in both groups stand.
const LENS = 'M724 413.4A220 220 0 0 1 724 706.6A200 200 0 0 1 724 413.4Z';
const SPOT_S = [450, 505, 560].flatMap(x => [505, 560, 615].map(y => [x, y]));    // 9: sport only
const SPOT_L = [470, 515, 560, 605, 650].map(y => [724, y]);                        // 5: both
const SPOT_M = [905, 960].flatMap(x => [505, 560, 615].map(y => [x, y]));          // 6: music only
const SPOTS = [...SPOT_S, ...SPOT_L, ...SPOT_M];                                     // 20 = 9 + 5 + 6

// A circle (cx, cy, r) as an outline drawn on at t0 over a faint fill of its colour (undefined: at once).
function c37Ring(p, [cx, cy, r], col, t0) {
  const fill = mk('circle', { cx, cy, r, fill: col, 'fill-opacity': .09 }, p);
  put(fill, { o: t0 === undefined ? 1 : 0 });
  const e = path(p, `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`, { stroke: col, 'stroke-width': 4 }, t0 === undefined ? {} : { d: 0 });
  if (t0 !== undefined) { draw(e, t0, .8); show(fill, t0 + .3, .6); }
  return e;
}
// A child: a chalk dot in a group at (x, y), so it can move and take coloured rings.
function c37Kid(p, x, y, o = 1) {
  const g = G(p, { x, y, o });
  mk('circle', { r: 13, fill: COL.chalk }, g);
  return g;
}
// The class frame with its label: the set of all children.
function c37Class(p, t0) {
  const g = G(p, { o: t0 === undefined ? 1 : 0 });
  mk('rect', { x: 290, y: 200, width: 800, height: 630, rx: 22, fill: 'none', stroke: COL.dim, 'stroke-width': 2.5, 'stroke-dasharray': '12 10' }, g);
  const label = G(g, { x: 290, y: 182 });
  T(label, 'класс: 20 учеников', { size: 30, fill: COL.dim, weight: 600 });
  if (t0 !== undefined) show(g, t0);
  return label;
}

/* ---------- people on the island ---------- */
// A paper figure standing at (x, y) (its feet): body and head in chalk. tint(col) adds a coloured copy (o 0) to fade in.
function c37Person(p, x, y, o = 1) {
  const g = G(p, { x, y, o });
  const draw1 = (q, col, op) => {
    path(q, 'M-58 0C-58 -78 -40 -100 0 -100C40 -100 58 -78 58 0Z', { fill: col, 'fill-opacity': op, stroke: col, 'stroke-width': 3 });
    mk('circle', { cx: 0, cy: -146, r: 36, fill: col, 'fill-opacity': op, stroke: col, 'stroke-width': 3 }, q);
  };
  draw1(g, COL.chalk, .12);
  g.tint = col => { const q = G(g, { o: 0 }); draw1(q, col, .5); return q; };
  return g;
}
// A speech bubble centred on (cx, cy), w × h, its tail pointing at (tx, ty); pops in at t0.
function c37Bubble(p, cx, cy, w, h, tx, ty, text, t0, size = 40) {
  const g = G(p, { x: cx, y: cy, s: .6, o: 0 });
  const r = 22, a = Math.max(-w / 2 + r + 4, Math.min(w / 2 - r - 34, tx - cx - 14));
  const d = `M${-w / 2 + r} ${-h / 2}H${w / 2 - r}Q${w / 2} ${-h / 2} ${w / 2} ${-h / 2 + r}V${h / 2 - r}Q${w / 2} ${h / 2} ${w / 2 - r} ${h / 2}`
    + `H${a + 30}L${tx - cx} ${ty - cy}L${a} ${h / 2}H${-w / 2 + r}Q${-w / 2} ${h / 2} ${-w / 2} ${h / 2 - r}V${-h / 2 + r}Q${-w / 2} ${-h / 2} ${-w / 2 + r} ${-h / 2}Z`;
  path(g, d, { fill: COL.board, stroke: COL.chalk, 'stroke-width': 3 });
  T(g, text, { x: 0, y: size * .35, size, weight: 600, anchor: 'middle' });
  pop(g, t0);
  return g;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Логические задачи', (m, D) => klIntro(m, D, {
    unit: 'Глава 8 · Текстовые задачи · Тема 8.3',
    title: 'Логические задачи',
    sub: 'Почти без счёта: рассуждаем с таблицей и кругами',
    art: (g, t0) => {
      const x0 = 590, y0 = 540, c = 46;
      let d = '';
      for (let k = 0; k <= 3; k++) d += `M${x0} ${y0 + k * c}H${x0 + 3 * c}M${x0 + k * c} ${y0}V${y0 + 3 * c}`;
      const grid = path(g, d, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .7 }, { o: 0 });
      show(grid, t0);
      [[0, 1], [1, 2], [2, 0]].forEach(([i, j], k) => {
        const e = path(g, `M${x0 + j * c + 12} ${y0 + i * c + 24}l8 9l15 -18`, { stroke: YES, 'stroke-width': 5 }, { d: 0 });
        draw(e, t0 + .4 + k * .25, .3);
      });
      [[0, 0], [1, 1], [2, 2]].forEach(([i, j], k) => {
        const e = path(g, `M${x0 + j * c + 15} ${y0 + i * c + 15}l16 16m0 -16l-16 16`, { stroke: NO, 'stroke-width': 4 }, { d: 0 });
        draw(e, t0 + .5 + k * .25, .3);
      });
      [[930, ONE], [1010, TWO]].forEach(([x, col], k) => {
        const e = mk('circle', { cx: x, cy: 609, r: 62, fill: col, 'fill-opacity': .12, stroke: col, 'stroke-width': 3.5 }, g);
        put(e, { o: 0 }); show(e, t0 + .3 + k * .3);
      });
    },
  })],

  ['table', 'Таблица', m => {
    const p = panel(0);
    klTitle(p, 'Таблица: кто какое мороженое купил');
    const cones = c37Table(p, { t0: .3, tCols: m('cols'), tGrid: m('grid') });
    klText(p, 'строки — ребята, столбцы — мороженое', 880, 262, m('grid', 1.4), { size: 28, fill: COL.dim });
    // «Все купили разное»: the three different cones hop one after another.
    cones.forEach((c, j) => pulse(c, m('one', .2 + j * .35), 1.3));
    c37Band(p, 'row', 0, m('row'), m('ex', 1.8));
    c37Band(p, 'col', 0, m('column'), m('ex', 1.8));
    klText(p, 'в каждой строке', 880, 352, m('row'), { size: 32, fill: RULE, weight: 600 });
    klText(p, 'и в каждом столбце', 880, 396, m('column'), { size: 32, fill: RULE, weight: 600 });
    klText(p, 'ровно одна галочка', 880, 440, m('ex'), { size: 32, fill: RULE, weight: 600 });
    klText(p, 'Аня — не шоколадное', 880, 560, m('f1'), { size: 32 });
    c37No(p, 0, 0, m('f1', 2.0));
    const w = klW('Боря — не шоколадное, ', 32);
    klText(p, 'Боря — не шоколадное, ', 880, 620, m('f2'), { size: 32 });
    c37No(p, 1, 0, m('f2', .9));
    klText(p, 'не ванильное', 880 + w, 620, m('f3'), { size: 32 });
    c37No(p, 1, 1, m('f3', .7));
  }],

  ['last', 'Последняя клетка', m => {
    const p = panel(0);
    klTitle(p, 'Последняя свободная клетка');
    c37Table(p);
    const out = [[1, 0], [1, 1]].map(([i, j]) => c37No(p, i, j));
    c37No(p, 0, 0);
    klText(p, 'Аня — не шоколадное', 880, 262, undefined, { size: 26, fill: COL.dim });
    klText(p, 'Боря — не шоколадное, не ванильное', 880, 300, undefined, { size: 26, fill: COL.dim });
    c37Band(p, 'row', 1, m('last'), m('tick', .8));
    const free = G(p, { x: cellX(2), y: cellY(1), o: 0 });
    mk('rect', { x: -66, y: -42, width: 132, height: 84, rx: 10, fill: RULE, 'fill-opacity': .3 }, free);
    show(free, m('free'), .3);
    pulse(free, m('free', .6), 1.15);
    hide(free, m('tick', .3), .3);
    klText(p, 'одна свободная клетка —', 880, 400, m('free'), { size: 32, fill: RULE, weight: 600 });
    klText(p, 'в ней галочка', 880, 444, m('tick'), { size: 32, fill: RULE, weight: 600 });
    c37Yes(p, 1, 2, m('tick', .3));
    c37Band(p, 'col', 2, m('col'), m('rule'));
    klText(p, 'клубничное было одно:', 880, 540, m('col', .3), { size: 30 });
    klText(p, 'у Ани и Вики — нет', 880, 582, m('cross'), { size: 30 });
    out.push(c37No(p, 0, 2, m('cross', .2)), c37No(p, 2, 2, m('cross', .8)));
    // The rule: the tick's row and column light up together.
    c37Band(p, 'row', 1, m('rule', .3));
    c37Band(p, 'col', 2, m('rule', .3));
    klText(p, 'галочка вычёркивает', 880, 690, m('rule'), { size: 32, fill: RULE, weight: 600 });
    klText(p, 'свою строку и свой столбец', 880, 734, m('rule', .8), { size: 32, fill: RULE, weight: 600 });
    // Every cross in the tick's row and column nods in turn: these are the cells it crossed out.
    out.forEach((g, k) => pulse(g, m('rule', 2.6 + k * .4), 1.35));
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    klTitle(p, 'Кто какое мороженое купил');
    c37Table(p);
    const crosses = [[0, 0], [1, 0], [1, 1], [0, 2], [2, 2]].map(([i, j]) => c37No(p, i, j));
    c37Yes(p, 1, 2);
    const ask = (i, j) => { const g = G(p, { x: cellX(j), y: cellY(i) }); T(g, '?', { y: 16, size: 46, fill: COL.dim, anchor: 'middle', weight: 600 }); return g; };
    const hidden = (f, i, j) => { const g = f(p, i, j, undefined, true); put(g, { s: .5 }); return g; };
    S.q1 = {
      qA: ask(0, 1), qV0: ask(2, 0), qV1: ask(2, 1), noV2: crosses[4],
      yesA: hidden(c37Yes, 0, 1), noV1: hidden(c37No, 2, 1), yesV0: hidden(c37Yes, 2, 0),
    };
  }, { ask: done => quiz({ x: 820, y: 220, w: 700, cls: 'side' }, [{
    id: 'c-vika', prompt: 'Какое мороженое купила Вика? Выбери клетку в её строке.',
    build: pickEls([S.q1.qV0, S.q1.qV1, S.q1.noV2].map((el, j) => ({ el, box: [cellX(j) - 74, cellY(2) - 50, 148, 100], label: ICES[j][0] })), 0,
      'У Ани зачёркнуты шоколадное и клубничное — у неё ванильное. Тогда Вике остаётся шоколадное.',
      j => [null, 'Ванильное у Ани: в её строке это последняя свободная клетка.', 'Клубничное уже у Бори, а в столбце только одна галочка.'][j],
      () => {
        const q = S.q1;
        fx(q.qA, { o: 0 }, 0, .25); fx(q.yesA, { o: 1, s: 1 }, .1, .4, back);
        fx(q.qV1, { o: 0 }, .5, .25); fx(q.noV1, { o: 1, s: 1 }, .6, .4, back);
        fx(q.qV0, { o: 0 }, 1, .25); fx(q.yesV0, { o: 1, s: 1 }, 1.1, .4, back);
      }),
  }], done) }],

  ['euler', 'Круги Эйлера', m => {
    const p = panel(0);
    klTitle(p, 'Спорт и музыка');
    const total = c37Class(p, .3);
    const L = G(p);   // the circles go under the children
    const kids = SPOTS.map((_, k) => c37Kid(p, 329 + k * 38, 250, 0));
    kids.forEach((g, k) => show(g, m('kids', k * .04), .3));
    const rS = c37Ring(L, ES, ONE, m('sport'));
    klText(p, 'спорт: 14', 420, 320, m('sport', .4), { size: 32, fill: ONE, weight: 700, anchor: 'middle' });
    for (let k = 0; k < 14; k++) tw(kids[k], { x: SPOTS[k][0], y: SPOTS[k][1] }, m('sport', .8 + k * .08), .7, io);
    const rM = c37Ring(L, EM, TWO, m('music'));
    klText(p, 'музыка: 11', 980, 320, m('music', .4), { size: 32, fill: TWO, weight: 700, anchor: 'middle' });
    for (let k = 14; k < 20; k++) tw(kids[k], { x: SPOTS[k][0], y: SPOTS[k][1] }, m('music', .8 + (k - 14) * .1), .7, io);
    // Everyone is in at least one circle: both outlines flash, then each child nods.
    [rS, rM].forEach((r, k) => { tw(r, { 'a_stroke-width': 9 }, m('all', k * .3), .25); tw(r, { 'a_stroke-width': 4 }, m('all', .6 + k * .3), .4); });
    kids.forEach((g, k) => pulse(g, m('all', 1.4 + k * .06), 1.35));
    klText(p, 'круги Эйлера', 690, 872, m('eu'), { size: 30, fill: COL.dim, weight: 600, anchor: 'middle' });
    const row = klRow(p, ['учеников: ', { m: '14 + 11' }], 1125, 470, m('sum'), { size: 30, msize: 46, anchor: 'start' });
    klMath(p, [' = 25'], 1125 + row._w, 470, m('sum', 2.6), { size: 46, anchor: 'start' });
    klStrike(p, 1115, 484, 1125 + row._w + mathW([' = 25'], 46) + 12, 446, m('wrong', .3));
    klText(p, 'ошибка: учеников всего 20', 1125, 545, m('wrong', .6), { size: 28, fill: COL.bad, weight: 700 });
    pulse(total, m('wrong', 1.5), 1.2);
    // «Где же ошибка?»: the children in the middle blink: the answer is there.
    kids.slice(9, 14).forEach((g, k) => pulse(g, m('wrong', 3.1 + k * .12), 1.45));
  }],

  ['both', 'Кого посчитали дважды', m => {
    const p = panel(0);
    klTitle(p, 'Кого посчитали дважды');
    c37Class(p);
    const L = G(p);
    const lens = path(L, LENS, { fill: RULE, 'fill-opacity': .22 }, { o: 0 });
    const rS = c37Ring(L, ES, ONE), rM = c37Ring(L, EM, TWO);
    klText(p, 'спорт: 14', 420, 320, undefined, { size: 32, fill: ONE, weight: 700, anchor: 'middle' });
    klText(p, 'музыка: 11', 980, 320, undefined, { size: 32, fill: TWO, weight: 700, anchor: 'middle' });
    const kids = SPOTS.map(([x, y]) => c37Kid(p, x, y));
    const mid = kids.slice(9, 14);
    show(lens, .4, .6);
    mid.forEach((g, k) => pulse(g, m('twice', 1 + k * .12), 1.4));
    klText(p, 'и там, и там', 724, 322, m('tt'), { size: 30, fill: RULE, weight: 700, anchor: 'middle' });
    klArrow(p, 724, 338, 724, 398, 368, RULE, m('tt', .3), .4);
    mid.forEach((g, k) => { const c = mk('circle', { r: 13, fill: RULE }, g); put(c, { o: 0 }); show(c, m('tt', .5 + k * .08), .3); });
    // Counted twice: a blue ring with the sport count, a green ring with the music count.
    const ring = (g, r, col, t) => { const c = mk('circle', { r, fill: 'none', stroke: col, 'stroke-width': 3.5 }, g); put(c, { o: 0 }); show(c, t, .25); };
    mid.forEach((g, k) => ring(g, 17.5, ONE, m('c1', .1 + k * .07)));
    mid.forEach((g, k) => ring(g, 22, TWO, m('c2', .1 + k * .07)));
    tw(rS, { 'a_stroke-width': 9 }, m('c1'), .2); tw(rS, { 'a_stroke-width': 4 }, m('c1', .7), .4);
    tw(rM, { 'a_stroke-width': 9 }, m('c2'), .2); tw(rM, { 'a_stroke-width': 4 }, m('c2', .7), .4);
    klRow(p, ['в обоих: ', { m: '25 − 20 = 5' }], 1125, 440, m('extra'), { size: 30, msize: 46, anchor: 'start', fill: RULE, weight: 700 });
