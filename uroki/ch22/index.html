'use strict';
// Тема 5.1 «Отношение и пропорция» (6 класс). Beat ids match papermorph/content/uroki/ch22/narration.ru.json.
const CHAPTER = { number: 22, label: '5.1', title: 'Отношение и пропорция', minutes: 8, language: 'ru', next: '../ch23/' };

// Meanings: the first term of a ratio (a in a : b, the numerator) in NUM, the second term (b, the denominator) in DEN,
// the unknown x (a closed box) in UNK, the cross products and the rules in RULE.
const NUM = KL.NUM, DEN = KL.DEN, UNK = KL.TWO, RULE = KL.RULE, NUT = '#c99a63';
const NB = ' ';

// A strip of equal cells, cell i filled in cols[i]; dark lines between cells (so they show on any fill), chalk frame.
// Returns { g, cells, x, y, w, h, cw, n, frame }; the coordinates are the stage's, so moving g moves the whole strip.
function c22Strip(p, { x, y, w, h = 90, cols, t0, op = .85 }) {
  const g = G(p, { o: t0 === undefined ? 1 : 0 }), n = cols.length, cw = w / n;
  const cells = cols.map((c, i) => mk('rect', { x: x + i * cw, y, width: cw, height: h, fill: c, 'fill-opacity': op }, g));
  for (let i = 1; i < n; i++) path(g, `M${x + i * cw} ${y}V${y + h}`, { stroke: COL.board, 'stroke-width': 3 });
  const frame = mk('rect', { x, y, width: w, height: h, rx: 4, fill: 'none', stroke: COL.chalk, 'stroke-width': 3.5 }, g);
  if (t0 !== undefined) show(g, t0);
  return { g, cells, x, y, w, h, cw, n, frame };
}
// Cut every cell of a c22Strip into k equal pieces (dark lines under the frame), one cell after another from t0.
function c22Split(s, k, t0) {
  for (let i = 0; i < s.n; i++) for (let j = 1; j < k; j++) {
    const e = path(s.g, `M${s.x + (i + j / k) * s.cw} ${s.y}V${s.y + s.h}`, { stroke: COL.board, 'stroke-width': 3 }, { d: 0 });
    s.g.insertBefore(e, s.frame);
    draw(e, t0 + i * .1, .35);
  }
}
// Thick chalk dividers across a strip after every `per` cells, drawn on from t0 (t0 undefined: built hidden for fx).
function c22Divs(p, s, per, t0) {
  const out = [];
  for (let k = per; k < s.n; k += per) {
    const e = path(p, `M${s.x + k * s.cw} ${s.y - 10}V${s.y + s.h + 10}`, { stroke: COL.chalk, 'stroke-width': 7, 'stroke-linecap': 'round' }, t0 === undefined ? { o: 0 } : { d: 0 });
    if (t0 !== undefined) draw(e, t0 + out.length * .15, .4);
    out.push(e);
  }
  return out;
}
// A closed box of width w centred on (x, y) with «x» on it (as c07Box). open(v, t0) lifts the lid and shows the
// number inside; fxOpen(v, delay) does the same on the question clock.
function c22Box(p, x, y, w = 64) {
  const g = G(p, { x, y });
  mk('rect', { x: -w / 2, y: -w / 2, width: w, height: w, rx: 6, fill: mix(COL.board, UNK, .16), stroke: UNK, 'stroke-width': 3.5 }, g);
  const lid = G(g, { x: -w / 2 - 5, y: -w / 2 });
  path(lid, `M0 0H${w + 10}`, { stroke: UNK, 'stroke-width': 7, 'stroke-linecap': 'round' });
  const lab = M(g, ['x'], { y: w * .2, size: w * .66, fill: UNK });
  const num = v => M(g, [String(v)], { y: w * .22, size: w * (String(v).length > 1 ? .52 : .66), fill: UNK, o: 0 });
  g.open = (v, t0) => { tw(lid, { r: -38, y: -w / 2 - 6 }, t0, .5, back); hide(lab, t0, .3); show(num(v), t0 + .3, .3); };
  g.fxOpen = (v, d = 0) => { fx(lid, { r: -38, y: -w / 2 - 6 }, d, .5); fx(lab, { o: 0 }, d, .3); fx(num(v), { o: 1 }, d + .3, .3); };
  return g;
}
// A fraction centred on its bar at (x, y) where one term may be the box (null): { g, box }.
function c22BoxFrac(p, top, bot, x, y, t0, size = 100) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  const bw = size * .72, tw_ = v => v === null ? bw : textW(String(v), size);
  const w = Math.max(tw_(top), tw_(bot)) + size * .36;
  path(g, `M${-w / 2} 0H${w / 2}`, { stroke: COL.chalk, 'stroke-width': size * .06, 'stroke-linecap': 'round' });
  const part = (v, cy, fill) => v === null ? c22Box(g, 0, cy, bw) : T(g, String(v), { x: 0, y: cy + size * .35, size, fill, font: MATH, anchor: 'middle' });
  const a = part(top, -size * .6, NUM), b = part(bot, size * .6, DEN);
  if (t0 !== undefined) show(g, t0);
  return { g, box: top === null ? a : bot === null ? b : null, w };
}
// A row of math tokens: an item { t, fill, from: [x, baseline], s0, at } flies in from a number already on the board
// (scaled from s0), the others fade in at their own `at` or `fade` s after t0 (as c07Fly).
function c22Fly(p, items, x, y, t0, { size = 64, anchor = 'middle', fade = .8 } = {}) {
  const row = tokens(p, items, { x, y, size, anchor, o: 0 });
  row.forEach((e, k) => {
    const it = items[k], at = (typeof it === 'object' && it.at !== undefined) ? it.at : undefined;
    if (it.from) {
      put(e, { x: it.from[0], y: it.from[1], s: it.s0 ?? 1 });
      show(e, at ?? t0, .15);
      tw(e, { x: e._px, y, s: 1 }, at ?? t0, .9, io);
    } else show(e, at ?? t0 + fade, .3);
  });
  return row;
}
// One worked line aligned on its «=» at xEq: L (ending left of it) and R (starting right of it) are c22Fly items.
function c22Line(p, L, R, y, xEq, tL, tEq, tR, size = 64) {
  const gap = size * .45;
  const l = c22Fly(p, L, xEq - gap, y, tL, { size, anchor: 'end', fade: 0 });
  const eq = c22Fly(p, ['='], xEq, y, tEq, { size, fade: 0 });
  const r = c22Fly(p, R, xEq + gap, y, tR, { size, anchor: 'start', fade: 0 });
  return { l, eq, r };
}
// A straight arrow from (x1, y1) to (x2, y2), drawn on at t0 (klArrow with its bend on the line).
function c22Diag(p, x1, y1, x2, y2, col, t0, dur = .6) { return klArrow(p, x1, y1, x2, y2, (y1 + y2) / 2, col, t0, dur); }
// A nut: a small round piece centred on its group's origin.
function c22Nut(p, x, y) {
  const g = G(p, { x, y });
  mk('circle', { r: 12, fill: NUT, stroke: COL.board, 'stroke-width': 2 }, g);
  return g;
}

    ], 800, 640, { size: 80, anchor: 'middle' });

    klText(p, 'члены отношения можно делить или умножать на одно и то же число', 800, 800, m('rule'), { size: 32, fill: RULE, weight: 600, anchor: 'middle' });

    const b = c22Strip(p, { x: 300, y: 340, w: 20 * 40, h: 70, cols: Array(20).fill(DEN), t0: .3 });

  }, { ask: done => quiz(BAND, [{

    hide(klText(p, '30 орехов', 303, 340, .4, { size: 30, fill: COL.dim, anchor: 'middle' }), m('deal', 2), .4);
    const s = c22Strip(p, { x: 250, y: 400, w: 1100, h: 150, cols: [NUM, NUM, DEN, DEN, DEN], op: .3, t0: .3 });
    klBrace(p, 250, 690, 576, 'Аня', m('parts'), { up: false, fill: NUM, size: 34 });
    klBrace(p, 690, 1350, 576, 'Боря', m('parts', 1.4), { up: false, fill: DEN, size: 34 });
    klRow(p, [{ m: '2 + 3 = 5' }, ' частей'], 1050, 250, m('sum'), { size: 34, msize: 52 });
    klRow(p, ['одна часть:  ', { m: '30 : 5 = 6', fill: RULE }], 1050, 330, m('one'), { size: 34, msize: 52 });

    const a = P[0].c, c = P[2].c, top = 400 - 24, bot = 400 + 108;
    c22Diag(p, a + 34, 345, c - 34, 455, RULE, m('c1'));
    c22Line(p, [{ t: '2', fill: NUM, from: [a, top], s0: 1.5, at: m('c1') }, ' · ', { t: '6', fill: DEN, from: [c, bot], s0: 1.5, at: m('c1') }],
      [{ t: '12', fill: RULE }], 350, 1120, m('c1', .8), m('c1', 1.1), m('c1', 1.8), 80);
    c22Diag(p, a + 34, 455, c - 34, 345, RULE, m('c2'));
    c22Line(p, [{ t: '3', fill: DEN, from: [a, bot], s0: 1.5, at: m('c2') }, ' · ', { t: '4', fill: NUM, from: [c, top], s0: 1.5, at: m('c2') }],
      [{ t: '12', fill: RULE }], 490, 1120, m('c2', .8), m('c2', 1.1), m('c2', 2), 80);
    klMark(p, 1360, 410, m('eq'), true);
    klText(p, 'произведения равны — пропорция верна', 1120, 590, m('eq', .4), { size: 30, fill: RULE, weight: 600, anchor: 'middle' });
    const Q = klExpr(p, [{ f: [2, 3] }, { s: '?', fill: COL.dim }, { f: [3, 5] }], 400, 760, { size: 80, anchor: 'middle', t0: m('no') });
    const ne = klExpr(p, [{ s: '≠', fill: COL.bad }], Q[1].c, 760, { size: 80, anchor: 'middle' });
    put(ne[0].g, { o: 0 });
    hide(Q[1].g, m('nums', 3.4), .3); show(ne[0].g, m('nums', 3.5), .3);
    klRow(p, [{ m: '2 · 5 = 10' }, ',    ', { m: '3 · 3 = 9' }], 1060, 790, m('nums'), { size: 34, msize: 52 });
    klRow(p, [{ m: '10 ≠ 9', fill: COL.bad }], 1400, 790, m('nums', 3.2), { size: 34, msize: 52 });
  }],

  ['why', 'Откуда крест-накрест', m => {
    const p = panel(0);
    klTitle(p, 'Почему произведения равны');
    const T1 = klEq(p, [{ f: [2, 3] }], [{ f: [4, 6] }], 250, .3, { xEq: 800, size: 72 });
    const L = klEq(p, [{ f: [2, 3] }, { s: '·' }, { s: '3', fill: DEN }, { s: '·' }, { s: '6', fill: DEN }],
      [{ f: [4, 6] }, { s: '·' }, { s: '3', fill: DEN }, { s: '·' }, { s: '6', fill: DEN }], 450, m('mult'), { xEq: 800, size: 72 });
    const sd = (cx, t) => klStrike(p, cx - 22, 450 + 64, cx + 22, 450 + 14, t, .3);   // a denominator
    const sm = (cx, t) => klStrike(p, cx - 20, 450 + 22, cx + 20, 450 - 26, t, .3);   // a factor
    sd(L.l[0].c, m('cancel')); sm(L.l[2].c, m('cancel', .4));
    sd(L.r[0].c, m('cancel', 1.4)); sm(L.r[4].c, m('cancel', 1.8));
    klEq(p, [{ s: '2', fill: NUM }, { s: '·' }, { s: '6', fill: DEN }], [{ s: '4', fill: NUM }, { s: '·' }, { s: '3', fill: DEN }], 630, m('left'), { xEq: 800, size: 72 });
    // «Это и есть крест-накрест»: the diagonals of the first line.
    const a = T1.l[0].c, c = T1.r[0].c;
    c22Diag(p, a + 24, 214, c - 24, 288, RULE, m('cr'));
    c22Diag(p, a + 24, 288, c - 24, 214, RULE, m('cr', .4));
    const g = G(p, { o: 0 });
    mk('rect', { x: 400, y: 720, width: 800, height: 140, rx: 18, fill: COL.chalk, 'fill-opacity': .04, stroke: RULE, 'stroke-width': 3 }, g);
    klRow(g, [{ m: [F('a', 'b'), ' = ', F('c', 'd')] }], 600, 808, m('rule', .3), { size: 36, msize: 60, fill: RULE });
    klRow(g, ['→      ', { m: 'a · d = b · c' }], 920, 808, m('rd'), { size: 36, msize: 60, fill: RULE });
    show(g, m('rule'));
  }],

  ['q3', 'Проверь себя', () => {
    const p = panel(0);
    klText(p, 'Подсказка:', 120, 250, .2, { size: 30, fill: COL.dim });
    klExpr(p, [{ f: ['a', 'b'] }, { s: '=' }, { f: ['c', 'd'] }], 380, 390, { size: 100, anchor: 'middle', t0: .2 });
    c22Diag(p, 300, 340, 460, 440, RULE, .4); c22Diag(p, 300, 440, 460, 340, RULE, .6);
    S.q3rule = klMath(p, ['a · d = b · c'], 380, 600, .7, { size: 56, fill: RULE });
  }, { ask: done => quiz({ x: 720, y: 170, w: 800, cls: 'side' }, [{
    id: 'c-proverka', prompt: 'Проверь крест-накрест: верна ли пропорция?',
    build: grid([
      { parts: [F('3', '4'), ' = ', F('9', '12')], ans: ['yes'], why: '3 · 12 = 36 и 4 · 9 = 36: произведения равны.', fx: () => pulseFx(S.q3rule) },
      { parts: [F('2', '5'), ' = ', F('4', '9')], ans: ['no'], why: '2 · 9 = 18, а 5 · 4 = 20: 18 ≠ 20.' },
      { parts: [F('6', '8'), ' = ', F('9', '12')], ans: ['yes'], why: '6 · 12 = 72 и 8 · 9 = 72: обе дроби равны 3/4.', fx: () => pulseFx(S.q3rule) },
    ], [['yes', 'верна', null, '1'], ['no', 'неверна', null, '2']], { multi: false }),
  }], done) }],

  ['unknown', 'Неизвестный член', m => {
    const p = panel(0);
    klTitle(p, 'Неизвестный член пропорции');
    const X = c22BoxFrac(p, null, 5, 300, 420, .3, 110);
    klExpr(p, [{ s: '=' }], 420, 420, { size: 110, anchor: 'middle', t0: .3 });
    const Y = klFrac(p, 12, 20, 560, 420, .3, { size: 110 });
    pulse(X.g, m('eq', .2), 1.2); pulse(Y.g, m('eq', 1.6), 1.2);
    const top = 420 - 22, bot = 420 + 99;
    c22Diag(p, 340, 366, 510, 474, RULE, m('cross'));
    c22Diag(p, 340, 474, 510, 366, RULE, m('cross', .6));
    c22Line(p, [{ t: '20', fill: DEN, from: [560, bot], s0: 110 / 64, at: m('p1') }, ' · ', { t: 'x', fill: UNK, from: [300, 386], s0: 1.4, at: m('p1') }],
      [{ t: '5', fill: DEN, from: [300, bot], s0: 110 / 64, at: m('p2') }, { t: ' · ', at: m('p2', .5) }, { t: '12', fill: NUM, from: [560, top], s0: 110 / 64, at: m('p2') },
        { t: ' = ', at: m('p2', 2.2) }, { t: '60', fill: RULE, at: m('p2', 2.5) }], 300, 1000, m('p1', .6), m('p2', -.1), m('p2'), 64);
    c22Line(p, [{ t: 'x', fill: UNK }], ['60', ' : ', { t: '20', fill: DEN }], 440, 1000, m('div'), m('div'), m('div', .4), 64);
    c22Line(p, [{ t: 'x', fill: UNK }], [{ t: '3', fill: UNK }], 580, 1000, m('open'), m('open'), m('open', .2), 64);
    X.box.open(3, m('open'));
    klRow(p, ['проверка:   ', { m: [F('12', '20'), ' = ', F('3', '5')] }], 800, 790, m('check'), { size: 32, msize: 56 });
    klMark(p, 1080, 770, m('check', 3), true, .8);
  }],

  ['q4', 'Проверь себя', () => {
    const p = panel(0);
    const X = c22BoxFrac(p, 4, null, 660, 330, .2, 110);
    klExpr(p, [{ s: '=' }], 800, 330, { size: 110, anchor: 'middle', t0: .2 });
    klFrac(p, 6, 9, 940, 330, .2, { size: 110 });

    build: blanks([
      { parts: ['6 · x = 4 · 9 = ', { box: '36' }], why: 'По диагоналям: 6 · x и 4 · 9 = 36.', hint: 'Перемножь числа на диагонали без x: 4 и 9.' },
      { parts: ['x = ', { box: '6' }], why: 'x = 36 : 6 = 6. Проверка: 4/6 = 6/9, обе дроби равны 2/3.', hint: 'Неизвестный множитель: раздели 36 на 6.',

  }], done) }],

  ['trap', 'Две ловушки', m => {
    const p = panel(0);
    klTitle(p, 'Две частые ошибки');
    // Left: the units must be the same.
    klRow(p, [{ m: '50', fill: NUM }, ' см  :  ', { m: '2', fill: DEN }, ' м'], 420, 300, m('units'), { size: 40, msize: 60 });
    const w1 = klRow(p, [{ m: '50 : 2 = 25' }], 420, 420, m('wrong1'), { size: 40, msize: 60, fill: COL.dim });
    klStrike(p, 420 - w1._w / 2 - 14, 428, 420 + w1._w / 2 + 14, 382, m('wrong1', 1.2));
    klText(p, 'разные единицы!', 420, 480, m('wrong1', 1.4), { size: 28, fill: COL.bad, weight: 700, anchor: 'middle' });
    klRow(p, [{ m: '2' }, ' м  =  ', { m: '200' }, ' см'], 420, 590, m('right1', 1), { size: 36, msize: 54, fill: COL.dim });

    klMark(p, 720, 680, m('res1', 1.6), true, .8);

    const w2 = klRow(p, [{ m: 'x · 12 = 5 · 20' }], 1155, 540, m('wrong2', 1.2), { size: 40, msize: 56, fill: COL.dim });
    klStrike(p, 1155 - w2._w / 2 - 14, 548, 1155 + w2._w / 2 + 14, 504, m('wrong2', 2.6));
    c22Diag(p, 1076, 290, 1230, 380, RULE, m('right2'));
    c22Diag(p, 1076, 380, 1230, 290, RULE, m('right2', .3));
    klRow(p, [{ m: '20 · x = 5 · 12', fill: RULE }], 1155, 680, m('right2', .6), { size: 40, msize: 56 });
    klMark(p, 1440, 662, m('right2', 1.2), true, .8);
  }],

  ['scale', 'Масштаб', m => {
    const p = panel(0);
    klTitle(p, 'Масштаб — тоже отношение');
    const CM = 120, HX = 230, SX = HX + 3 * CM, RY = 470;
    // The map: a card with faint streets, a house and a school.
    const map = G(p, { o: 0 });
    mk('rect', { x: 120, y: 220, width: 640, height: 380, rx: 16, fill: COL.chalk, 'fill-opacity': .05, stroke: COL.dim, 'stroke-width': 2.5 }, map);
    ['M120 330H760', 'M400 220V600', 'M120 560H760', 'M690 220V600'].forEach(d => path(map, d, { stroke: COL.faint, 'stroke-width': 10, fill: 'none' }));
    path(map, `M${HX - 26} ${RY}V${RY - 34}L${HX} ${RY - 58}L${HX + 26} ${RY - 34}V${RY}Z`, { fill: NUM, 'fill-opacity': .8, stroke: COL.chalk, 'stroke-width': 2.5 });
    path(map, `M${SX - 40} ${RY}V${RY - 50}H${SX + 40}V${RY}Z M${SX} ${RY - 50}V${RY - 84}L${SX + 22} ${RY - 76}L${SX} ${RY - 68}`, { fill: DEN, 'fill-opacity': .8, stroke: COL.chalk, 'stroke-width': 2.5 });
    T(map, 'дом', { x: HX, y: RY + 40, size: 24, fill: COL.dim, anchor: 'middle' });
    T(map, 'школа', { x: SX, y: RY + 40, size: 24, fill: COL.dim, anchor: 'middle' });

    klRow(p, ['масштаб  ', { m: '1', fill: NUM }, { m: ' : ' }, { m: `50${NB}000`, fill: DEN }], 760, 200, m('scale'), { size: 28, msize: 40, anchor: 'end' });
    // The ruler under the map: one centimetre first, then three under the road.
    const cell = (i, t) => {
      const g = G(p, { o: 0 });
      mk('rect', { x: HX + i * CM, y: 630, width: CM, height: 54, fill: NUM, 'fill-opacity': .3, stroke: COL.chalk, 'stroke-width': 2.5 }, g);
      T(g, '1 см', { x: HX + (i + .5) * CM, y: 667, size: 26, anchor: 'middle' });
      show(g, t, .3);
    };
    cell(0, m('cm'));
    const o = { size: 32, msize: 46, anchor: 'start' }, LX = 860;
    const r1 = klRow(p, [{ m: '1', fill: NUM }, ' см  →  '], LX, 350, m('cm', .4), o);
    const r2 = klRow(p, [{ m: `50${NB}000`, fill: DEN }, ' см'], LX + r1._w, 350, m('ground'), o);
    klRow(p, ['  =  ', { m: '500', fill: DEN }, ' м'], LX + r1._w + r2._w, 350, m('m500'), o);
    draw(path(p, `M${HX} ${RY + 12}H${SX}`, { stroke: RULE, 'stroke-width': 7, 'stroke-linecap': 'round' }, { d: 0 }), m('road'), 1);
    cell(1, m('road', .8)); cell(2, m('road', 1.2));
    [0, 1, 2].forEach(i => klText(p, '500 м', HX + (i + .5) * CM, 730, i ? m('mult', i * .3) : m('m500', .3), { size: 26, fill: DEN, weight: 600, anchor: 'middle' }));
    klRow(p, [{ m: '3', fill: NUM }, ' см  →  ', { m: `3 · 50${NB}000 = 150${NB}000`, fill: DEN }, ' см'], LX, 470, m('mult', .3), o);
    klRow(p, [{ m: `150${NB}000` }, ' см  =  ', { m: `1${NB}500` }, ' м  =  ', { m: '1,5', fill: RULE }, ' км'], LX, 590, m('km'), o);
    klBrace(p, HX, SX, 760, '1,5 км', m('km', 1.2), { up: false, fill: RULE, size: 34 });
  }],

  ['wrap', 'Главное', m => klWrap(m, [
    ['Отношение — это частное:  ', { m: ['a : b = ', F('a', 'b')] }],
    'Члены отношения делят или умножают на одно число',
    ['Пропорция ', { m: [F('a', 'b'), ' = ', F('c', 'd')] }, '  верна, если  ', { m: 'a · d = b · c' }],
    ['Делим в отношении ', { m: 'm : n' }, ':  всего ', { m: 'm + n' }, ' равных частей'],
  ])],

  ['final1', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-x1', prompt: ['Найди x: ', $m('x : 6 = 10 : 15')],
    build: blanks([{ parts: ['x = ', { box: '4' }], why: '15 · x = 6 · 10 = 60, x = 60 : 15 = 4.', hint: 'Запиши дробями и перемножь крест-накрест: 15 · x = 6 · 10.' }]),
  }, {
    id: 'p-x2', prompt: ['Найди x: ', $m(F('3', 'x'), ' = ', F('9', '12'))],
    build: blanks([{ parts: ['x = ', { box: '4' }], why: '9 · x = 3 · 12 = 36, x = 36 : 9 = 4.', hint: 'Крест-накрест: 9 · x = 3 · 12.' }]),
  }], done, 'Практика по теме · часть 1 из 3') }],

  ['final2', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sok', prompt: `Сок и вода смешаны в отношении 1 : 4. Сколько миллилитров сока в 2${NB}000 мл напитка?`,
    build: blanks([{ parts: [{ box: '400' }, ' миллилитров'], why: `Всего 1 + 4 = 5 частей, одна часть 2${NB}000 : 5 = 400 мл — это и есть сок.`, hint: 'Сколько всего частей? 1 + 4. Сок — одна часть.' }]),
  }, {
    id: 'p-delim', prompt: 'Раздели 35 в отношении 3 : 4.',
    build: blanks([{ parts: ['три части:  ', { box: '15' }, ',   четыре части:  ', { box: '20' }], why: '3 + 4 = 7 частей, одна часть 35 : 7 = 5; 3 · 5 = 15, 4 · 5 = 20.', hint: 'Сложи части, раздели 35 на их число, потом умножь.' }]),
  }], done, 'Практика по теме · часть 2 из 3') }],

  ['final3', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-masshtab', prompt: `Масштаб карты 1 : 200${NB}000, расстояние на карте 4 см. Сколько это километров?`,
    build: blanks([{ parts: [{ box: '8' }, ' километров'], why: `4 · 200${NB}000 = 800${NB}000 см = 8${NB}000 м = 8 км.`, hint: `1 см на карте — это 200${NB}000 см на местности. В 1 км — 100${NB}000 см.` }]),
  }, {
    id: 'p-edinicy', prompt: 'Найди отношение 40 см к 2 м и запиши его несократимой дробью.',
    build: blanks([{ parts: [{ box: '1/5', lowest: true }], why: '2 м = 200 см; 40 : 200 = 40/200 = 1/5.', hint: 'Сначала переведи метры в сантиметры: 2 м = 200 см.' }]),
  }], done, 'Практика по теме · часть 3 из 3') }],

  ['finish', 'Конец темы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
