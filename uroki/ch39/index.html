<script>
'use strict';
// Тема 9.2 «Перебор вариантов» (5 класс). Beat ids match papermorph/content/uroki/ch39/narration.ru.json.
const CHAPTER = { number: 39, label: '9.2', title: 'Перебор вариантов', minutes: 7, language: 'ru', next: '../ch40/' };

// Colours in this topic: the first choice (a shirt, the first digit) KL.NUM, the second choice (shorts, the second
// digit) KL.TWO, the third choice (a drink) KL.DEN, a count of variants and the rule KL.RULE.
const NUM = KL.NUM, TWO = KL.TWO, DEN = KL.DEN, RULE = KL.RULE;

/* ---------- small pictures ---------- */
const C39_SHIRT = 'M-20 -30L-42 -21L-54 -2L-39 7L-30 -4V32H30V-4L39 7L54 -2L42 -21L20 -30Q0 -16 -20 -30Z';
const C39_SHORTS = 'M-30 -22H30L35 22H7L0 0L-7 22H-35Z';
const C39_PIE = 'M-46 14Q-46 -30 0 -30Q46 -30 46 14Z';
const C39_GLASS = 'M-24 -36L-18 36H18L24 -36Z';
// An icon (a path d drawn around 0,0) at (x, y), scale s, filled col at opacity op; fades in at t0 (none: at once).
function c39Icon(p, d, x, y, t0, { col = NUM, s = 1, op = .85 } = {}) {
  const g = G(p, { x, y, s, o: t0 === undefined ? 1 : 0 });
  path(g, d, { fill: col, 'fill-opacity': op, stroke: COL.chalk, 'stroke-width': 2.5, 'stroke-linejoin': 'round' });
  if (t0 !== undefined) show(g, t0, .4);
  return g;
}
// A juice glass: an outline with the juice (col) in its lower part.
function c39Glass(p, x, y, t0) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  path(g, 'M-21 -8L-18 36H18L21 -8Z', { fill: TWO, 'fill-opacity': .85 });
  path(g, C39_GLASS, { fill: 'none', stroke: COL.chalk, 'stroke-width': 3, 'stroke-linejoin': 'round' });
  path(g, 'M6 -8L16 -54', { stroke: COL.chalk, 'stroke-width': 3, 'stroke-linecap': 'round' });
  if (t0 !== undefined) show(g, t0, .4);
  return g;
}
// A branch of a tree from (x1, y1) to (x2, y2), drawn on at t (none: drawn at once).
function c39Line(p, x1, y1, x2, y2, t, { col = COL.dim, w = 3, dur = .4 } = {}) {
  const e = path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, t === undefined ? {} : { d: 0 });
  if (t !== undefined) draw(e, t, dur);
  return e;
}
// A dot of a tree (a node) of radius r in col at (x, y), popping in at t.
function c39Dot(p, x, y, r, col, t) {
  const g = G(p, { x, y, s: t === undefined ? 1 : .2, o: t === undefined ? 1 : 0 });
  mk('circle', { r, fill: col, stroke: COL.board, 'stroke-width': 2 }, g);
  if (t !== undefined) pop(g, t);
  return g;
}
// A person or a team: a disc filled col with a dark letter or number on it; a group centred on (x, y).
function c39Chip(p, x, y, label, t0, { col = NUM, r = 42, size = 40 } = {}) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  mk('circle', { r, fill: col, 'fill-opacity': .9, stroke: COL.chalk, 'stroke-width': 3 }, g);
  T(g, String(label), { x: 0, y: size * .36, size, fill: COL.board, weight: 700, anchor: 'middle' });
  if (t0 !== undefined) show(g, t0, .35);
  return g;
}
// A digit card w × h centred on (x, y).
function c39Card(p, x, y, digit, t0, { w = 92, h = 112, size = 70 } = {}) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 12, fill: COL.chalk, 'fill-opacity': .08, stroke: COL.chalk, 'stroke-width': 3 }, g);
  T(g, String(digit), { x: 0, y: size * .35, size, fill: COL.chalk, font: MATH, anchor: 'middle' });
  if (t0 !== undefined) show(g, t0, .35);
  return g;
}
// One digit as a movable group centred on (x, y).
function c39Digit(p, digit, x, y, col, { size = 80, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  T(g, String(digit), { x: 0, y: size * .35, size, fill: col, font: MATH, anchor: 'middle' });
  return g;
}
// A two-digit number centred on (x, y): the first digit in NUM, the second in TWO. Returns { g, a, b }.
function c39Two(p, ab, x, y, t0, { size = 80 } = {}) {
  const g = G(p, { o: t0 === undefined ? 1 : 0 }), dx = size * .29;
  const a = c39Digit(g, ab[0], x - dx, y, NUM, { size }), b = c39Digit(g, ab[1], x + dx, y, TWO, { size });
  if (t0 !== undefined) show(g, t0, .35);
  return { g, a, b };
}
// Copies of two cards' digits fly into a two-digit number at (x, y) from t: the first digit (NUM) from card ca, the
// second (TWO) from card cb, `lag` apart. Returns the two copies.
function c39Fly(p, ca, cb, x, y, t, { size = 80, lag = .12, dur = .6 } = {}) {
  const dx = size * .29;
  return [[ca, -dx, NUM], [cb, dx, TWO]].map(([c, off, col], k) => {
    const { x: cx, y: cy } = st(c);
    const d = c39Digit(p, c._d, cx, cy, col, { size: 70, o: 0 });
    put(d, { s: 1 });
    show(d, t + k * lag, .1);
    tw(d, { x: x + off, y, s: size / 70 }, t + k * lag, dur, io);
    return d;
  });
}
// A book standing on a shelf: a group with its origin at the middle of the book's foot, the title up the spine.
function c39Book(p, x, y, w, h, title, fill, t0) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  mk('rect', { x: -w / 2, y: -h, width: w, height: h, rx: 6, fill, 'fill-opacity': .9, stroke: COL.chalk, 'stroke-width': 3 }, g);
  path(g, `M${-w / 2 + 10} ${-h + 18}H${w / 2 - 10}M${-w / 2 + 10} -18H${w / 2 - 10}`, { stroke: COL.board, 'stroke-width': 3, 'stroke-opacity': .5 });
  const sp = G(g, { x: 0, y: -h / 2, r: -90 });
  T(sp, title, { x: 0, y: 9, size: 25, fill: COL.board, weight: 700, anchor: 'middle' });
  if (t0 !== undefined) show(g, t0, .35);
  return g;
}
// A small picture of one order of the three books: three spines with their first letters, centred on (x, y).
const C39_BOOKS = [['АТЛАС', 'А', COL.rat, 250], ['ЗАДАЧНИК', 'З', COL.real, 210], ['СЛОВАРЬ', 'С', '#c9b28a', 230]];
function c39Order(p, order, x, y, t0) {
  const g = G(p, { x, y, o: t0 === undefined ? 1 : 0 });
  order.forEach((b, k) => {
    const bx = (k - 1) * 50;
    mk('rect', { x: bx - 21, y: -34, width: 42, height: 68, rx: 5, fill: C39_BOOKS[b][2], 'fill-opacity': .9, stroke: COL.chalk, 'stroke-width': 2 }, g);
    T(g, C39_BOOKS[b][1], { x: bx, y: 10, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
  });
  if (t0 !== undefined) show(g, t0, .35);
  return g;
}
// pulse() for a group drawn at scale base: grows to base · k and settles back to base (pulse() settles to 1).
function c39Pulse(e, t, k = 1.25, base = 1) { tw(e, { s: base * k }, t, .22, out); tw(e, { s: base }, t + .22, .4); }
// Points of a regular n-gon of radius R around (cx, cy), the first at the top.
const c39Ring = (n, cx, cy, R) => Array.from({ length: n }, (_, k) => [cx + R * Math.sin(2 * Math.PI * k / n), cy - R * Math.cos(2 * Math.PI * k / n)]);
// The segment between two chips of radius r (centres a, b), shortened so it starts and ends at their rims.
function c39Link(p, a, b, r, attrs, state) {
  const dx = b[0] - a[0], dy = b[1] - a[1], k = (r + 4) / Math.hypot(dx, dy);
  return path(p, `M${(a[0] + dx * k).toFixed(1)} ${(a[1] + dy * k).toFixed(1)}L${(b[0] - dx * k).toFixed(1)} ${(b[1] - dy * k).toFixed(1)}`, attrs, state);
}
// All pairs i < j of n things, in order.
const c39Pairs = n => { const out = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) out.push([i, j]); return out; };

const SHIRTS = ['белая', 'синяя', 'жёлтая'], SHORTS = ['чёрные', 'серые'], SHORT_OP = [.85, .3];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Перебор вариантов', (m, D) => klIntro(m, D, {
    unit: 'Глава 9 · Диаграммы, перебор, вероятность · Тема 9.2',
    title: 'Перебор вариантов',
    sub: 'Считаем варианты: ни одного не пропустить, ни одного не повторить',
    art: (g, t0) => {
      const RX = 610, RY = 640, AX = 700, BX = 790, ay = [580, 640, 700];
      c39Dot(g, RX, RY, 7, COL.chalk, t0);
      ay.forEach((y, i) => {
        c39Line(g, RX, RY, AX, y, t0 + .3 + i * .15, { w: 2.5 });
        c39Dot(g, AX, y, 9, NUM, t0 + .5 + i * .15);
        [-20, 20].forEach((dy, j) => {
          c39Line(g, AX, y, BX, y + dy, t0 + 1 + i * .3 + j * .1, { w: 2.5 });
          const leaf = c39Dot(g, BX, y + dy, 7, TWO, t0 + 1.2 + i * .3 + j * .1);
          pulse(leaf, t0 + 6.6 + (i * 2 + j) * .3, 1.8);
        });
      });
      const f = G(g, { x: 860, y: 656 });
      klRow(f, [{ m: '3', fill: NUM }, { m: ' · ' }, { m: '2', fill: TWO }, { m: ' = ' }, { m: '6', fill: RULE }], 0, 0, t0 + 2.4, { anchor: 'start', msize: 50 });
      pulse(f, t0 + 8.8, 1.15);
    },
  })],

  ['tree', 'Дерево вариантов', m => {
    const p = panel(0);
    klTitle(p, 'Сколько разных нарядов?', 'три футболки и двое шорт');
    const RX = 170, RY = 520, SX = 470, SY = [320, 520, 720], PX = 790, marks = ['w', 'b', 'y'];
    // The shirts appear on their names, already where the tree will reach them.
    const shirts = SY.map((y, i) => {
      const s = c39Icon(p, C39_SHIRT, SX, y, m(marks[i]), { col: NUM });
      klText(p, SHIRTS[i], SX, y + 68, m(marks[i]), { size: 26, fill: COL.dim, anchor: 'middle' });
      return s;
    });
    // The two shorts wait at the top right; copies fly from there to every shirt.
    const LEG = [[1190, 168], [1390, 168]];
    LEG.forEach(([x, y], j) => {
      const t = j ? m('grey') : m('pants', .2);
      c39Icon(p, C39_SHORTS, x, y, t, { col: TWO, s: .8, op: SHORT_OP[j] });
      klText(p, SHORTS[j], x + 40, y + 10, t, { size: 26, fill: COL.dim });
    });
    const ask = klText(p, '?', RX, RY + 22, m('ask'), { size: 72, fill: RULE, weight: 700, anchor: 'middle' });
    hide(ask, m('shirts'), .3);
    const root = c39Dot(p, RX, RY, 11, COL.chalk, m('shirts', .2));
    shirts.forEach((s, i) => pulse(s, m('shirts', 2.4 + i * .35), 1.15));
    SY.forEach((y, i) => c39Line(p, RX + 12, RY, SX - 58, y, m('br', i * .2)));
    pulse(root, m('br'), 1.4);
    // Each shirt gets the same two branches: black shorts above, grey below.
    const leaves = [];
    const grow = (i, t0, t1) => [t0, t1].forEach((t, j) => {
      const y = SY[i] + (j ? 50 : -50);
      c39Line(p, SX + 58, SY[i], PX - 40, y, t);
      const c = c39Icon(p, C39_SHORTS, LEG[j][0], LEG[j][1], undefined, { col: TWO, s: .8, op: SHORT_OP[j] });
      put(c, { o: 0 }); show(c, t, .1);
      tw(c, { x: PX, y, s: 1 }, t, .7, io);
      leaves[i * 2 + j] = c;
    });
    pulse(shirts[0], m('first'), 1.15);
    grow(0, m('sh1'), m('sh2'));
    pulse(shirts[1], m('same'), 1.15);
    grow(1, m('same', .3), m('same', .55));
    pulse(shirts[2], m('same2'), 1.15);
    grow(2, m('same2', .3), m('same2', .55));
    // Count the ends of the branches, then name the outfit at each end.
    leaves.forEach((c, k) => {
      const y = SY[k >> 1] + (k & 1 ? 50 : -50);
      klText(p, String(k + 1), 858, y + 13, m('c' + (k + 1)), { size: 38, fill: RULE, weight: 700, anchor: 'middle' });
      pulse(c, m('c' + (k + 1)), 1.2);
      klText(p, `${SHIRTS[k >> 1]} + ${SHORTS[k & 1]}`, 900, y + 10, m('list', .3 + k * .3), { size: 28 });
    });
  }],

  ['rule', 'Правило умножения', m => {
    const p = panel(0);
    klTitle(p, 'Почему шесть?');
    // The tree from the last beat, smaller, on the left.
    const RX = 120, RY = 470, SX = 320, SY = [290, 470, 650], PX = 530;
    c39Dot(p, RX, RY, 9, COL.chalk);
    const shirts = SY.map(y => { c39Line(p, RX + 10, RY, SX - 44, y); return c39Icon(p, C39_SHIRT, SX, y, undefined, { s: .75 }); });
    const nums = [];
    SY.forEach((y, i) => [-48, 48].forEach((dy, j) => {
      c39Line(p, SX + 44, y, PX - 26, y + dy);
      c39Icon(p, C39_SHORTS, PX, y + dy, undefined, { col: TWO, s: .65, op: SHORT_OP[j] });
      nums.push(G(p, { x: 592, y: y + dy }));
      T(nums[nums.length - 1], String(i * 2 + j + 1), { x: 0, y: 11, size: 32, fill: RULE, weight: 700, anchor: 'middle' });
    }));
    // Three groups of two branches.
    shirts.forEach((s, i) => { c39Pulse(s, m('groups', i * .45), 1.25, .75); [0, 1].forEach(j => pulse(nums[i * 2 + j], m('groups', .1 + i * .45), 1.3)); });
    // The table: a row for each shirt, a column for each shorts.
    const TX = 820, TY = 225, HW = 120, CW = 240, RH = 110, CX = [TX + HW + CW / 2, TX + HW + CW * 1.5], CY = [0, 1, 2].map(i => TY + 90 + RH * (i + .5));
    const tab = G(p, { o: 0 });
    let d = `M${TX} ${TY + 90}H${TX + HW + 2 * CW}`;
    for (let i = 1; i <= 3; i++) d += `M${TX} ${TY + 90 + i * RH}H${TX + HW + 2 * CW}`;
    for (let k = 0; k <= 2; k++) d += `M${TX + HW + k * CW} ${TY}V${TY + 90 + 3 * RH}`;
    path(tab, d, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .45 });
    const rowIcons = CY.map((y, i) => { const s = c39Icon(tab, C39_SHIRT, TX + HW / 2, y - 16, undefined, { s: .6 }); T(tab, SHIRTS[i], { x: TX + HW / 2, y: y + 36, size: 21, fill: COL.dim, anchor: 'middle' }); return s; });
    const colIcons = CX.map((x, j) => { const s = c39Icon(tab, C39_SHORTS, x - 58, TY + 45, undefined, { col: TWO, s: .7, op: SHORT_OP[j] }); T(tab, SHORTS[j], { x: x - 14, y: TY + 54, size: 26, fill: COL.dim }); return s; });
    show(tab, m('table'), .5);
    // Every end of the tree moves into its cell: shirt i, shorts j.
    nums.forEach((n, k) => tw(n, { x: CX[k & 1], y: CY[k >> 1], s: 1.4 }, m('table', .6 + k * .15), .8, io));
    // Three rows, two in each.
    const vb = path(p, `M806 ${TY + 96}H794V${TY + 84 + 3 * RH}H806`, { stroke: NUM, 'stroke-width': 3, fill: 'none' }, { d: 0 });
    draw(vb, m('rows'), .5);
    const three = G(p, { x: 768, y: CY[1] + 18 });
    klMath(three, ['3'], 0, 0, m('rows', .2), { size: 60, fill: NUM });
    rowIcons.forEach((s, i) => c39Pulse(s, m('rows', i * .2), 1.25, .6));
    const two = klBrace(p, TX + HW + 6, TX + HW + 2 * CW - 6, TY - 22, '2', m('cols'), { fill: TWO, size: 50 });
    colIcons.forEach((s, j) => c39Pulse(s, m('cols', .2 + j * .2), 1.25, .7));
    const res = G(p, { x: 1120, y: 740 });
    klRow(res, [{ m: '3', fill: NUM }, { m: ' · ' }, { m: '2', fill: TWO }, { m: ' = ' }, { m: '6', fill: RULE }], 0, 0, m('mult'), { msize: 80 });
    // The rule in words, its m and n tied to the picture.
    klRow(p, ['Правило умножения: если первое выбирают ', { m: 'm', fill: NUM }, ' способами, а второе — ', { m: 'n', fill: TWO }, ' способами,'], 800, 818, m('rule'), { size: 30, fill: RULE, weight: 600 });
    pulse(three, m('m'), 1.4);
    pulse(two, m('n'), 1.4);
    klRow(p, ['то пару можно выбрать ', { m: 'm · n', fill: RULE }, ' способами'], 800, 866, m('pair'), { size: 30, fill: RULE, weight: 600 });
    pulse(res, m('pair', .6), 1.15);
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    const PX = [560, 800, 1040], JX = [440, 680, 920, 1160];
    S.q1lines = [];
    PX.forEach(px => JX.forEach(jx => S.q1lines.push(path(p, `M${px} 240L${jx} 418`, { stroke: RULE, 'stroke-width': 3, 'stroke-linecap': 'round' }, { d: 0 }))));
    PX.forEach((x, i) => c39Icon(p, C39_PIE, x, 200, .2 + i * .1, { col: NUM }));
    JX.forEach((x, i) => c39Glass(p, x, 470, .4 + i * .1));
    klText(p, 'пирожки', 330, 212, .2, { size: 30, fill: NUM, weight: 600, anchor: 'end' });
    klText(p, 'соки', 330, 482, .4, { size: 30, fill: TWO, weight: 600, anchor: 'end' });
    S.q1res = klRow(p, [{ m: '3', fill: NUM }, { m: ' · ' }, { m: '4', fill: TWO }, { m: ' = ' }, { m: '12', fill: RULE }], 1420, 350, undefined, { msize: 60 });
    put(S.q1res, { o: 0 });
  }, { ask: done => quiz(BAND, [{
    id: 'c-pirozhok', prompt: 'В кафе 3 вида пирожков и 4 вида сока. Сколькими способами можно выбрать пирожок и сок?',
    build: blanks([{ parts: [{ box: '12' }, ' способами'], why: 'К каждому из трёх пирожков подходит любой из четырёх соков: 3 · 4 = 12.',
      hint: 'К каждому пирожку можно взять любой из соков. Перемножь.',
      fx: () => { S.q1lines.forEach((e, i) => fx(e, { d: 1 }, i * .08, .3)); fx(S.q1res, { o: 1 }, 1.1, .4); } }]),
  }], done) }],

  ['three', 'Три выбора', m => {
    const p = panel(0);
    klTitle(p, 'Обед из трёх блюд');
    const LX = [150, 420, 720, 1010];
    const ly = i => 240 + i * 24 + Math.floor(i / 4) * 8 + Math.floor(i / 12) * 16;
    const l2 = k => (ly(4 * k) + ly(4 * k + 3)) / 2, l1 = k => (l2(3 * k) + l2(3 * k + 2)) / 2, ry = (l1(0) + l1(1)) / 2;
    c39Dot(p, LX[0], ry, 10, COL.chalk);
    [['суп', NUM, 'h1'], ['второе', TWO, 'h2'], ['напиток', DEN, 'h3']].forEach(([s, col, mk3], k) => klText(p, s, LX[k + 1], 178, m(mk3), { size: 32, fill: col, weight: 700, anchor: 'middle' }));
    // Each level splits every branch of the one before in the same way.
    [0, 1].forEach(k => { c39Line(p, LX[0] + 10, ry, LX[1] - 13, l1(k), m('soup', k * .15)); c39Dot(p, LX[1], l1(k), 13, NUM, m('soup', .3 + k * .15)); });
    klMath(p, ['2'], LX[1], 220, m('soup', .5), { size: 34, fill: NUM });
    for (let k = 0; k < 6; k++) { c39Line(p, LX[1] + 13, l1(k / 3 | 0), LX[2] - 10, l2(k), m('main', .2 + k * .1)); c39Dot(p, LX[2], l2(k), 10, TWO, m('main', .4 + k * .1)); }
    klRow(p, [{ m: '2 · 3 = ' }, { m: '6', fill: RULE }], LX[2], 220, m('main', 1.2), { msize: 34 });
    for (let i = 0; i < 24; i++) { c39Line(p, LX[2] + 10, l2(i >> 2), LX[3] - 6, ly(i), m('drink', .2 + i * .05), { w: 2 }); c39Dot(p, LX[3], ly(i), 6, DEN, m('drink', .35 + i * .05)); }
    klRow(p, [{ m: '6 · 4 = ' }, { m: '24', fill: RULE }], LX[3], 220, m('drink', 1.6), { msize: 34 });
    klRow(p, [{ m: '2', fill: NUM }, { m: ' · ' }, { m: '3', fill: TWO }, { m: ' · ' }, { m: '4', fill: DEN }, { m: ' = ' }, { m: '24', fill: RULE }], 1310, 560, m('all'), { msize: 64 });
