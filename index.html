<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика в клеточку</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="css/site.css?v=11">
<script>
  /* Сохранённая тема применяется до отрисовки, чтобы страница не мигала. */
  try { var t = localStorage.getItem('mvk-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>

<div class="wrap" lang="ru">
  <header class="top">
    <a class="brand" href="#">Математика <b>в клеточку</b></a>
    <div class="tools">
      <nav aria-label="Разделы">
        <a href="#">Оглавление</a>
        <a href="#shpargalka">Шпаргалка</a>
        <a href="uroki/">Уроки у доски</a>
      </nav>
      <div class="theme" id="theme" role="group" aria-label="Тема оформления">
        <button type="button" data-mode="auto" aria-pressed="true" title="Как в системе">Авто</button>
        <button type="button" data-mode="light" aria-pressed="false">Светлая</button>
        <button type="button" data-mode="dark" aria-pressed="false">Тёмная</button>
      </div>
    </div>
  </header>
  <main id="app" aria-live="polite">
    <p>Загружаю темы…</p>
  </main>
  <footer>Математика 5–6 класса коротко и по-простому. Прогресс сохраняется только в этом браузере.</footer>
</div>

<script src="js/visuals.js?v=11"></script>
<script src="js/core.js?v=11"></script>
<script src="js/ch1-natural.js?v=11"></script>
<script src="js/ch2-divisibility.js?v=11"></script>
<script src="js/ch3-fractions.js?v=11"></script>
<script src="js/ch4-decimals.js?v=11"></script>
<script src="js/ch5-ratio.js?v=11"></script>
<script src="js/ch6-negative.js?v=11"></script>
<script src="js/ch7-geometry.js?v=11"></script>
<script src="js/ch8-problems.js?v=11"></script>
<script src="js/ch9-data.js?v=11"></script>
<script src="js/exams.js?v=11"></script>
<script src="js/final.js?v=11"></script>
<script src="uroki/course.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
